function buildReport(sel, from, to){
  const T = todayS(), L = [];
  const H = t => { L.push(''); L.push(t.toUpperCase()); L.push('-'.repeat(Math.min(60, t.length))); };
  L.push(`IMPULSO ACADÉMICO · Reporte del ${fmtDY(T)} (${hm(new Date())})`);
  const order = REPORTS.map(r=>r[0]).filter(k => sel.includes(k));
  for (const k of order){
    if (k==='resumen'){
      H('Resumen general');
      const m = mondayOf(T); let used=0, total=0;
      for (const key of IMP_KEYS){ const d = addDays(m, kDow(key)-1); total += S.cfg.capImpulso; used += Math.min(S.cfg.capImpulso, occ(d, kHour(key)).length); }
      const act = new Set(S.bk.filter(b => b.type==='impulso' && b.status==='conf' && b.start<=T && T<=b.end).map(b=>b.studentId));
      L.push(`Alumnos con plan pagado vigente: ${act.size}`);
      L.push(`Ocupación de Impulso esta semana: ${used} de ${total} lugares (${total?Math.round(used/total*100):0}%)`);
      L.push(`Prereservas esperando pago: ${S.bk.filter(b=>b.status==='pre').length} (vencidas: ${S.bk.filter(isOverdue).length})`);
      L.push(`En lista de espera: ${activeWait().length}`);
      L.push(`Alertas pendientes: ${pendingCount()}`);
    }
    if (k==='alertas'){
      H('Alertas pendientes');
      const al = computeAlerts().filter(a => !S.alertsDone[a.key] && a.sev!=='info');
      if (!al.length) L.push('Sin alertas pendientes.');
      al.forEach(a => L.push(`${a.sev==='crit'?'[URGENTE] ':'• '}${a.title}\n   ${a.body}`));
    }
    if (k==='ocupacion'){
      H(`Ocupación de Impulso (próximas ${S.cfg.lookWeeks} semanas)`);
      for (const key of IMP_KEYS){
        const vals = [...occurrences(key, T, addDays(T, 7*S.cfg.lookWeeks-1))].map(d => `${pd(d).getDate()}/${pd(d).getMonth()+1}: ${occ(d,kHour(key)).length}/${S.cfg.capImpulso}`);
        L.push(`${DOWL[kDow(key)].padEnd(10)} ${rangeLbl(kHour(key)).padEnd(20)} ${vals.join('  ')}`);
      }
    }
    if (k==='pagos'){
      H(`Pagos verificados del ${fmtDY(from)} al ${fmtDY(to)}`);
      const ps = S.bk.filter(b => b.paidAt && b.paidAt.slice(0,10) >= from && b.paidAt.slice(0,10) <= to).sort((a,b)=>a.paidAt<b.paidAt?-1:1);
      let sum = 0;
      ps.forEach(b => { sum += Number(b.amount)||0; const d = new Date(b.paidAt); L.push(`${fmtDY(ds(d))}  ${labelOf(stu(b.studentId)).padEnd(26)} ${b.type==='impulso'?`Impulso ${planName(b.plan)} (${fmtD(b.start)}–${fmtD(b.end)})`:`Tutoría ${fmtD(b.date)}`}  ${b.amount?'$'+Number(b.amount).toLocaleString('es-MX'):'(sin monto)'}${b.status==='cancel'?' · CANCELADA':''}`); });
      L.push(ps.length ? `Total registrado: $${sum.toLocaleString('es-MX')} en ${ps.length} pago(s)` : 'Sin pagos en el rango.');
    }
    if (k==='prereservas'){
      H('Prereservas esperando pago');
      const ps = S.bk.filter(b => b.status==='pre').sort((a,b) => deadline(a)-deadline(b));
      if (!ps.length) L.push('Ninguna.');
      ps.forEach(b => L.push(`${isOverdue(b)?'[VENCIDA] ':''}${labelOf(stu(b.studentId))} · ${b.type==='impulso'?'Impulso '+fmtSlots(b.slots)+' desde '+fmtD(b.start):'Tutoría '+fmtD(b.date)+' '+hourLbl(b.hour)} · límite ${fmtDT(deadline(b))}`));
    }
    if (k==='vencimientos'){
      H('Planes que terminan en los próximos 14 días');
      const vs = S.bk.filter(b => b.type==='impulso' && b.status==='conf' && b.end>=T && b.end<=addDays(T,14)).sort((a,b)=>a.end<b.end?-1:1);
      if (!vs.length) L.push('Ninguno.');
      vs.forEach(b => { const r = renewalOf(b); L.push(`${labelOf(stu(b.studentId))} · termina ${fmtD(b.end)} · ${fmtSlots(b.slots)} · ${r ? (r.status==='conf'?'renovación pagada':'renovación en prereserva') : 'sin renovar (límite '+fmtDT(renewalDeadline(b))+')'}`); });
    }
    if (k==='espera'){
      H('Lista de espera (en orden de prioridad)');
      const ws = activeWait(); if (!ws.length) L.push('Vacía.');
      ws.forEach((w,i) => { const s = stu(w.studentId), av = availableFrom(w); L.push(`${i+1}. ${labelOf(s)} (${planName(s.plan)}, desde ${fmtDY(s.since)}) · busca ${fmtSlots(w.slots)} · ${av?'lugar desde '+fmtD(av):'sin lugar aún'}`); });
    }
    if (k==='tutorias'){
      H(`Tutorías y reposiciones del ${fmtDY(from)} al ${fmtDY(to)}`);
      const ts = S.bk.filter(b => (b.type==='tutoria'||b.type==='repo') && b.date>=from && b.date<=to && b.status!=='cancel').sort((a,b)=>(a.date+pad(a.hour))<(b.date+pad(b.hour))?-1:1);
      if (!ts.length) L.push('Ninguna.');
      ts.forEach(b => L.push(`${fmtD(b.date)} ${hourLbl(b.hour)} · ${b.type==='repo'?'Reposición':'Tutoría'} · ${labelOf(stu(b.studentId))} · ${b.status==='pre'?'prereserva':b.status==='desplazada'?'desplazada':'confirmada'}`));
    }
    if (k==='alumnos'){
      H('Alumnos con plan vigente');
      const as = S.bk.filter(b => b.type==='impulso' && b.status==='conf' && b.start<=T && T<=b.end).sort((a,b)=>stu(a.studentId).name.localeCompare(stu(b.studentId).name,'es'));
      if (!as.length) L.push('Ninguno.');
      as.forEach(b => { const s = stu(b.studentId); L.push(`${labelOf(s)} · ${planName(b.plan)} · ${fmtSlots(b.slots)} · hasta ${fmtD(b.end)} · tutor ${s.tutor||'—'} ${s.phone||''}`); });
    }
  }
  return L.join('\n');
}

function bindSettings(){
  const nw = $('#pw-new');
  nw.oninput = () => { $('#pw-rules').innerHTML = pwChecks(nw.value).map(([l,ok])=>`<li class="${ok?'ok':''}">${l}</li>`).join(''); };
  $('#pw-form').onsubmit = async e => {
    e.preventDefault(); const err = $('#pw-err'); err.textContent = '';
    const cur = $('#pw-cur').value, np = nw.value, rp = $('#pw-rep').value;
    const a = S.auth;
    const curOk = a ? (await pbkdf2(cur, a.salt, a.iter)) === a.hash : cur === INITIAL_PASS;
    if (!curOk) return err.textContent = 'La contraseña actual no es correcta.';
    if (!pwChecks(np).every(x=>x[1])) return err.textContent = 'La nueva contraseña no cumple todos los requisitos.';
    if (np !== rp) return err.textContent = 'Las contraseñas nuevas no coinciden.';
    if (np === cur) return err.textContent = 'La nueva contraseña debe ser distinta a la actual.';
    if (await dbSet('config', 'auth', await makeAuth(a?.email || INITIAL_EMAIL, np, false))){ toast('Contraseña actualizada'); $('#pw-form').reset(); }
  };
  $('#cfg-form').onsubmit = async e => {
    e.preventDefault();
    const n = (id, min) => { const v = Number($(id).value); return Number.isFinite(v) && v >= min ? Math.floor(v) : null; };
    const capI = n('#cf-capi',1), capT = n('#cf-capt',1), low = n('#cf-low',0), ren = n('#cf-ren',1), look = n('#cf-look',1);
    if ([capI,capT,low,ren,look].some(x => x===null)) return $('#cf-err').textContent = 'Revisa los números: deben ser enteros positivos.';
    const plans = {};
    for (const p of Object.keys(S.cfg.plans)) plans[p] = { name:$(`#cp-${p}-n`).value.trim()||S.cfg.plans[p].name, hours:Number($(`#cp-${p}-h`).value), repos:Math.max(0,Number($(`#cp-${p}-r`).value)||0), price:Number($(`#cp-${p}-p`).value)||0 };
    const tpl = {}; for (const k of Object.keys(TPL_NAMES)) tpl[k] = $(`#tp-${k}`).value;
    const doc = { capImpulso:capI, capTutoria:capT, lowThreshold:low, renewDays:ren, lookWeeks:Math.min(12,look), priority:$('#cf-prio').value,
      reportEmail:$('#cf-mail').value.trim()||INITIAL_EMAIL, tutoriaPrice:Number($('#cf-tp').value)||0, plans, tpl };
    if (await dbSet('config', 'main', doc)) toast('Ajustes guardados');
  };
}

const ACT = {

  close: () => closeModal(),
  logout: () => logout(),
  view: el => { closeModal(); go(el.dataset.v); },
  calmode: el => { S.cal.mode = el.dataset.m; renderMain(); },
  calnav: el => { const n = +el.dataset.n, c = S.cal;
    if (c.mode==='dia'){ let d = addDays(c.date, n); if (dowOf(d)===0) d = addDays(d, n); c.date = d; }
    if (c.mode==='semana') c.date = addDays(c.date, 7*n);
    if (c.mode==='mes'){ const d = pd(c.date); c.date = ds(new Date(d.getFullYear(), d.getMonth()+n, 1)); }
    renderMain(); },
  caltoday: () => { S.cal.date = todayS(); renderMain(); },

/* ---------- dinero (siempre en centavos enteros) ---------- */
const cents = v => Math.round(Number(v || 0) * 100);
const money = c => '$' + (c/100).toLocaleString('es-MX', { minimumFractionDigits:2, maximumFractionDigits:2 });
const dec2 = c => (c/100).toFixed(2);
/* IVA de un importe en centavos, redondeado a centavos (mitad hacia arriba) */
const iva16 = baseC => Math.floor((baseC * 16 + 50) / 100);
/* Precio con IVA incluido -> base sin IVA tal que base + IVA(base) = total exacto */
function desglose(totalC){
  const b0 = Math.round(totalC * 100 / 116);
  for (const d of [0,-1,1,-2,2,-3,3]){
    const b = b0 + d;
    if (b >= 0 && b + iva16(b) === totalC) return { base:b, iva:iva16(b), total:totalC, dif:0 };
  }
  return { base:b0, iva:iva16(b0), total:b0 + iva16(b0), dif: b0 + iva16(b0) - totalC };
}
function tasaResico(baseC){
  for (const [lim, t] of FX_TASAS) if (baseC <= lim) return t;
  return null;
}

/* ---------- fechas ---------- */
const ymLabel = ym => { const [y,m] = ym.split('-').map(Number); return `${MESL[m-1]} ${y}`; };
const ymNext = ym => { const [y,m] = ym.split('-').map(Number); return m===12 ? `${y+1}-01` : `${y}-${pad(m+1)}`; };
const ymPrev = ym => { const [y,m] = ym.split('-').map(Number); return m===1 ? `${y-1}-12` : `${y}-${pad(m-1)}`; };
/* Día 17 del mes siguiente; si cae en sábado o domingo se recorre al lunes (no considera días festivos) */
function dueDate(ym){
  let d = ymNext(ym) + '-17';
  while (dowOf(d)===0 || dowOf(d)===6) d = addDays(d, 1);
  return d;
}
const isoLocal = iso => ds(new Date(iso));

/* ---------- validaciones de datos fiscales ---------- */
const normName = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
function rfcTipo(rfc){
  const r = String(rfc||'').toUpperCase();
  if (/^[A-ZÑ&]{4}\d{6}[A-Z0-9]{3}$/.test(r)) return 'pf';
  if (/^[A-ZÑ&]{3}\d{6}[A-Z0-9]{3}$/.test(r)) return 'pm';
  return null;
}
function checkClient(c){
  const errs = [], warns = [];
  if (!c) return { errs:['No hay datos fiscales del cliente.'], warns };
  const t = rfcTipo(c.rfc);
  if (!c.rfc) errs.push('Falta el RFC.');
  else if (c.rfc==='XAXX010101000' || c.rfc==='XEXX010101000') errs.push('El RFC genérico no sirve para una factura a nombre de una persona. Si no tiene RFC, su pago va en la factura global.');
  else if (!t) errs.push('El RFC no tiene un formato válido (13 caracteres para persona física, 12 para empresa).');
  if (!c.nombre) errs.push('Falta el nombre o razón social.');
  else if (t==='pm' && /\b(S\.?\s?A\.?|S\.?\s?C\.?|DE C\.?\s?V\.?|S\.? DE R\.?L\.?|A\.?\s?C\.?)\s*$/i.test(c.nombre)) warns.push('Para empresas se escribe el nombre sin el régimen societario (sin “S.A. de C.V.”), tal como en la constancia.');
  if (!/^\d{5}$/.test(c.cp||'')) errs.push('El código postal debe tener 5 dígitos (el de su constancia, no el de su casa si son distintos).');
  if (!c.regimen) errs.push('Falta el régimen fiscal.');
  else if (t==='pf' && ['601','603'].includes(c.regimen)) errs.push('Ese régimen es de empresas y el RFC es de persona física.');
  else if (t==='pm' && !['601','603','626'].includes(c.regimen)) errs.push('Ese régimen es de personas físicas y el RFC es de empresa.');
  if (!c.uso) errs.push('Falta el uso del CFDI.');
  else if (c.uso==='G03' && FX_NO_G03.includes(c.regimen)) errs.push(`Con el régimen ${c.regimen} el uso G03 no es válido. Usa S01 (Sin efectos fiscales).`);
  else if (c.uso==='G03') warns.push('Las clases de regularización de un hijo no son un gasto de negocio: lo correcto es S01, salvo que el cliente te indique otra cosa por escrito.');
  if (t==='pm') warns.push('Es una empresa: las personas morales retienen ISR de 1.25% a quien tributa en RESICO (art. 113-J LISR) y pueden retener IVA. Confirma con su área de pagos antes de facturar; el total a pagar cambia.');
  if (!c.email) warns.push('No hay correo: la factura solo podrá enviarse por WhatsApp.');
  if (c.csfFecha && daysBetween(c.csfFecha, todayS()) > 365) warns.push('La constancia que revisaste tiene más de un año: pide una actual para evitar rechazos.');
  return { errs, warns };
}
function checkEmisor(){
  const e = S.fcfg.emisor, errs = [];
  if (rfcTipo(e.rfc)!=='pf') errs.push('RFC del emisor');
  if (!e.nombre) errs.push('nombre del emisor');
  if (!/^\d{5}$/.test(e.cp||'')) errs.push('código postal de expedición');
  if (!S.fcfg.claveProdServ) errs.push('clave de producto o servicio');
  return errs;
}

/* ---------- cobros (pagos registrados en la agenda + manuales) ---------- */
function conceptoDe(b){
  const s = stu(b.studentId);
  const periodo = b.type==='impulso' ? `del ${fmtDY(b.start)} al ${fmtDY(b.end)}` : fmtDY(b.date);
  const plan = b.type==='impulso' ? planLabel(b.plan) : b.type==='tutoria' ? 'Tutoría' : 'Reposición';
  return fill(S.fcfg.conceptoTpl, { plan, alumno: s.name, periodo });
}
function allCobros(){
  const key = 'fx-cobros-' + S.ver + '-' + (S.fxVer||0);
  if (S.memo[key]) return S.memo[key];
  const out = [];
  for (const b of S.bk){
    if (!b.paidAt) continue;
    const m = S.cobros[b.id] || {};
    out.push({ id:b.id, src:'agenda', bookingId:b.id, studentId:b.studentId, fecha: m.fecha || isoLocal(b.paidAt),
      monto: cents(b.amount), concepto: m.concepto || conceptoDe(b), formaPago: m.formaPago || '', pideFactura: !!m.pideFactura,
      clientId: m.clientId || defaultClientId(b.studentId), nota: m.nota || '', cancelada: b.status==='cancel', meta: m });
  }
  for (const [id, m] of Object.entries(S.cobros)){
    if (!m.manual) continue;
    out.push({ id, src:'manual', studentId: m.studentId || '', fecha: m.fecha, monto: cents(m.monto), concepto: m.concepto || '',
      formaPago: m.formaPago || '', pideFactura: !!m.pideFactura, clientId: m.clientId || defaultClientId(m.studentId), nota: m.nota || '', cancelada: false, meta: m });
  }
  out.sort((a,b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  return (S.memo[key] = out);
}
function defaultClientId(studentId){
  if (!studentId) return '';
  const c = Object.values(S.fiscal).find(f => (f.studentIds||[]).includes(studentId));
  return c ? c.id : '';
}
const vigentes = () => Object.values(S.invoices).filter(i => i.status!=='cancelada');
function coverage(){
  const key = 'fx-cov-' + (S.fxVer||0);
  if (S.memo[key]) return S.memo[key];
  const m = {};
  for (const inv of vigentes()) for (const cid of inv.cobroIds||[]) (m[cid] = m[cid] || []).push(inv);
  return (S.memo[key] = m);
}
function cobroEstado(c){
  const inv = coverage()[c.id] || [];
  if (inv.length > 1) return { k:'dup', inv };
  if (inv.length === 1) return { k: inv[0].kind==='global' ? 'global' : 'individual', inv };
  return { k: c.pideFactura ? 'porFacturar' : 'paraGlobal', inv };
}
const ESTADO_CHIP = {
  individual: '<span class="chip conf">Facturado</span>',
  global: '<span class="chip conf">En factura global</span>',
  porFacturar: '<span class="chip pre">Por facturar</span>',

};
const cobrosDe = ym => allCobros().filter(c => c.fecha.slice(0,7) === ym);
function factPendientes(){
  if (!S.loaded.cobros || !S.loaded.invoices) return 0;
  const cur = todayS().slice(0,7);
  let n = 0;
  const mesesSinGlobal = new Set();
  for (const c of allCobros()){
    if (c.cancelada || !c.monto) continue;
    const e = cobroEstado(c).k;
    if (e==='porFacturar' || e==='dup') n++;
    if (e==='paraGlobal' && c.fecha.slice(0,7) < cur) mesesSinGlobal.add(c.fecha.slice(0,7));

  return n + mesesSinGlobal.size;

async function saveCobroMeta(c, patch){
  const d = Object.assign({}, S.cobros[c.id] || {}, patch);
  if (c.src==='agenda') d.bookingId = c.bookingId;
  delete d.id;

/* Folio de nota para cada operación de la factura global (NoIdentificacion) */
async function ensureNotas(list){
  const max = {};
  for (const c of allCobros()){ const m = /^N(\d{4})-(\d+)$/.exec(c.nota||''); if (m) max[m[1]] = Math.max(max[m[1]]||0, +m[2]); }
  let n = 0;
  for (const c of list){
    if (c.nota) continue;
    const y = c.fecha.slice(0,4); max[y] = (max[y]||0) + 1;
    c.nota = `N${y}-${String(max[y]).padStart(4,'0')}`;
    await saveCobroMeta(c, { nota: c.nota }); n++;
  }
  return n;
}
/* Forma de pago para varias operaciones: la del mayor monto (criterio de la Guía de llenado del Anexo 20) */
function formaMayor(list){
  const t = {};
  list.forEach(c => { if (c.formaPago) t[c.formaPago] = (t[c.formaPago]||0) + c.monto; });
  const k = Object.keys(t).sort((a,b) => t[b]-t[a])[0];
  return k || '';
}

/* ---------- archivos en GitHub ---------- */
function bytesToB64(buf){ const by = new Uint8Array(buf); let bin = ''; for (let i=0;i<by.length;i+=0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i+0x8000)); return btoa(bin); }
async function ghPutFile(gc, path, buf, message){
  const url = `/repos/${gc.owner}/${gc.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  let sha = null;
  const g = await ghFetch(gc, `${url}?ref=${encodeURIComponent(gc.branch||'main')}`);
  if (g.ok){ const j = await g.json(); sha = j.sha; } else if (g.status!==404){ throw new Error(ghErrText(g.status)); }
  const body = { message, content: bytesToB64(buf), branch: gc.branch||'main' };
  if (sha) body.sha = sha;
  const p = await ghFetch(gc, url, { method:'PUT', body: JSON.stringify(body) });
  if (!p.ok){ let j = null; try { j = await p.json(); } catch(e){} throw new Error(ghErrText(p.status, j)); }
  return true;
}
async function ghGetFile(gc, path){
  const url = `/repos/${gc.owner}/${gc.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(gc.branch||'main')}`;
  const r = await ghFetch(gc, url, { headers:{ Accept:'application/vnd.github.raw+json' } });
  if (!r.ok) throw new Error(ghErrText(r.status));
  return r.arrayBuffer();
}
async function ghDispatch(gc, workflow, inputs){
  const r = await ghFetch(gc, `/repos/${gc.owner}/${gc.repo}/actions/workflows/${workflow}/dispatches`, { method:'POST', body: JSON.stringify({ ref: gc.branch||'main', inputs }) });
  if (r.status===204) return { ok:true };
  if (r.status===404){
    /* Distinguir: falta el archivo del envío, o el token no tiene permiso de Actions (GitHub responde 404 en ambos casos) */
    let existe = false;
    try { existe = (await ghFetch(gc, `/repos/${gc.owner}/${gc.repo}/contents/.github/workflows/${workflow}?ref=${encodeURIComponent(gc.branch||'main')}`)).ok; } catch(e){}
    return { ok:false, msg: existe
      ? 'El envío de facturas sí está en el repositorio, pero el token no tiene permiso para usarlo. En GitHub edita el token y dale “Actions: Read and write”.'
      : 'Falta instalar el envío de facturas en el repositorio de datos. Ve a Facturación → Configuración y pulsa “Instalar / actualizar envío por correo”; luego vuelve a enviar.' };
  }
  if (r.status===403) return { ok:false, msg:'El token no tiene el permiso “Actions: Read and write”.' };
  if (r.status===422) return { ok:false, msg:'GitHub rechazó los datos del envío (422). Instala de nuevo el envío por correo en Facturación → Configuración.' };
  return { ok:false, msg:`GitHub respondió ${r.status}.` };
}

/* ---------- lectura del XML (CFDI 4.0) ---------- */
function parseCfdi(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('El archivo no es un XML válido.');
  const all = [...doc.getElementsByTagName('*')];
  const one = n => all.find(e => e.localName===n);
  const comp = doc.documentElement;
  if (!comp || comp.localName!=='Comprobante') throw new Error('El XML no es una factura (CFDI).');
  const a = (el, n) => el ? (el.getAttribute(n) ?? '') : '';
  const emi = one('Emisor'), rec = one('Receptor'), tfd = one('TimbreFiscalDigital'), glo = one('InformacionGlobal');
  const imp = [...comp.children].find(e => e.localName==='Impuestos');
  const conceptos = all.filter(e => e.localName==='Concepto').map(e => ({ clave:a(e,'ClaveProdServ'), noId:a(e,'NoIdentificacion'), cantidad:a(e,'Cantidad'), unidad:a(e,'ClaveUnidad'), desc:a(e,'Descripcion'), valor:cents(a(e,'ValorUnitario')), importe:cents(a(e,'Importe')), objeto:a(e,'ObjetoImp') }));
  if (!tfd) throw new Error('El XML no tiene timbre fiscal (UUID). Descarga el XML timbrado desde el portal del SAT.');
  return {
    version: a(comp,'Version'), serie: a(comp,'Serie'), folio: a(comp,'Folio'), fecha: a(comp,'Fecha'), subtotal: cents(a(comp,'SubTotal')), total: cents(a(comp,'Total')),
    moneda: a(comp,'Moneda'), tipo: a(comp,'TipoDeComprobante'), metodo: a(comp,'MetodoPago'), forma: a(comp,'FormaPago'), lugar: a(comp,'LugarExpedicion'), exportacion: a(comp,'Exportacion'),
    emisor: { rfc: a(emi,'Rfc'), nombre: a(emi,'Nombre'), regimen: a(emi,'RegimenFiscal') },
    receptor: { rfc: a(rec,'Rfc'), nombre: a(rec,'Nombre'), cp: a(rec,'DomicilioFiscalReceptor'), regimen: a(rec,'RegimenFiscalReceptor'), uso: a(rec,'UsoCFDI') },
    global: glo ? { periodicidad: a(glo,'Periodicidad'), meses: a(glo,'Meses'), anio: a(glo,'Año') } : null,
    iva: imp ? cents(a(imp,'TotalImpuestosTrasladados')) : 0, retenido: imp ? cents(a(imp,'TotalImpuestosRetenidos')) : 0,
    conceptos, uuid: a(tfd,'UUID').toUpperCase(), fechaTimbrado: a(tfd,'FechaTimbrado')
  };
}
/* Lo que la factura debería decir, según los cobros que ampara */
function expectedFor(kind, cobroIds, ym){
  const list = cobroIds.map(id => allCobros().find(c => c.id===id)).filter(Boolean);
  const totalC = list.reduce((s,c) => s + c.monto, 0);
  const parts = list.map(c => desglose(c.monto));
  const base = parts.reduce((s,p) => s + p.base, 0), iva = parts.reduce((s,p) => s + p.iva, 0);
  const e = S.fcfg.emisor;
  if (kind==='global') return { kind, list, total: base + iva, base, iva, forma: formaMayor(list),
    receptor: { rfc:FX_GLOBAL.rfc, nombre:FX_GLOBAL.nombre, cp:e.cp, regimen:FX_GLOBAL.regimen, uso:FX_GLOBAL.uso }, ym, emisorRfc: e.rfc };
  const cli = S.fiscal[list[0] ? list[0].clientId : ''] || null;
  return { kind, list, total: base + iva, base, iva, forma: formaMayor(list), cli,
    receptor: cli ? { rfc:cli.rfc, nombre:cli.nombre, cp:cli.cp, regimen:cli.regimen, uso:cli.uso } : null, ym: list[0] ? list[0].fecha.slice(0,7) : ym, emisorRfc: e.rfc };
}
function compareCfdi(x, exp){
  const errs = [], warns = [], oks = [];
  const eq = (label, got, want, bad) => { if (String(got) === String(want)) oks.push(label); else (bad || errs).push(`${label}: la factura dice “${got || '(vacío)'}” y debería decir “${want || '(vacío)'}”.`); };
  if (x.version!=='4.0') warns.push(`La factura es versión ${x.version || '(sin versión)'}; se esperaba 4.0.`);
  if (x.tipo!=='I') errs.push(`El tipo de comprobante es “${x.tipo}”; debe ser I (Ingreso).`);
  if (exp.emisorRfc) eq('RFC del emisor', x.emisor.rfc, exp.emisorRfc);
  if (Object.values(S.invoices).some(i => i.uuid===x.uuid)) errs.push('Esta factura (mismo folio fiscal) ya está registrada.');
  if (exp.receptor){
    eq('RFC del receptor', x.receptor.rfc, exp.receptor.rfc);
    if (normName(x.receptor.nombre) === normName(exp.receptor.nombre)){
      if (x.receptor.nombre.trim() !== exp.receptor.nombre.trim()) warns.push('El nombre del receptor coincide salvo acentos, mayúsculas o espacios. Revisa que esté igual que en su constancia.');
      else oks.push('Nombre del receptor');
    } else errs.push(`Nombre del receptor: la factura dice “${x.receptor.nombre}” y debería decir “${exp.receptor.nombre}”.`);
    eq('Código postal del receptor', x.receptor.cp, exp.receptor.cp);
    eq('Régimen fiscal del receptor', x.receptor.regimen, exp.receptor.regimen);
    eq('Uso del CFDI', x.receptor.uso, exp.receptor.uso);
  } else warns.push('No hay datos fiscales del cliente para comparar el receptor.');
  eq('Método de pago', x.metodo, 'PUE');
  if (exp.forma) eq('Forma de pago', x.forma, exp.forma); else warns.push('No registraste la forma de pago de los cobros; no se pudo comparar.');
  eq('Moneda', x.moneda, 'MXN');
  if (S.fcfg.emisor.cp) eq('Lugar de expedición', x.lugar, S.fcfg.emisor.cp, warns);
  if (Math.abs(x.total - exp.total) <= 1) oks.push('Total'); else errs.push(`Total: la factura dice ${money(x.total)} y los cobros suman ${money(exp.total)}.`);
  if (Math.abs(x.iva - exp.iva) > 1 * Math.max(1, exp.list.length)) warns.push(`IVA: la factura trae ${money(x.iva)} y lo esperado es ${money(exp.iva)}.`);
  if (x.retenido) warns.push(`La factura tiene retenciones por ${money(x.retenido)}.`);
  if (exp.kind==='global'){
    if (!x.global) errs.push('No tiene la sección de “Información global”: no es una factura global.');
    else {
      const [y, m] = exp.ym.split('-');
      eq('Periodicidad', x.global.periodicidad, FX_GLOBAL.periodicidad, warns);
      eq('Mes de la global', x.global.meses, m);
      eq('Año de la global', x.global.anio, y);
    }
    if (x.conceptos.length !== exp.list.length) errs.push(`La factura tiene ${x.conceptos.length} conceptos y hay ${exp.list.length} cobros para la global.`);
    const notas = new Set(exp.list.map(c => c.nota).filter(Boolean));
    const faltan = x.conceptos.filter(c => c.noId && !notas.has(c.noId)).length;
    if (notas.size && faltan) warns.push(`${faltan} concepto(s) traen un número de nota que no corresponde a los cobros del mes.`);
  } else {
    if (x.global) errs.push('Trae “Información global”: esta factura es global y no individual.');
    if (S.fcfg.claveProdServ && x.conceptos.some(c => c.clave !== S.fcfg.claveProdServ)) warns.push(`La clave de producto no es la que configuraste (${S.fcfg.claveProdServ}).`);
    if (exp.list[0] && x.fecha.slice(0,7) !== exp.list[0].fecha.slice(0,7)) warns.push(`La factura es de ${ymLabel(x.fecha.slice(0,7))} y el cobro es de ${ymLabel(exp.list[0].fecha.slice(0,7))}: en la declaración el portal la precarga en el mes de la factura. Declara el ingreso en el mes en que cobraste.`);
  }
  return { errs, warns, oks };
}

/* ---------- Resumen del mes (RESICO) ---------- */
function fxResumen(){
  const ym = S.factYm, y = ym.slice(0,4);
  const list = cobrosDe(ym).filter(c => c.monto && !c.cancelada);
  let tot = 0, base = 0, iva = 0;
  list.forEach(c => { const d = desglose(c.monto); tot += c.monto; base += d.base; iva += d.iva; });
  const invInd = vigentes().filter(i => i.kind!=='global' && (i.fecha||'').slice(0,7) === ym);
  const invGlo = vigentes().filter(i => i.kind==='global' && i.ym === ym);
  const inv = [...invInd, ...invGlo];
  const gloOtroMes = invGlo.filter(i => (i.fecha||'').slice(0,7) !== ym);
  const sub = l => l.reduce((s,i) => s + (i.subtotal||0), 0), ivs = l => l.reduce((s,i) => s + (i.iva||0), 0);
  const factBase = sub(inv), factIva = ivs(inv);
  const sinFactura = list.filter(c => ['porFacturar','paraGlobal','dup'].includes(cobroEstado(c).k));
  const tasa = tasaResico(base);
  const isr = tasa===null ? null : Math.round(base * tasa / 100);
  const mes = S.fcfg.meses[ym] || {};
  const acred = cents(mes.ivaAcred);
  const ivaNeto = iva - acred;
  let anual = 0; allCobros().forEach(c => { if (c.fecha.slice(0,4)===y && c.monto && !c.cancelada) anual += desglose(c.monto).base; });
  const pct = Math.round(anual * 1000 / FX_LIMITE_ANUAL) / 10;
  const due = dueDate(ym);
  const row = (k, v, cls='') => `<dt>${k}</dt><dd class="${cls}">${v}</dd>`;
  return `<div class="grid2" style="align-items:start">
    <div class="panel stack"><h3>Lo que cobraste en ${ymLabel(ym)}</h3>
      <dl class="kv">${row('Cobrado (con IVA)', money(tot))}${row('Ingresos sin IVA', `<b>${money(base)}</b>`)}${row('IVA cobrado 16%', money(iva))}${row('Pagos', list.length)}</dl>
      ${sinFactura.length ? `<div class="note bad">${sinFactura.length} pago(s) del mes aún no están amparados por una factura. En RESICO el ISR se calcula sobre ingresos amparados por factura (art. 113-E LISR): factúralos o inclúyelos en la global.</div>` : list.length ? '<div class="note ok">Todos los pagos del mes están amparados por una factura.</div>' : ''}
    </div>
    <div class="panel stack"><h3>Facturas de ${ymLabel(ym)}</h3>
      <dl class="kv">${row('Individuales (con fecha del mes)', `${invInd.length} · ${money(sub(invInd))} sin IVA`)}${row('Global del mes', `${invGlo.length} · ${money(sub(invGlo))} sin IVA`)}${row('Total facturado sin IVA', `<b>${money(factBase)}</b>`)}${row('IVA facturado', money(factIva))}</dl>
      ${factBase !== base ? `<div class="note warn">Lo facturado (${money(factBase)}) no coincide con lo cobrado en el mes (${money(base)}). Revisa qué pagos faltan por facturar o si alguna factura individual salió con fecha de otro mes: el portal del SAT precarga las facturas por su fecha, y en RESICO el ingreso se declara en el mes en que se cobró.</div>` : ''}
      ${gloOtroMes.length ? `<div class="note warn">La factura global de este mes tiene fecha de ${ymLabel(gloOtroMes[0].fecha.slice(0,7))}. Revisa en qué mes la precarga el portal y declara los ingresos en ${ymLabel(ym)}, que es cuando se cobraron.</div>` : ''}
    </div>
    <div class="panel stack"><h3>Estimado para la declaración</h3>
      <dl class="kv">
        ${row('ISR RESICO', tasa===null ? 'Fuera de las tasas de RESICO' : `${money(isr)} <span class="small muted">(${money(base)} × ${tasa.toFixed(2)}%)</span>`)}
        ${row('IVA cobrado', money(iva))}
        ${row('IVA de tus gastos', `<input type="number" id="fx-acred" data-ym="${ym}" min="0" step="0.01" value="${mes.ivaAcred ?? ''}" style="max-width:140px" placeholder="0.00">`)}
        ${row(ivaNeto >= 0 ? 'IVA a pagar' : 'IVA a favor', `<b>${money(Math.abs(ivaNeto))}</b>`)}
        ${row('Fecha límite', fmtDY(due))}
      </dl>
      <p class="small muted" style="margin:0">Estimado con tus registros. El cálculo oficial lo hace el portal del SAT con las facturas. “IVA de tus gastos”: el IVA de facturas de gastos del negocio pagados en el mes (por ejemplo, la renta del local). La fecha límite no considera días festivos.</p>
      <div class="row">${mes.declarada ? `<span class="chip conf">Declarada el ${fmtDY(mes.declarada)}</span><button class="btn sm ghost" data-act="fxdecl" data-ym="${ym}" data-v="0">Desmarcar</button>` : `<button class="btn" data-act="fxdecl" data-ym="${ym}" data-v="1">Marcar como declarada</button>`}</div>
    </div>
    <div class="panel stack"><h3>Límite anual de RESICO ${y}</h3>
      <dl class="kv">${row('Ingresos sin IVA en el año', money(anual))}${row('Límite', money(FX_LIMITE_ANUAL))}${row('Usado', pct + '%', pct>=90?'err':'')}</dl>
      <div style="height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden"><div style="height:100%;width:${Math.min(100,pct)}%;background:${pct>=90?'var(--bad)':pct>=75?'var(--warn)':'var(--ok)'}"></div></div>
      <p class="small muted" style="margin:0">Solo cuenta lo registrado en esta agenda. Si Viridiana tiene otros ingresos de su actividad, también suman al límite.</p>
    </div></div>`;
}

function openFxClient(id, opts={}){
  const c = id ? S.fiscal[id] : { rfc:'', nombre:'', cp:'', regimen:'605', uso:'S01', email:'', phone:'', studentIds: opts.studentId ? [opts.studentId] : [], csfFecha:'', notes:'' };

  const s0 = opts.studentId ? stu(opts.studentId) : (c.studentIds||[])[0] ? stu(c.studentIds[0]) : null;
  if (!id && s0){ c.phone = s0.phone || ''; }
  const sel = new Set(c.studentIds||[]);
  const studs = Object.values(S.students).filter(s => s.active!==false || sel.has(s.id)).sort((a,b) => a.name.localeCompare(b.name,'es'));
  const render = () => {
    const cur = readCli();
    const ck = checkClient(cur);
    $('#fxc-check').innerHTML = (ck.errs.length ? `<div class="note bad"><b>Falta corregir:</b><ul style="margin:4px 0 0;padding-left:18px">${ck.errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : '<div class="note ok">Los datos tienen el formato correcto. Aun así, cópialos tal como vienen en su constancia.</div>')
      + (ck.warns.length ? `<div class="note warn"><ul style="margin:0;padding-left:18px">${ck.warns.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : '');
  };
  const readCli = () => ({ rfc: $('#fxc-rfc').value.trim().toUpperCase(), nombre: $('#fxc-nom').value.trim().replace(/\s+/g,' ').toUpperCase(), cp: $('#fxc-cp').value.trim(),
    regimen: $('#fxc-reg').value, uso: $('#fxc-uso').value, email: $('#fxc-mail').value.trim(), phone: $('#fxc-tel').value.replace(/\D/g,''),
    csfFecha: $('#fxc-csf').value, notes: $('#fxc-notes').value, studentIds: $$('[data-fxstu]').filter(x => x.checked).map(x => x.dataset.fxstu) });
  openModal(id ? esc(c.nombre || c.rfc) : 'Nuevo: datos fiscales', `
    <div class="note small">Cópialos de la <b>Constancia de Situación Fiscal</b> del papá o mamá (no del alumno). La factura se rechaza si el nombre, RFC, código postal o régimen no coinciden con la constancia.</div>
    <div class="grid2">
      <div class="field"><label for="fxc-rfc">RFC</label><input id="fxc-rfc" type="text" value="${esc(c.rfc)}" autocomplete="off" style="text-transform:uppercase" maxlength="13"></div>
      <div class="field"><label for="fxc-cp">Código postal (de la constancia)</label><input id="fxc-cp" type="text" inputmode="numeric" maxlength="5" value="${esc(c.cp)}"></div>
    </div>
    <div class="field"><label for="fxc-nom">Nombre o razón social (sin “S.A. de C.V.”)</label><input id="fxc-nom" type="text" value="${esc(c.nombre)}" style="text-transform:uppercase"></div>
    <div class="grid2">
      <div class="field"><label for="fxc-reg">Régimen fiscal</label><select id="fxc-reg">${Object.entries(FX_REGIMENES).map(([k,l]) => `<option value="${k}" ${c.regimen===k?'selected':''}>${k} ${l}</option>`).join('')}</select></div>
      <div class="field"><label for="fxc-uso">Uso del CFDI</label><select id="fxc-uso">${Object.entries(FX_USOS).map(([k,l]) => `<option value="${k}" ${c.uso===k?'selected':''}>${k} ${l}${k==='S01'?' (recomendado)':''}</option>`).join('')}</select></div>
      <div class="field"><label for="fxc-mail">Correo para enviar la factura</label><input id="fxc-mail" type="email" value="${esc(c.email)}"></div>
      <div class="field"><label for="fxc-tel">WhatsApp (10 dígitos)</label><input id="fxc-tel" type="tel" inputmode="numeric" value="${esc(c.phone)}"></div>
      <div class="field"><label for="fxc-csf">Fecha de la constancia revisada</label><input id="fxc-csf" type="date" value="${esc(c.csfFecha)}"></div>
    </div>
    <div class="note small">Uso del CFDI: las clases de regularización no son colegiatura con validez oficial (no tienen RVOE), así que no son deducibles para el papá. Por eso lo recomendado es <b>S01 Sin efectos fiscales</b>. No uses D10 (colegiaturas).</div>
    <div><div class="lbl" style="margin-bottom:6px">Alumnos a los que corresponde</div>
      <div class="row" style="max-height:160px;overflow:auto">${studs.map(s => `<label class="person" style="cursor:pointer"><input type="checkbox" data-fxstu="${s.id}" ${sel.has(s.id)?'checked':''}> ${esc(labelOf(s))}</label>`).join('') || '<span class="small muted">No hay alumnos.</span>'}</div></div>
    <div class="field"><label for="fxc-notes">Notas</label><textarea id="fxc-notes">${esc(c.notes||'')}</textarea></div>
    <div id="fxc-check"></div>`,
    `${(s0 && s0.phone) || c.phone ? waBtn(c.phone || s0.phone, fill(S.fcfg.tplDatos, { tutor: (s0 && s0.tutor) || '' }), 'Pedir datos por WhatsApp', false) : ''}
     ${id ? `<button class="btn ghost xdel" data-act="xdelcli" data-id="${id}">Eliminar</button>` : ''}
     <button class="btn primary" id="fxc-save">Guardar</button>`, { wide:true });
  render();
  $('#m-body').addEventListener('input', render);
  $('#m-body').addEventListener('change', render);
  $('#fxc-save').onclick = async () => {
    const d = readCli();
    if (!d.rfc && !d.nombre) return toast('Escribe al menos el RFC y el nombre.', true);
    const dup = Object.values(S.fiscal).find(x => x.rfc===d.rfc && x.id!==id);
    if (dup && d.rfc) return toast(`Ese RFC ya está registrado (${dup.nombre}). Ábrelo y agrégale el alumno.`, true);
    const doc = Object.assign({}, id ? S.fiscal[id] : { createdAt: new Date().toISOString() }, d, { updatedAt: new Date().toISOString() });
    delete doc.id;
    const fid = id || newId('fiscal');

      toast('Datos fiscales guardados');
      if (opts.cobroId){ const cb = allCobros().find(x => x.id===opts.cobroId); if (cb) await saveCobroMeta(cb, { clientId: fid, pideFactura: true }); }
      closeModal();
    }
  };
}

      <div class="field"><label for="fxm-fp">Forma de pago</label><select id="fxm-fp"><option value="">— elegir —</option>${Object.entries(FX_FORMAS).map(([k,l]) => `<option value="${k}" ${m.formaPago===k?'selected':''}>${k} ${l}</option>`).join('')}</select></div>
      <div class="field"><label for="fxm-s">Alumno (opcional)</label><select id="fxm-s"><option value="">—</option>${Object.values(S.students).sort((a,b)=>a.name.localeCompare(b.name,'es')).map(s => `<option value="${s.id}" ${m.studentId===s.id?'selected':''}>${esc(labelOf(s))}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="fxm-c">Concepto</label><input id="fxm-c" type="text" value="${esc(m.concepto)}" placeholder="Ej. Inscripción ciclo 2026-2027"></div>
    <label class="row"><input type="checkbox" id="fxm-p" ${m.pideFactura?'checked':''}> Pidió factura a su nombre</label>`,
    `${id ? `<button class="btn ghost xdel" data-act="xdelcob" data-id="${id}">Eliminar</button>` : ''}<button class="btn primary" id="fxm-save">Guardar</button>`);
  $('#fxm-save').onclick = async () => {
    const monto = Number($('#fxm-m').value);
    if (!$('#fxm-f').value) return toast('Elige la fecha de cobro.', true);
    if (!(monto > 0)) return toast('Escribe el monto cobrado.', true);
    if (!$('#fxm-c').value.trim()) return toast('Escribe el concepto.', true);
    const doc = Object.assign({}, id ? S.cobros[id] : { createdAt: new Date().toISOString() }, { manual:true, fecha:$('#fxm-f').value, monto, formaPago:$('#fxm-fp').value, studentId:$('#fxm-s').value, concepto:$('#fxm-c').value.trim(), pideFactura:$('#fxm-p').checked });
    delete doc.id;
    if (doc.pideFactura && !doc.clientId) doc.clientId = defaultClientId(doc.studentId);
    if (await dbSet('cobros', id || newId('cobros'), doc)){ toast('Cobro guardado'); closeModal(); }
  };
}

    ${otroMes ? `<div class="note warn">El cobro es de ${ymLabel(c.fecha.slice(0,7))} y hoy es ${ymLabel(todayS().slice(0,7))}. La factura saldrá con fecha de hoy y el portal la precargará en este mes; declara el ingreso en el mes en que cobraste.</div>` : ''}
    <ol class="fx-steps">

      <li><b>Receptor</b> (cópialo exacto):<div class="fx-grid">${fld('RFC', cli?.rfc)}${fld('Nombre o razón social', cli?.nombre)}${fld('Código postal', cli?.cp)}${fld('Régimen fiscal', cli ? cli.regimen + ' ' + (FX_REGIMENES[cli.regimen]||'') : '')}${fld('Uso del CFDI', cli ? cli.uso + ' ' + (FX_USOS[cli.uso]||'') : '')}</div></li>
      <li><b>Comprobante:</b><div class="fx-grid">${fld('Moneda', 'MXN')}${fld('Exportación', '01 No aplica')}${fld('Método de pago', 'PUE Pago en una sola exhibición')}${fld('Forma de pago', c.formaPago ? c.formaPago + ' ' + FX_FORMAS[c.formaPago] : '')}${S.fcfg.serie ? fld('Serie', S.fcfg.serie, 'Opcional') : ''}</div></li>
      <li><b>Concepto:</b><div class="fx-grid">${fld('Clave de producto o servicio', S.fcfg.claveProdServ)}${fld('Clave de unidad', S.fcfg.claveUnidad)}${fld('Cantidad', '1')}${fld('Descripción', c.concepto)}${fld('Valor unitario (sin IVA)', dec2(d.base))}${fld('Objeto de impuesto', '02 Sí objeto de impuesto')}${fld('Impuesto', 'IVA · Traslado · Tasa 16%')}</div></li>
      <li><b>Antes de sellar, revisa en la vista previa:</b> subtotal ${money(d.base)}, IVA ${money(d.iva)}, <b>total ${money(d.total)}</b> (lo que pagó el papá).${d.dif ? ` <span class="err">Con este precio no hay un valor sin IVA que dé el total exacto: el total quedará en ${money(d.total)}.</span>` : ''}</li>

/* Registrar una factura timbrada: lee el XML, compara y guarda */
function openFxRegister(kind, ids, ym){
  const st = { x:null, xmlBuf:null, pdfBuf:null, cmp:null, ids: ids.filter(Boolean) };
  const pending = kind==='individual' && !st.ids.length;
  const exp = () => st.ids.length ? expectedFor(kind, st.ids, ym) : { kind, list:[], total:0, base:0, iva:0, forma:'', receptor:null, ym, emisorRfc:S.fcfg.emisor.rfc };
  const render = () => {
    const ex = exp();
    let out = '';
    if (pending){
      const libres = allCobros().filter(c => c.monto && !coverage()[c.id]).slice(-60).reverse();
      out += `<div class="field"><label for="fxr-cobro">Pago que ampara esta factura</label><select id="fxr-cobro"><option value="">— elegir —</option>${libres.map(c => `<option value="${c.id}" ${st.ids[0]===c.id?'selected':''}>${fmtDY(c.fecha)} · ${c.studentId?esc(labelOf(stu(c.studentId))):'Sin alumno'} · ${money(c.monto)}</option>`).join('')}</select></div>`;
    }
    out += `<div class="note small">${kind==='global' ? `Factura global de ${ymLabel(ym)} · ${ex.list.length} pagos · total esperado ${money(ex.total)}` : ex.list.length ? `Esperado: ${esc(ex.receptor?.nombre||'sin datos fiscales')} · ${esc(ex.receptor?.rfc||'')} · total ${money(ex.total)}` : 'Elige el pago que ampara la factura.'}</div>
      <div class="grid2"><div class="field"><label for="fxr-xml">XML timbrado (obligatorio)</label><input id="fxr-xml" type="file" accept=".xml,text/xml,application/xml">${st.xmlName?`<span class="small">Cargado: ${esc(st.xmlName)}</span>`:''}</div>
      <div class="field"><label for="fxr-pdf">PDF de la factura</label><input id="fxr-pdf" type="file" accept=".pdf,application/pdf">${st.pdfName?`<span class="small">Cargado: ${esc(st.pdfName)}</span>`:''}</div></div>`;
    if (st.x){
      const x = st.x, cmp = st.cmp;
      out += `<dl class="kv"><dt>Folio fiscal</dt><dd>${esc(x.uuid)}</dd><dt>Serie y folio</dt><dd>${esc(x.serie+x.folio)||'—'}</dd><dt>Fecha</dt><dd>${esc(x.fecha.replace('T',' '))}</dd><dt>Receptor</dt><dd>${esc(x.receptor.nombre)} · ${esc(x.receptor.rfc)}</dd><dt>Subtotal · IVA · Total</dt><dd>${money(x.subtotal)} · ${money(x.iva)} · <b>${money(x.total)}</b></dd></dl>
        ${cmp.errs.length ? `<div class="note bad"><b>La factura no coincide con lo esperado:</b><ul style="margin:4px 0 0;padding-left:18px">${cmp.errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
          <p style="margin:6px 0 0">No la envíes al papá. Regístrala para tener el control y después, en el portal del SAT, cancélala con motivo <b>01</b> (con relación) y emite la correcta; o con motivo <b>02</b> si aún no la recibe y la correcta se emite después.</p></div>` : '<div class="note ok">El XML coincide con los datos esperados.</div>'}
        ${cmp.warns.length ? `<div class="note warn"><ul style="margin:0;padding-left:18px">${cmp.warns.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
        ${!st.pdfBuf ? '<div class="note warn">Falta el PDF. Puedes guardar sin él, pero el papá lo necesita para leer su factura.</div>' : ''}`;
    }
    $('#m-body').innerHTML = out;
    $('#m-foot').innerHTML = `<button class="btn primary" id="fxr-save" ${st.x && st.ids.length?'':'disabled'}>Guardar factura</button>`;
    const sc = $('#fxr-cobro'); if (sc) sc.onchange = () => { st.ids = sc.value ? [sc.value] : []; if (st.x) st.cmp = compareCfdi(st.x, exp()); render(); };
    $('#fxr-xml').onchange = async ev => {
      const f = ev.target.files[0]; if (!f) return;
      if (f.size > 2e6) return toast('El XML pesa más de 2 MB: no parece una factura.', true);
      try { const buf = await f.arrayBuffer(); const x = parseCfdi(new TextDecoder().decode(buf)); st.x = x; st.xmlBuf = buf; st.xmlName = f.name; st.cmp = compareCfdi(x, exp()); }
      catch(err){ st.x = null; st.xmlName = ''; toast(err.message, true); }
      render();
    };
    $('#fxr-pdf').onchange = async ev => { const f = ev.target.files[0]; if (!f) return; if (f.size > 8e6) return toast('El PDF pesa más de 8 MB.', true);
      const buf = await f.arrayBuffer(); if (new TextDecoder().decode(buf.slice(0,5)) !== '%PDF-') return toast('El archivo no es un PDF.', true);
      st.pdfBuf = buf; st.pdfName = f.name; render(); };
    $('#fxr-save').onclick = save;
  };
  async function save(){
    const x = st.x, ex = exp();
    if (!x || !st.ids.length) return;
    if (Object.values(S.invoices).some(i => i.uuid===x.uuid)) return toast('Esa factura ya está registrada.', true);
    const btn = $('#fxr-save'); btn.disabled = true; btn.textContent = 'Guardando…';
    const yy = x.fecha.slice(0,4), mm = x.fecha.slice(5,7);
    const dir = `facturas/${(x.emisor.rfc || 'EMISOR').replace(/[^A-Z0-9&Ñ]/gi,'')}/${yy}/${mm}`;
    const doc = { kind, status:'vigente', uuid:x.uuid, serie:x.serie, folio:x.folio, fecha:x.fecha, fechaTimbrado:x.fechaTimbrado, subtotal:x.subtotal, iva:x.iva, total:x.total,
      forma:x.forma, metodo:x.metodo, emisorRfc:x.emisor.rfc, receptor:x.receptor, cobroIds: st.ids, clientId: kind==='individual' && ex.list[0] ? ex.list[0].clientId : '',
      ym: kind==='global' ? ym : (ex.list[0] ? ex.list[0].fecha.slice(0,7) : x.fecha.slice(0,7)), concepto: x.conceptos.length===1 ? x.conceptos[0].desc : `${x.conceptos.length} conceptos`,
      checks: st.cmp, envios: [], createdAt: new Date().toISOString(), xmlPath:'', pdfPath:'' };
    if (hasRepo()){
      try {
        await ghPutFile(S.db.gc, `${dir}/${x.uuid}.xml`, st.xmlBuf, `Factura ${x.uuid}: XML`); doc.xmlPath = `${dir}/${x.uuid}.xml`;
        if (st.pdfBuf){ await ghPutFile(S.db.gc, `${dir}/${x.uuid}.pdf`, st.pdfBuf, `Factura ${x.uuid}: PDF`); doc.pdfPath = `${dir}/${x.uuid}.pdf`; }
      } catch(err){ btn.disabled = false; btn.textContent = 'Guardar factura'; return toast('No se pudieron subir los archivos: ' + err.message, true); }
    }
    const nid = newId('invoices');
    if (await dbSet('invoices', nid, doc)){
      S.fxVer = (S.fxVer||0) + 1;
      toast(st.cmp.errs.length ? 'Factura registrada con errores: revisa qué hacer.' : 'Factura registrada');
      openFxInvoice(nid, doc);
    } else { btn.disabled = false; btn.textContent = 'Guardar factura'; }
  }
  openModal(kind==='global' ? 'Registrar factura global' : 'Registrar factura timbrada', '', '<span></span>', { wide:true });
  render();
}

function invCtx(inv){
  const cli = S.fiscal[inv.clientId];
  const c0 = allCobros().find(c => c.id===(inv.cobroIds||[])[0]);
  const s = c0 && c0.studentId ? stu(c0.studentId) : null;
  return { tutor: (s && s.tutor) || (cli && cli.nombre) || '', alumno: s ? s.name : '', folio: (inv.serie||'') + (inv.folio||'') || inv.uuid.slice(0,8), concepto: inv.concepto || '', total: money(inv.total), uuid: inv.uuid };
}

    const i = S.invoices[id] || fallback; if (!i) return closeModal();

    const cobs = (i.cobroIds||[]).map(cid => allCobros().find(c => c.id===cid)).filter(Boolean);
    const ck = i.checks || { errs:[], warns:[] };
    const sust = i.cancel && i.cancel.sustitutaUuid ? Object.values(S.invoices).find(x => x.uuid===i.cancel.sustitutaUuid) : null;
    const rows = [
      ['Estado', i.status==='cancelada' ? `<span class="chip cancel">Cancelada</span> ${i.cancel ? `motivo ${esc(i.cancel.motivo)} · ${fmtDY(i.cancel.at.slice(0,10))}` : ''}` : (ck.errs.length ? '<span class="chip venc">Vigente con errores</span>' : '<span class="chip conf">Vigente</span>')],
      ['Tipo', i.kind==='global' ? `Global de ${ymLabel(i.ym)}` : 'Individual'],
      ['Folio fiscal (UUID)', fxCopy(i.uuid)],
      ['Serie y folio', esc((i.serie||'')+(i.folio||'')) || '—'],
      ['Fecha', esc((i.fecha||'').replace('T',' '))],

      ['Importe', `${money(i.subtotal)} + IVA ${money(i.iva)} = <b>${money(i.total)}</b>`],
      ['Forma de pago', esc(i.forma ? i.forma + ' ' + (FX_FORMAS[i.forma]||'') : '')],
      ['Pagos que ampara', cobs.map(c => `${fmtDY(c.fecha)} ${c.studentId?esc(stu(c.studentId).name):''} ${money(c.monto)}`).join('<br>') || '—']
    ];
    if (sust) rows.push(['Sustituida por', `<button class="btn sm" data-act="fxinv" data-id="${sust.id}">${esc(sust.uuid.slice(0,8))}…</button>`]);
    if ((i.envios||[]).length) rows.push(['Envíos', i.envios.map(e => `${e.via==='correo'?'Correo a '+esc(e.to):'WhatsApp'} · ${fmtDT(new Date(e.at))}`).join('<br>')]);
    $('#m-body').innerHTML = `<dl class="kv">${rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      ${ck.errs.length && i.status!=='cancelada' ? `<div class="note bad"><b>Errores detectados al registrar:</b><ul style="margin:4px 0 0;padding-left:18px">${ck.errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p style="margin:6px 0 0">Cancélala en el portal del SAT (Factura electrónica → Cancela) con motivo 01 y emite la correcta; luego márcala aquí como cancelada.</p></div>` : ''}
      ${ck.warns.length && i.status!=='cancelada' ? `<div class="note warn"><ul style="margin:0;padding-left:18px">${ck.warns.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="row">${i.xmlPath ? `<button class="btn" data-act="fxdl" data-id="${i.id}" data-ext="xml">Descargar XML</button>` : '<span class="small muted">XML no guardado en el repositorio.</span>'}${i.pdfPath ? `<button class="btn" data-act="fxdl" data-id="${i.id}" data-ext="pdf">Descargar PDF</button>` : `<button class="btn sm" data-act="fxaddpdf" data-id="${i.id}" ${hasRepo()?'':'disabled'}>Agregar PDF</button>`}</div>`;
    const canSend = i.status!=='cancelada' && i.kind!=='global';
    $('#m-foot').innerHTML = `<button class="btn ghost xdel" data-act="xdelinv" data-id="${i.id}">Eliminar registro</button>
      ${i.status!=='cancelada' ? `<button class="btn danger" data-act="fxcancel" data-id="${i.id}">Marcar como cancelada</button>` : ''}
      ${canSend ? `<button class="btn wa" data-act="fxwa" data-id="${i.id}">Enviar por WhatsApp</button><button class="btn primary" data-act="fxmail" data-id="${i.id}" ${i.xmlPath && hasRepo()?'':'disabled'}>Enviar por correo</button>` : ''}`;
  };
  openModal('Factura', '', '<span></span>', { wide:true, refresh: render });
  render();
  /* Descarga anticipada de los archivos para poder compartirlos por WhatsApp desde el celular sin esperas */
  const inv0 = S.invoices[id] || fallback;
  if (inv0 && hasRepo() && inv0.kind!=='global' && !S.fxFiles[inv0.id]){
    const p = {};
    Promise.all([inv0.pdfPath ? ghGetFile(S.db.gc, inv0.pdfPath).then(b => p.pdf = b) : null, inv0.xmlPath ? ghGetFile(S.db.gc, inv0.xmlPath).then(b => p.xml = b) : null])
      .then(() => { S.fxFiles[inv0.id] = p; }).catch(() => {});
  }
}

  openModal('Marcar factura como cancelada', `
    <div class="note">Primero cancélala en el portal del SAT (Factura electrónica → Cancela tu factura). Aquí solo se registra para que los pagos vuelvan a quedar pendientes de facturar.</div>
    <div class="field"><label for="fxx-m">Motivo de cancelación usado en el SAT</label><select id="fxx-m">
      <option value="01">01 Comprobante emitido con errores con relación (se sustituye por otra)</option>
      <option value="02">02 Comprobante emitido con errores sin relación</option>
      <option value="03">03 No se llevó a cabo la operación</option>
      <option value="04" ${i.kind==='global'?'selected':''}>04 Operación nominativa relacionada en una factura global</option></select></div>
    <div class="field"><label for="fxx-u">Folio fiscal de la factura que la sustituye (motivo 01)</label><input id="fxx-u" type="text" placeholder="UUID" style="text-transform:uppercase"></div>
    <div class="field"><label for="fxx-n">Nota</label><textarea id="fxx-n"></textarea></div>
    <p class="small muted" style="margin:0">Según las preguntas frecuentes de cancelación del SAT, no necesitan aceptación del receptor, entre otras, las facturas de hasta $1,000 y las de público en general. En los demás casos el papá tiene 3 días hábiles para aceptar o rechazar en el portal; revisa que el estado cambie a “Cancelado”.</p>`,
    `<button class="btn danger" id="fxx-ok">Marcar como cancelada</button>`);
  $('#fxx-ok').onclick = async () => {
    const motivo = $('#fxx-m').value, u = $('#fxx-u').value.trim().toUpperCase();
    if (motivo==='01' && !/^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$/.test(u)) return toast('Con motivo 01 escribe el folio fiscal (UUID) de la factura que la sustituye.', true);
    if (await dbUpdate('invoices', id, { status:'cancelada', cancel:{ motivo, sustitutaUuid:u, nota:$('#fxx-n').value, at:new Date().toISOString() } })){
      S.fxVer = (S.fxVer||0) + 1; toast('Factura marcada como cancelada. Sus pagos vuelven a estar pendientes.'); closeModal();

async function fxSendMail(id){

  const cli = S.fiscal[i.clientId];
  const ctx = invCtx(i);

function fxSendWa(id){
  const i = S.invoices[id]; if (!i) return;
  const cli = S.fiscal[i.clientId];
  const c0 = allCobros().find(c => c.id===(i.cobroIds||[])[0]);
  const phone = (cli && cli.phone) || (c0 && c0.studentId ? stu(c0.studentId).phone : '');
  const num = String(phone||'').replace(/\D/g,'');
  const text = fill(S.fcfg.tplWa, invCtx(i));
  const chatUrl = num ? waLink(phone, text) : `https://wa.me/?text=${encodeURIComponent(text)}`;
  const st = { files: null, err: '' };
  const ready = () => st.files && st.files.length;
  const shareable = () => ready() && navigator.canShare && navigator.canShare({ files: st.files });
  const render = () => {
    $('#fxw-files').innerHTML = !hasRepo() ? '<span class="small muted">Sin GitHub conectado no hay archivos guardados para adjuntar.</span>'
      : st.err ? `<span class="err">${esc(st.err)}</span>`
      : !ready() ? '<span class="small muted">Preparando el PDF y el XML…</span>'
      : `${shareable() ? '<button class="btn primary" id="fxw-share">Compartir PDF y XML</button>' : ''}<button class="btn" id="fxw-dl">Descargar PDF y XML</button>`;
    const sh = $('#fxw-share'); if (sh) sh.onclick = async () => {
      try { await navigator.share({ files: st.files }); } catch(e){ if (!e || e.name!=='AbortError') toast('Este navegador no pudo compartir los archivos; usa “Descargar” y arrástralos al chat.', true); }
    };
    const dl = $('#fxw-dl'); if (dl) dl.onclick = () => { st.files.forEach(f => saveBlob(f.name, f)); toast('PDF y XML descargados: arrástralos al chat de WhatsApp.'); };
  };
  openModal('Enviar factura por WhatsApp', `
    <div class="note small">WhatsApp no deja que una página adjunte archivos por sí sola: su enlace solo lleva el texto. Por eso son dos pasos.</div>
    <ol class="fx-steps">
      <li><b>Abre el chat${cli ? ' de ' + esc(cli.nombre) : ''}</b> con el mensaje ya escrito y envíalo.<div class="row" style="margin-top:6px"><a class="btn wa" id="fxw-chat" href="${esc(chatUrl)}" target="_blank" rel="noopener">Abrir chat con el mensaje</a>${num ? '' : '<span class="small muted">No hay WhatsApp registrado: elegirás el contacto en WhatsApp.</span>'}</div></li>
      <li><b>Adjunta el PDF y el XML</b> en ese mismo chat.
        <ul class="small" style="margin:4px 0 6px;padding-left:18px"><li>En el celular: “Compartir PDF y XML” → elige WhatsApp → elige el chat del papá.</li><li>En la computadora: “Descargar PDF y XML” y arrastra los dos archivos al chat de WhatsApp.</li></ul>
        <div class="row" id="fxw-files"></div></li>
    </ol>`, `<button class="btn primary" id="fxw-done">Listo, ya la envié</button>`);
  render();
  if (hasRepo()){
    const cache = S.fxFiles[i.id] || {};
    Promise.all([i.pdfPath ? (cache.pdf || ghGetFile(S.db.gc, i.pdfPath)) : null, i.xmlPath ? (cache.xml || ghGetFile(S.db.gc, i.xmlPath)) : null])
      .then(([pdf, xml]) => { S.fxFiles[i.id] = { pdf, xml }; st.files = []; if (pdf) st.files.push(new File([pdf], invFileName(i,'pdf'), { type:'application/pdf' })); if (xml) st.files.push(new File([xml], invFileName(i,'xml'), { type:'text/xml' })); if ($('#fxw-files')) render(); })
      .catch(() => { st.err = 'No se pudieron descargar los archivos de GitHub.'; if ($('#fxw-files')) render(); });
  }
  $('#fxw-done').onclick = async () => {
    const inv = S.invoices[id];
    await dbUpdate('invoices', id, { envios: [...(inv.envios||[]), { via:'whatsapp', to: num, at:new Date().toISOString() }] });
    toast('Envío por WhatsApp registrado'); openFxInvoice(id);
  };
}

/* =====================================================================
   ELIMINAR (alumnos, reservas, lista de espera, facturas, datos fiscales y cobros)
   Cada eliminación muestra exactamente qué se borra y pide escribir ELIMINAR.
   ===================================================================== */
function askDelete({ title, del = [], keep = [], warn = '', okLabel = 'Eliminar', fn }){
  const li = a => a.length ? `<ul style="margin:4px 0 0;padding-left:18px">${a.map(x => `<li>${x}</li>`).join('')}</ul>` : '';
  $('#confirm-root').innerHTML = `<div class="overlay"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="xd-t" style="width:min(480px,100%)">
    <div class="modal-b stack" style="gap:10px">
      <p id="xd-t" style="margin:0;font-weight:800">${title}</p>
      ${del.length ? `<div><b>Se elimina:</b>${li(del)}</div>` : ''}
      ${keep.length ? `<div><b>Se conserva:</b>${li(keep)}</div>` : ''}
      ${warn ? `<div class="note warn">${warn}</div>` : ''}
      <div class="field"><label for="xd-in">Para confirmar escribe <b>ELIMINAR</b></label><input id="xd-in" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
      <p class="small muted" style="margin:0">No se puede deshacer desde aquí. Si fue un error, la versión anterior queda en Ajustes → Historial de versiones y en el respaldo por correo.</p>
    </div>
    <div class="modal-f"><button class="btn" id="xd-no">Volver</button><button class="btn danger" id="xd-ok" disabled>${esc(okLabel)}</button></div></div></div>`;
  const inp = $('#xd-in'), ok = $('#xd-ok');
  const close = () => { $('#confirm-root').innerHTML = ''; };
  inp.oninput = () => { ok.disabled = inp.value.trim().toUpperCase() !== 'ELIMINAR'; };
  inp.onkeydown = e => { if (e.key==='Enter' && !ok.disabled) ok.click(); if (e.key==='Escape') close(); };
  $('#xd-no').onclick = close;
  ok.onclick = async () => {
    if (inp.value.trim().toUpperCase() !== 'ELIMINAR') return;
    ok.disabled = true; $('#xd-no').disabled = true; ok.textContent = 'Eliminando…';
    try { await fn(); } finally { close(); }
  };
  inp.focus();
}

async function ghDeleteFile(gc, path, message){
  const url = `/repos/${gc.owner}/${gc.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  const g = await ghFetch(gc, `${url}?ref=${encodeURIComponent(gc.branch||'main')}`);
  if (g.status===404) return false;                   // ya no existe: nada que borrar
  if (!g.ok) throw new Error(ghErrText(g.status));
  const j = await g.json();
  const d = await ghFetch(gc, url, { method:'DELETE', body: JSON.stringify({ message, sha: j.sha, branch: gc.branch||'main' }) });
  if (!d.ok && d.status!==404){ let e = null; try { e = await d.json(); } catch(x){} throw new Error(ghErrText(d.status, e)); }
  return true;
}

function deleteStudent(id){
  const s = S.students[id]; if (!s) return;
  const bks = S.bk.filter(b => b.studentId===id);
  const paid = bks.filter(b => b.paidAt), drop = bks.filter(b => !b.paidAt);
  const waits = Object.entries(S.waitlist).filter(([, w]) => w.studentId===id).map(([wid]) => wid);
  const clis = Object.values(S.fiscal).filter(f => (f.studentIds||[]).includes(id));
  const manual = Object.values(S.cobros).filter(m => m.manual && m.studentId===id);
  const del = [`El alumno <b>${esc(labelOf(s))}</b> (tutor ${esc(s.tutor||'—')}, WhatsApp, notas y horarios de preferencia)`];
  if (drop.length) del.push(`${drop.length} reserva(s) sin pago (prereservas, canceladas o reposiciones)`);
  if (waits.length) del.push(`${waits.length} registro(s) en la lista de espera`);
  const keep = [];
  if (paid.length) keep.push(`${paid.length} reserva(s) con pago verificado (${pesos(paid.reduce((t, b) => t + (Number(b.amount)||0), 0))}), para que no cambien Reportes ni Facturación. Aparecerán como “(alumno eliminado)”.`);
  if (manual.length) keep.push(`${manual.length} cobro(s) fuera de la agenda`);
  if (clis.length) keep.push(`Datos fiscales de ${clis.map(c => esc(c.nombre || c.rfc)).join(', ')} (solo se quita el vínculo con este alumno; se borran aparte en Facturación → Datos fiscales)`);
  if (Object.values(S.invoices).some(i => (i.cobroIds||[]).some(cid => paid.some(b => b.id===cid)))) keep.push('Sus facturas registradas');
  askDelete({ title: `¿Eliminar al alumno ${esc(labelOf(s))}?`, del, keep,
    warn: s.active!==false ? 'Si solo dejó de venir, puedes marcarlo como <b>Inactivo</b> y conservar su historial.' : '', okLabel: 'Eliminar alumno',
    fn: async () => {
      for (const b of drop){ if (!(await dbDelete('bookings', b.id))) return; }
      for (const wid of waits){ if (!(await dbDelete('waitlist', wid))) return; }
      for (const c of clis){ const doc = Object.assign({}, S.fiscal[c.id], { studentIds: (c.studentIds||[]).filter(x => x!==id) }); delete doc.id; if (!(await dbSet('fiscal', c.id, doc))) return; }
      if (!(await dbDelete('students', id))) return;
      closeModal(); toast('Alumno eliminado');
    } });
}

    okLabel: 'Eliminar factura',
    fn: async () => {
      try { for (const f of files) await ghDeleteFile(S.db.gc, f, `Factura ${i.uuid}: eliminar ${f.split('.').pop().toUpperCase()}`); }
      catch(e){ toast('No se pudo borrar el archivo: ' + e.message + ' No se eliminó el registro.', true); return; }
      if (await dbDelete('invoices', id)){ delete S.fxFiles[id]; closeModal(); toast('Registro de factura eliminado'); }
    } });
}

function deleteClient(id){
  const c = S.fiscal[id]; if (!c) return;
  const n = Object.values(S.invoices).filter(i => i.clientId===id).length;
  if (n) return toast(`Tiene ${n} factura(s) registrada(s): no se puede borrar. Si eran de prueba, elimina primero esas facturas.`, true);
  const metas = Object.entries(S.cobros).filter(([, m]) => m.clientId===id).map(([k]) => k);
  const keep = metas.length ? [`${metas.length} pago(s) que tenían asignados estos datos: quedan sin datos fiscales (si pidieron factura, habrá que elegir otros)`] : [];
  askDelete({ title: `¿Eliminar los datos fiscales de ${esc(c.nombre || c.rfc)}?`, del: [`RFC ${esc(c.rfc||'—')}, nombre, código postal, régimen, correo y WhatsApp`], keep, okLabel: 'Eliminar datos',
    fn: async () => {
      for (const k of metas){ if (!(await dbUpdate('cobros', k, { clientId: '' }))) return; }
      if (await dbDelete('fiscal', id)){ closeModal(); toast('Datos fiscales eliminados'); }
    } });
}

function deleteCobro(id){
  const m = S.cobros[id]; if (!m || !m.manual) return;
  if (coverage()[id]) return toast('Este cobro está en una factura vigente; primero márcala como cancelada o elimina su registro.', true);
  askDelete({ title: '¿Eliminar este cobro?', del: [`${fmtDY(m.fecha)} · ${esc(m.concepto||'')} · ${pesos(m.monto)}`], warn: 'Dejará de contar en lo cobrado del mes.', okLabel: 'Eliminar cobro',
    fn: async () => { if (await dbDelete('cobros', id)){ closeModal(); toast('Cobro eliminado'); } } });
}

Object.assign(ACT, {
  xdelbk: el => deleteBooking(el.dataset.id),
  xdelstu: el => deleteStudent(el.dataset.id),
  xdelwait: el => deleteWait(el.dataset.id),
  xdelinv: el => deleteInvoice(el.dataset.id),
  xdelcli: el => deleteClient(el.dataset.id),
  xdelcob: el => deleteCobro(el.dataset.id)
});

/* =====================================================================
   ARRANQUE
   ===================================================================== */
async function boot(){
  if (!window.crypto || !crypto.subtle){ renderLogin('Este navegador no permite el cifrado necesario para la contraseña. Ábrelo con Chrome, Edge, Safari o Firefox actualizados.'); return; }
  if (!window.claude || !window.claude.use){
    /* Fuera de claude.ai: GitHub (recomendado) o solo este navegador */
    try { localStorage.setItem('ia-test','1'); localStorage.removeItem('ia-test'); }
    catch(e){ renderLogin('Este navegador no permite guardar datos (modo privado o almacenamiento bloqueado). Ábrelo en una ventana normal.'); return; }
    const mode = lsGet('ia-storage'), gc = lsGet(GH_CFG_KEY);
    if (mode==='github' && gc){
      S.db = githubDB(gc);
      S.db.onStatus.add(() => { renderSync(); if (S.logged) renderTabs(); });
      $('#app').querySelector('p') && ($('#app').querySelector('p').textContent = 'Descargando la agenda desde GitHub…');
      await S.db.ready();
      if (!S.db.hasCache()){ renderSetup(S.db.status.msg || 'No se pudo leer el repositorio de datos. Revisa el internet o el token.', gc); return; }
    } else if (mode==='local'){
      S.db = localDB(); S.local = true;
    } else { renderSetup(); return; }
    subscribeConfig();
    const waitL = setInterval(() => { if (S.auth !== undefined){ clearInterval(waitL); if (sessionValid()) enterApp(); else if (!loginRendered) renderLogin(); } }, 50);
    return;
  }
  S.db = await claude.use('db');
  S.userCap = await claude.use('user');
  if (S.userCap){ try { S.isOwner = await S.userCap.isOwner(); } catch(e){} }
  if (!S.db){ renderLogin('No se pudo conectar con la base de datos. Inicia sesión en claude.ai y recarga la página. Si la abriste con un enlace compartido, pide acceso de edición.'); return; }
  subscribeConfig();
  const wait = setInterval(() => {
    if (S.auth !== undefined){ clearInterval(wait); if (sessionValid()) enterApp(); else if (!loginRendered) renderLogin(); }
  }, 100);
}
if (typeof window !== 'undefined' && !window.__TEST__) boot();
</script>
