const GH_FILES = {".github/workflows/respaldo-correo.yml": "# Respaldo por correo de la Agenda Impulso Académico.\n# - Lunes 7:00 am (hora de la Ciudad de México): respaldo semanal, siempre.\n# - Todos los días 9:00 pm: respaldo solo si ese día hubo cambios en la agenda.\n# - Manual: desde la agenda (Ajustes → Enviar respaldo ahora) o desde la pestaña Actions.\n# Ciudad de México está en UTC-6 todo el año (sin horario de verano desde 2022).\nname: Respaldo por correo\n\non:\n  schedule:\n    - cron: '0 13 * * 1'\n    - cron: '0 3 * * *'\n  workflow_dispatch:\n    inputs:\n      motivo:\n        description: 'Motivo del respaldo'\n        required: false\n        default: 'manual'\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: respaldo-correo\n  cancel-in-progress: false\n\njobs:\n  respaldo:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - name: Descargar datos e historial\n        uses: actions/checkout@v5\n        with:\n          fetch-depth: 0\n\n      - name: Enviar respaldo\n        env:\n          SMTP_HOST: ${{ secrets.SMTP_HOST }}\n          SMTP_PORT: ${{ secrets.SMTP_PORT }}\n          SMTP_USER: ${{ secrets.SMTP_USER }}\n          SMTP_PASS: ${{ secrets.SMTP_PASS }}\n          MAIL_TO: ${{ secrets.MAIL_TO }}\n          FACT_USER: ${{ secrets.FACT_SMTP_USER }}\n          FACT_PASS: ${{ secrets.FACT_SMTP_PASS }}\n          FACT_HOST: ${{ secrets.FACT_SMTP_HOST }}\n          FACT_PORT: ${{ secrets.FACT_SMTP_PORT }}\n          EVENT_NAME: ${{ github.event_name }}\n          SCHEDULE: ${{ github.event.schedule }}\n          MOTIVO: ${{ github.event.inputs.motivo }}\n          REPO: ${{ github.repository }}\n        run: python3 .github/scripts/enviar_respaldo.py\n", ".github/scripts/enviar_respaldo.py": "#!/usr/bin/env python3\n\"\"\"Envía por correo el respaldo de la Agenda Impulso Académico.\n\nAdjunta:\n  - respaldo-impulso-AAAA-MM-DD.json  (se importa en la agenda: Ajustes → Importar respaldo)\n  - alumnos-AAAA-MM-DD.csv y reservas-AAAA-MM-DD.csv (se abren en Excel)\n  - facturas-AAAA-MM-DD.csv si ya hay facturas registradas (se abre en Excel)\n\nVariables de entorno (secretos del repositorio):\n  SMTP_USER, SMTP_PASS  cuenta que envía el respaldo\n  FACT_USER, FACT_PASS, FACT_HOST, FACT_PORT\n                        cuenta de las facturas (contacto@ en GoDaddy); se usa si la de arriba falla o no existe\n  SMTP_HOST             opcional (por defecto smtp.gmail.com)\n  SMTP_PORT             opcional (por defecto 465; 587 usa STARTTLS)\n  MAIL_TO               opcional (por defecto contacto@impulsoacademico.mx; varios separados por coma)\n\"\"\"\nimport csv, io, json, os, smtplib, ssl, subprocess, sys\nfrom datetime import datetime, timedelta\nfrom email.message import EmailMessage\nfrom zoneinfo import ZoneInfo\n\nDATA = 'data/agenda.json'\nTZ = ZoneInfo('America/Mexico_City')\nDAILY_CRON = '0 3 * * *'\nDOWS = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom']  # weekday() 0 = lunes\nJS_DOWS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb']  # como en la agenda: 0 = domingo\nMES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic']\n\n\ndef git(*args):\n    return subprocess.run(['git', *args], capture_output=True, text=True, check=False).stdout.strip()\n\n\ndef fecha(s):\n    if not s:\n        return ''\n    d = datetime.strptime(s[:10], '%Y-%m-%d')\n    return f'{DOWS[d.weekday()]} {d.day} {MES[d.month - 1]}'\n\n\ndef hora(h):\n    h = int(h)\n    return f'{h - 12 if h > 12 else h}{\"pm\" if h >= 12 else \"am\"}'\n\n\ndef horario(slots):\n    by = {}\n    for k in sorted(slots or [], key=lambda k: tuple(map(int, k.split('-')))):\n        d, h = map(int, k.split('-'))\n        by.setdefault(d, []).append(h)\n    parts = []\n    for d, hs in by.items():\n        hs.sort()\n        rangos, ini, prev = [], hs[0], hs[0]\n        for h in hs[1:] + [None]:\n            if h is not None and h == prev + 1:\n                prev = h\n                continue\n            rangos.append(f'{hora(ini)}–{hora(prev + 1)}')\n            if h is not None:\n                ini = prev = h\n        parts.append(f'{JS_DOWS[d]} {\" y \".join(rangos)}')\n    return ', '.join(parts)\n\n\ndef main():\n    now = datetime.now(TZ)\n    hoy = now.strftime('%Y-%m-%d')\n    event = os.environ.get('EVENT_NAME', 'manual')\n    schedule = os.environ.get('SCHEDULE', '')\n    motivo = (os.environ.get('MOTIVO') or '').strip()\n\n    if not os.path.exists(DATA):\n        print('Aún no hay datos (data/agenda.json no existe). No se envía nada.')\n        return 0\n\n    cambios_24h = git('log', '--since=24 hours ago', '--format=%H', '--', DATA).splitlines()\n    cambios_7d = git('log', '--since=7 days ago', '--format=%H', '--', DATA).splitlines()\n    if event == 'schedule' and schedule == DAILY_CRON and not cambios_24h:\n        print('Sin cambios en las últimas 24 horas: no se envía el respaldo diario.')\n        return 0\n\n    user, password = os.environ.get('SMTP_USER', '').strip(), os.environ.get('SMTP_PASS', '').strip()\n    host = os.environ.get('SMTP_HOST', '').strip() or 'smtp.gmail.com'\n    port = int(os.environ.get('SMTP_PORT', '').strip() or 465)\n    # Cuentas a intentar, en orden: la del respaldo (SMTP_*) y, si falla, la de las facturas (FACT_SMTP_*, contacto@ en GoDaddy).\n    cuentas = []\n    if user and password:\n        cuentas.append((host, port, user, password))\n    f_pass = os.environ.get('FACT_PASS', '').strip()\n    if f_pass:\n        f_user = os.environ.get('FACT_USER', '').strip() or 'contacto@impulsoacademico.mx'\n        f_host = os.environ.get('FACT_HOST', '').strip() or 'smtpout.secureserver.net'\n        f_port = int(os.environ.get('FACT_PORT', '').strip() or 465)\n        if (f_host, f_port, f_user) not in [(h, p, u) for h, p, u, _ in cuentas]:\n            cuentas.append((f_host, f_port, f_user, f_pass))\n    if not cuentas:\n        print('::error::Faltan los datos del correo: secretos SMTP_USER y SMTP_PASS (o FACT_SMTP_PASS) en Settings → Secrets and variables → Actions.')\n        return 1\n    to = [x.strip() for x in (os.environ.get('MAIL_TO', '').strip() or 'contacto@impulsoacademico.mx').split(',') if x.strip()]\n\n    with open(DATA, encoding='utf-8') as f:\n        data = json.load(f)\n    students = data.get('students', {})\n    bookings = data.get('bookings', {})\n    waitlist = data.get('waitlist', {})\n    config = (data.get('config') or {}).get('main', {})\n    plans = config.get('plans', {'basico': {'name': 'Básico'}, 'plus': {'name': 'Plus'}})\n    # Facturación (se agregó después; si no existe, quedan vacíos)\n    fiscal = data.get('fiscal', {})\n    invoices = data.get('invoices', {})\n    cobros = data.get('cobros', {})\n    fiscal_cfg = (data.get('config') or {}).get('fiscal')\n\n    # Respaldo importable (mismo formato que \"Descargar respaldo\" en la agenda; sin la contraseña)\n    respaldo = {'exportedAt': now.isoformat(), 'source': 'github-actions', 'config': config,\n                'students': students, 'bookings': bookings, 'waitlist': waitlist,\n                'fiscal': fiscal, 'invoices': invoices, 'cobros': cobros}\n    if fiscal_cfg:\n        respaldo['fiscalConfig'] = fiscal_cfg\n    respaldo_bytes = json.dumps(respaldo, ensure_ascii=False, indent=1).encode('utf-8')\n\n    def nombre(sid):\n        s = students.get(sid) or {}\n        tel = ''.join(c for c in str(s.get('phone', '')) if c.isdigit())\n        return f\"{s.get('name', '(sin nombre)')} {tel[-4:]}\".strip()\n\n    def plan_nombre(p):\n        return (plans.get(p) or {}).get('name', 'Sin plan')\n\n    # CSV de alumnos\n    buf = io.StringIO()\n    w = csv.writer(buf)\n    w.writerow(['Alumno', 'Tutor', 'WhatsApp', 'Plan', 'Alumno desde', 'Activo', 'Notas'])\n    for sid, s in sorted(students.items(), key=lambda x: x[1].get('name', '').lower()):\n        w.writerow([s.get('name', ''), s.get('tutor', ''), s.get('phone', ''), plan_nombre(s.get('plan')),\n                    s.get('since', ''), 'Sí' if s.get('active', True) else 'No', s.get('notes', '')])\n    alumnos_csv = ('﻿' + buf.getvalue()).encode('utf-8')  # BOM para que Excel lea acentos\n\n    # CSV de reservas\n    estados = {'pre': 'Prereserva', 'conf': 'Pagado', 'cancel': 'Cancelada', 'desplazada': 'Desplazada'}\n    tipos = {'impulso': 'Impulso', 'tutoria': 'Tutoría', 'repo': 'Reposición'}\n    buf = io.StringIO()\n    w = csv.writer(buf)\n    w.writerow(['Tipo', 'Alumno', 'Plan', 'Estado', 'Inicio / fecha', 'Fin', 'Horario', 'Pago verificado', 'Monto', 'Notas'])\n    for b in sorted(bookings.values(), key=lambda b: b.get('start') or b.get('date') or ''):\n        es_imp = b.get('type') == 'impulso'\n        w.writerow([tipos.get(b.get('type'), b.get('type')), nombre(b.get('studentId')),\n                    plan_nombre(b.get('plan')) if es_imp else '', estados.get(b.get('status'), b.get('status')),\n                    b.get('start') if es_imp else b.get('date'), b.get('end', '') if es_imp else '',\n                    horario(b.get('slots')) if es_imp else hora(b.get('hour', 0)),\n                    (b.get('paidAt') or '')[:10], b.get('amount', ''), b.get('notes', '')])\n    reservas_csv = ('﻿' + buf.getvalue()).encode('utf-8')\n\n    # CSV de facturas (montos guardados en centavos)\n    facturas_csv = None\n    if invoices:\n        buf = io.StringIO()\n        w = csv.writer(buf)\n        w.writerow(['Fecha', 'Serie', 'Folio', 'UUID', 'Tipo', 'Mes global', 'Receptor', 'RFC receptor',\n                    'Subtotal', 'IVA', 'Total', 'Forma de pago', 'Estado', 'Motivo cancelación', 'Envíos'])\n        for inv in sorted(invoices.values(), key=lambda i: i.get('fecha') or ''):\n            rec = inv.get('receptor') or {}\n            w.writerow([(inv.get('fecha') or '')[:10], inv.get('serie', ''), inv.get('folio', ''), inv.get('uuid', ''),\n                        'Global' if inv.get('kind') == 'global' else 'Individual', inv.get('ym', '') if inv.get('kind') == 'global' else '',\n                        rec.get('nombre', ''), rec.get('rfc', ''),\n                        f\"{(inv.get('subtotal') or 0) / 100:.2f}\", f\"{(inv.get('iva') or 0) / 100:.2f}\", f\"{(inv.get('total') or 0) / 100:.2f}\",\n                        inv.get('forma', ''), 'Cancelada' if inv.get('status') == 'cancelada' else 'Vigente',\n                        (inv.get('cancel') or {}).get('motivo', ''), len(inv.get('envios') or [])])\n        facturas_csv = ('﻿' + buf.getvalue()).encode('utf-8')\n\n    # Resumen en el cuerpo del correo\n    vigentes = [dict(b, id=k) for k, b in bookings.items() if b.get('type') == 'impulso' and b.get('status') == 'conf'\n                and b.get('start', '') <= hoy <= b.get('end', '')]\n    pre = [b for b in bookings.values() if b.get('status') == 'pre']\n    en7 = (now + timedelta(days=7)).strftime('%Y-%m-%d')\n    terminan = sorted([b for b in vigentes if b.get('end', '') <= en7], key=lambda b: b['end'])\n    renovados = {b.get('renewalOf') for b in bookings.values() if b.get('renewalOf') and b.get('status') != 'cancel'}\n    espera = [x for x in waitlist.values() if x.get('status') == 'activa']\n\n    tipo_txt = {'schedule': 'semanal' if schedule != DAILY_CRON else 'diario (hubo cambios hoy)',\n                'workflow_dispatch': f'manual{\": \" + motivo if motivo and motivo != \"manual\" else \"\"}'}.get(event, event)\n    L = [f'Respaldo {tipo_txt} de la Agenda Impulso Académico',\n         f'Generado: {now.strftime(\"%d/%m/%Y %H:%M\")} (hora de la Ciudad de México)', '',\n         f'Alumnos registrados: {len(students)}',\n         f'Alumnos con plan pagado vigente: {len({b.get(\"studentId\") for b in vigentes})}',\n         f'Prereservas esperando pago: {len(pre)}',\n         f'En lista de espera: {len(espera)}',\n         f'Facturas registradas: {len(invoices)} · datos fiscales de {len(fiscal)} cliente(s)',\n         f'Cambios guardados en las últimas 24 h: {len(cambios_24h)} · últimos 7 días: {len(cambios_7d)}', '']\n    if pre:\n        L.append('PRERESERVAS ESPERANDO PAGO')\n        for b in pre:\n            cuando = f\"Impulso {horario(b.get('slots'))} desde {fecha(b.get('start'))}\" if b.get('type') == 'impulso' \\\n                else f\"Tutoría {fecha(b.get('date'))} {hora(b.get('hour', 0))}\"\n            L.append(f'  • {nombre(b.get(\"studentId\"))}: {cuando}')\n        L.append('')\n    if terminan:\n        L.append('PLANES QUE TERMINAN EN LOS PRÓXIMOS 7 DÍAS')\n        for b in terminan:\n            L.append(f'  • {nombre(b.get(\"studentId\"))}: termina {fecha(b[\"end\"])} · '\n                     f'{\"renovación registrada\" if b.get(\"id\") in renovados else \"sin renovación\"}')\n        L.append('')\n    L += ['ARCHIVOS ADJUNTOS',\n          f'  • respaldo-impulso-{hoy}.json: para restaurar en la agenda (Ajustes → Importar respaldo).',\n          f'  • alumnos-{hoy}.csv y reservas-{hoy}.csv: para consultar en Excel.'] + \\\n         ([f'  • facturas-{hoy}.csv: lista de facturas (los PDF y XML están en la carpeta facturas/ del repositorio).'] if facturas_csv else []) + ['',\n          f'Historial completo de cambios: https://github.com/{os.environ.get(\"REPO\", \"\")}/commits/main/data/agenda.json']\n\n    def armar(remitente):\n        msg = EmailMessage()\n        msg['Subject'] = f'Respaldo Agenda Impulso Académico · {now.strftime(\"%d/%m/%Y\")}'\n        msg['From'] = remitente\n        msg['To'] = ', '.join(to)\n        msg.set_content('\\n'.join(L))\n        msg.add_attachment(respaldo_bytes, maintype='application', subtype='json', filename=f'respaldo-impulso-{hoy}.json')\n        msg.add_attachment(alumnos_csv, maintype='text', subtype='csv', filename=f'alumnos-{hoy}.csv')\n        msg.add_attachment(reservas_csv, maintype='text', subtype='csv', filename=f'reservas-{hoy}.csv')\n        if facturas_csv:\n            msg.add_attachment(facturas_csv, maintype='text', subtype='csv', filename=f'facturas-{hoy}.csv')\n        return msg\n\n    fallas = []\n    for i, (h, pt, u, pw) in enumerate(cuentas):\n        print(f'Intento {i + 1}: {u} por {h}:{pt}')\n        paso = 'conectar'\n        try:\n            paso = enviar_smtp(h, pt, u, pw, armar(u), to, lambda x: None)\n        except Exception as e:  # noqa: BLE001\n            paso_err = getattr(e, 'paso', 'conectar')\n            print(f'  falló en «{paso_err}»: {describir(e)}')\n            fallas.append(f'{u} por {h}:{pt} falló en «{paso_err}» ({describir(e)})')\n            if paso_err == 'envío':\n                break  # pudo haberse entregado: no reintentar para no duplicar\n            continue\n        if i > 0:\n            print(f'::warning::La cuenta del respaldo ({cuentas[0][2]}) no pudo enviar; se envió desde {u}. Revisa el secreto SMTP_PASS.')\n        print(f'Respaldo enviado a {\", \".join(to)} desde {u}.')\n        return 0\n    print('::error::No se pudo enviar el respaldo. ' + ' | '.join(fallas))\n    if any('rechaz' in f or 'cerró la conexión' in f for f in fallas):\n        print('Con Gmail se necesita una \"contraseña de aplicación\" (16 letras), no la contraseña normal. Si cambiaste la contraseña de Google, la de aplicación deja de servir.')\n    return 1\n\n\ndef describir(e):\n    if isinstance(e, smtplib.SMTPAuthenticationError):\n        txt = e.smtp_error.decode(errors='replace') if isinstance(e.smtp_error, bytes) else str(e.smtp_error)\n        return 'usuario o contraseña rechazados' + (f' — el servidor respondió {e.smtp_code}' if e.smtp_code else '') + f': {\" \".join(txt.split())}'\n    return f'{type(e).__name__}: {e}'\n\n\ndef enviar_smtp(host, port, user, password, msg, to, _):\n    \"\"\"Conecta, inicia sesión con un solo método (para ver la respuesta real del servidor) y envía.\n    Si falla, la excepción lleva el atributo .paso con el paso en que falló.\"\"\"\n    ctx = ssl.create_default_context()\n    paso = 'conectar'\n    try:\n        s = smtplib.SMTP_SSL(host, port, context=ctx, timeout=60) if port == 465 else smtplib.SMTP(host, port, timeout=60)\n        with s:\n            paso = 'saludo'\n            s.ehlo()\n            if port != 465 and os.environ.get('SMTP_NO_TLS') != '1':\n                paso = 'cifrado'\n                s.starttls(context=ctx)\n                s.ehlo()\n            if os.environ.get('SMTP_NO_LOGIN') != '1':\n                paso = 'inicio de sesión'\n                anunciados = (s.esmtp_features.get('auth') or '').upper().split()\n                print(f'  métodos de inicio de sesión: {\" \".join(anunciados) or \"(ninguno)\"}; contraseña de {len(password)} caracteres'\n                      + (', con espacios' if ' ' in password else '') + (', con acentos u otros símbolos especiales' if not password.isascii() else ''))\n                mech = 'LOGIN' if anunciados and 'PLAIN' not in anunciados and 'LOGIN' in anunciados else 'PLAIN'\n                s.user, s.password = user, password\n                try:\n                    s.auth(mech, getattr(s, 'auth_' + mech.lower()), initial_response_ok=True)\n                except smtplib.SMTPServerDisconnected as e:\n                    raise smtplib.SMTPAuthenticationError(0, f'el servidor cerró la conexión al recibir el usuario y la contraseña ({e}); casi siempre es contraseña incorrecta') from e\n            paso = 'envío'\n            s.send_message(msg, to_addrs=to)\n    except Exception as e:  # noqa: BLE001\n        e.paso = paso\n        raise\n    return paso\n\n\ndef principal():\n    try:\n        return main()\n    except Exception as e:  # noqa: BLE001\n        import traceback\n        traceback.print_exc()\n        print(f'::error::El respaldo falló antes de enviar: {type(e).__name__}: {e}')\n        return 1\n\n\nif __name__ == '__main__':\n    sys.exit(principal())\n", "README.md": "# Datos de la Agenda Impulso Académico\n\nRepositorio **privado**. No lo hagas público: contiene nombres de alumnos, teléfonos de sus familias y, desde que se agregó la facturación, RFC y datos fiscales.\n\n- `data/agenda.json`: toda la información de la agenda. La agenda (https://makidav.github.io/impulso/) lo actualiza sola; no hace falta editarlo a mano.\n- `facturas/<RFC del emisor>/<año>/<mes>/<folio fiscal>.xml` y `.pdf`: los archivos de cada factura registrada en la agenda (Facturación → Registrar factura).\n- Cada cambio guardado en la agenda es un commit. Para ver o recuperar una versión anterior: pestaña **Commits** → elige la fecha → abre `data/agenda.json`.\n- `.github/workflows/respaldo-correo.yml` y `.github/scripts/enviar_respaldo.py`: envían el respaldo por correo los lunes a las 7:00 am y a las 9:00 pm de los días con cambios. El respaldo incluye los datos de facturación y, si hay facturas, una lista en Excel.\n- `.github/workflows/enviar-factura.yml` y `.github/scripts/enviar_factura.py`: envían una factura (PDF y XML adjuntos) cuando lo pides desde la agenda.\n\n## Datos del correo (Settings → Secrets and variables → Actions)\n\n**Facturas** (salen de `contacto@impulsoacademico.mx`, Professional Email de GoDaddy con Titan; servidor y usuario ya vienen configurados):\n\n| Secreto | Valor |\n|---|---|\n| `FACT_SMTP_PASS` | **Obligatorio.** La contraseña de `contacto@impulsoacademico.mx` |\n| `FACT_BCC` | Opcional. Copia oculta de cada factura enviada |\n| `FACT_FROM_NAME` | Opcional. Nombre del remitente. Por defecto `Impulso Académico` |\n| `FACT_SMTP_USER`, `FACT_SMTP_HOST`, `FACT_SMTP_PORT` | Opcionales. Solo si cambias de cuenta o proveedor (por defecto `contacto@impulsoacademico.mx`, `smtpout.secureserver.net`, `465`) |\n\nSi el correo tiene la opción \"Habilitar Titan en otras aplicaciones\", debe estar activada, y la verificación en dos pasos apagada. Si `contacto@` no logra enviar (por ejemplo, porque GoDaddy rechaza la conexión), la factura sale desde la cuenta del respaldo (`SMTP_USER`) con \"responder a\" `contacto@impulsoacademico.mx`, y el registro del envío lo avisa. Para desactivarlo: secreto `FACT_FALLBACK` = `0`.\n\n**Respaldo** (sin cambios):\n\n| Secreto | Valor |\n|---|---|\n| `SMTP_USER` / `SMTP_PASS` | Cuenta y contraseña que envían el respaldo (con Gmail, una \"contraseña de aplicación\") |\n| `SMTP_HOST` / `SMTP_PORT` | Opcionales. Por defecto `smtp.gmail.com` y `465` |\n| `MAIL_TO` | Opcional. A quién llega el respaldo. Por defecto `contacto@impulsoacademico.mx` |\n\n## Restaurar\nAbre el `.json` adjunto en cualquier correo de respaldo desde la agenda: **Ajustes → Importar respaldo**. Los PDF y XML de las facturas no van en el respaldo por correo: viven en la carpeta `facturas/` de este repositorio.\n", ".github/workflows/enviar-factura.yml": "# Envío de una factura por correo (PDF y XML adjuntos) desde contacto@impulsoacademico.mx.\n# Lo dispara la agenda: Facturación → factura → \"Enviar por correo\" (o \"Enviar correo de prueba\").\n# Ya viene configurado para contacto@impulsoacademico.mx (Professional Email de GoDaddy con Titan: smtpout.secureserver.net, puerto 465 SSL).\n# Solo falta un secreto: FACT_SMTP_PASS = la contraseña de contacto@impulsoacademico.mx.\n# Si contacto@ no logra enviar, usa la cuenta del respaldo (SMTP_USER/SMTP_PASS) con respuesta a contacto@. FACT_FALLBACK=0 lo desactiva.\n# Opcionales: FACT_SMTP_HOST, FACT_SMTP_PORT, FACT_SMTP_USER (otra cuenta), FACT_BCC (copia oculta), FACT_FROM_NAME.\nname: Enviar factura\n\non:\n  workflow_dispatch:\n    inputs:\n      para:\n        description: 'Correo del destinatario'\n        required: true\n      xml:\n        description: 'Ruta del XML en el repositorio'\n        required: false\n        default: ''\n      pdf:\n        description: 'Ruta del PDF en el repositorio (opcional)'\n        required: false\n        default: ''\n      asunto:\n        description: 'Asunto del correo'\n        required: true\n      mensaje:\n        description: 'Texto del correo'\n        required: true\n      prueba:\n        description: '1 = correo de prueba sin adjuntos'\n        required: false\n        default: ''\n\npermissions:\n  contents: read\n\njobs:\n  enviar:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - name: Descargar archivos\n        uses: actions/checkout@v5\n        with:\n          fetch-depth: 1\n\n      - name: Enviar factura\n        env:\n          SMTP_HOST: ${{ secrets.FACT_SMTP_HOST || 'smtpout.secureserver.net' }}\n          SMTP_PORT: ${{ secrets.FACT_SMTP_PORT }}\n          SMTP_USER: ${{ secrets.FACT_SMTP_USER || 'contacto@impulsoacademico.mx' }}\n          SMTP_PASS: ${{ secrets.FACT_SMTP_PASS }}\n          RESP_USER: ${{ secrets.SMTP_USER }}\n          RESP_PASS: ${{ secrets.SMTP_PASS }}\n          RESP_HOST: ${{ secrets.SMTP_HOST }}\n          RESP_PORT: ${{ secrets.SMTP_PORT }}\n          FACT_FALLBACK: ${{ secrets.FACT_FALLBACK }}\n          FACT_BCC: ${{ secrets.FACT_BCC }}\n          FACT_FROM_NAME: ${{ secrets.FACT_FROM_NAME }}\n          PARA: ${{ github.event.inputs.para }}\n          XML_PATH: ${{ github.event.inputs.xml }}\n          PDF_PATH: ${{ github.event.inputs.pdf }}\n          ASUNTO: ${{ github.event.inputs.asunto }}\n          MENSAJE: ${{ github.event.inputs.mensaje }}\n          PRUEBA: ${{ github.event.inputs.prueba }}\n        run: python3 .github/scripts/enviar_factura.py\n", ".github/scripts/enviar_factura.py": "#!/usr/bin/env python3\n\"\"\"Envía por correo una factura (XML y PDF) guardada en el repositorio de datos.\n\nVariables de entorno:\n  PARA, XML_PATH, ASUNTO, MENSAJE   obligatorias (las manda la agenda); XML_PATH no aplica en prueba\n  PDF_PATH                          opcional\n  PRUEBA                            '1' = correo de prueba sin adjuntos\n  SMTP_USER, SMTP_PASS              cuenta que envía (el flujo usa contacto@impulsoacademico.mx y el secreto FACT_SMTP_PASS)\n  SMTP_HOST                         opcional (por defecto smtpout.secureserver.net)\n  SMTP_PORT                         opcional (465 SSL; 587 usa STARTTLS). Sin puerto fijo, si 465 falla se intenta 587.\n  RESP_USER, RESP_PASS, RESP_HOST, RESP_PORT\n                                    cuenta del respaldo; se usa solo si la de arriba no funciona (Reply-To sigue siendo SMTP_USER)\n  FACT_FALLBACK                     '0' = no usar la cuenta del respaldo\n  FACT_BCC                          opcional: copia oculta (varios separados por coma)\n  FACT_FROM_NAME                    opcional: nombre del remitente (por defecto \"Impulso Académico\")\n\"\"\"\nimport os, re, smtplib, ssl, sys\nfrom email.message import EmailMessage\nfrom email.utils import formataddr\n\nEMAIL = re.compile(r'^[^\\s@,;<>]+@[^\\s@,;<>]+\\.[^\\s@,;<>]+$')\n\n\ndef ruta_segura(p):\n    \"\"\"Solo archivos dentro de facturas/, sin salir de la carpeta.\"\"\"\n    p = (p or '').strip()\n    if not p:\n        return ''\n    norm = os.path.normpath(p)\n    if not norm.startswith('facturas' + os.sep) or norm.startswith('..') or os.path.isabs(norm):\n        raise ValueError(f'Ruta no permitida: {p}')\n    if not os.path.isfile(norm):\n        raise FileNotFoundError(f'No existe en el repositorio: {p}')\n    return norm\n\n\ndef main():\n    para = (os.environ.get('PARA') or '').strip()\n    asunto = (os.environ.get('ASUNTO') or '').replace('\\r', ' ').replace('\\n', ' ').strip()[:200]\n    mensaje = os.environ.get('MENSAJE') or ''\n    if not EMAIL.match(para):\n        print(f'ERROR: correo de destino no válido: {para!r}')\n        return 1\n    if not asunto or not mensaje.strip():\n        print('ERROR: faltan el asunto o el mensaje.')\n        return 1\n    prueba = os.environ.get('PRUEBA') == '1'\n    xml = pdf = ''\n    if not prueba:\n        try:\n            xml = ruta_segura(os.environ.get('XML_PATH'))\n            pdf = ruta_segura(os.environ.get('PDF_PATH'))\n        except (ValueError, FileNotFoundError) as e:\n            print(f'ERROR: {e}')\n            return 1\n        if not xml:\n            print('ERROR: falta la ruta del XML.')\n            return 1\n\n    user, password = os.environ.get('SMTP_USER', '').strip(), os.environ.get('SMTP_PASS', '').strip()\n    host = os.environ.get('SMTP_HOST', '').strip() or 'smtpout.secureserver.net'\n    port = int(os.environ.get('SMTP_PORT', '').strip() or 465)\n    nombre = os.environ.get('FACT_FROM_NAME', '').strip() or 'Impulso Académico'\n    bcc = [x.strip() for x in os.environ.get('FACT_BCC', '').split(',') if EMAIL.match(x.strip())]\n    destinatarios = [para] + bcc\n    adjuntos = []\n    for ruta, maintype, subtype in ((pdf, 'application', 'pdf'), (xml, 'application', 'xml')):\n        if ruta:\n            with open(ruta, 'rb') as f:\n                adjuntos.append((f.read(), maintype, subtype, os.path.basename(ruta)))\n\n    def armar(remitente, responder):\n        msg = EmailMessage()\n        msg['Subject'] = asunto\n        msg['From'] = formataddr((nombre, remitente))\n        msg['To'] = para\n        msg['Reply-To'] = responder\n        msg.set_content(mensaje)\n        for data, maintype, subtype, fn in adjuntos:\n            msg.add_attachment(data, maintype=maintype, subtype=subtype, filename=fn)\n        return msg\n\n    # Intentos en orden. Solo se pasa al siguiente si falló ANTES de entregar el mensaje (no hay duplicados).\n    intentos = []\n    if user and password:\n        intentos.append(('contacto', host, port, user, password))\n        if port == 465 and not os.environ.get('SMTP_PORT', '').strip():  # sin puerto fijo: probar también 587\n            intentos.append(('contacto', host, 587, user, password))\n    r_user, r_pass = os.environ.get('RESP_USER', '').strip(), os.environ.get('RESP_PASS', '').strip()\n    if r_user and r_pass and os.environ.get('FACT_FALLBACK', '').strip() != '0':\n        intentos.append(('respaldo', os.environ.get('RESP_HOST', '').strip() or 'smtp.gmail.com',\n                         int(os.environ.get('RESP_PORT', '').strip() or 465), r_user, r_pass))\n    if not intentos:\n        print('::error::Falta el secreto FACT_SMTP_PASS (la contraseña de contacto@impulsoacademico.mx) en Settings → Secrets and variables → Actions.')\n        print('ERROR: falta el secreto FACT_SMTP_PASS (la contraseña de contacto@impulsoacademico.mx) en Settings → Secrets and variables → Actions.')\n        return 1\n\n    ctx = ssl.create_default_context()\n    fallas = []\n\n    def iniciar_sesion(s, u, pw):\n        # Un solo método (PLAIN, si no LOGIN) para ver la respuesta real del servidor. smtplib.login prueba varios\n        # y, si el servidor cierra tras rechazar el primero, solo deja ver \"Connection unexpectedly closed\".\n        anunciados = (s.esmtp_features.get('auth') or '').upper().split()\n        print(f'  métodos de inicio de sesión del servidor: {\" \".join(anunciados) or \"(ninguno)\"}; '\n              f'contraseña de {len(pw)} caracteres' + (', con espacios' if ' ' in pw else '') + (', con acentos u otros símbolos especiales' if not pw.isascii() else ''))\n        mech = 'PLAIN' if 'PLAIN' in anunciados or not anunciados else ('LOGIN' if 'LOGIN' in anunciados else 'PLAIN')\n        s.user, s.password = u, pw\n        try:\n            s.auth(mech, getattr(s, 'auth_' + mech.lower()), initial_response_ok=True)\n        except smtplib.SMTPServerDisconnected as e:\n            raise smtplib.SMTPAuthenticationError(0, f'el servidor cerró la conexión al recibir el usuario y la contraseña ({e}); casi siempre es contraseña incorrecta') from e\n    for cuenta, h, pt, u, pw in intentos:\n        paso = 'conectar'\n        modo = 'SSL' if pt == 465 else 'STARTTLS'\n        print(f'Intento: {u} por {h}:{pt} ({modo})')\n        try:\n            if pt == 465:\n                s = smtplib.SMTP_SSL(h, pt, context=ctx, timeout=60)\n            else:\n                s = smtplib.SMTP(h, pt, timeout=60)\n            with s:\n                paso = 'saludo'\n                s.ehlo()\n                if pt != 465 and os.environ.get('SMTP_NO_TLS') != '1':\n                    paso = 'cifrado'\n                    s.starttls(context=ctx)\n                    s.ehlo()\n                if os.environ.get('SMTP_NO_LOGIN') != '1':\n                    paso = 'inicio de sesión'\n                    iniciar_sesion(s, u, pw)\n                print('  conectado e inició sesión')\n                paso = 'envío'\n                s.send_message(armar(u, user or u), to_addrs=destinatarios)\n        except Exception as e:  # noqa: BLE001\n            if isinstance(e, smtplib.SMTPAuthenticationError):\n                txt = e.smtp_error.decode(errors='replace') if isinstance(e.smtp_error, bytes) else str(e.smtp_error)\n                detalle = 'usuario o contraseña rechazados' + (f' — el servidor respondió {e.smtp_code}' if e.smtp_code else '') + f': {\" \".join(txt.split())}'\n            else:\n                detalle = f'{type(e).__name__}: {e}'\n            print(f'  falló en «{paso}»: {detalle}')\n            fallas.append(f'{u} por {h}:{pt} falló en «{paso}» ({detalle})')\n            if paso == 'envío' and not isinstance(e, (smtplib.SMTPSenderRefused, smtplib.SMTPRecipientsRefused)):\n                break  # pudo haberse entregado: no reintentar para no duplicar\n            continue\n        if cuenta == 'respaldo':\n            print(f'::warning::No se pudo enviar desde {user or \"contacto@\"}; se envió desde la cuenta del respaldo ({u}). Las respuestas llegan a {user or u}.')\n        print(('Correo de prueba enviado a ' if prueba else 'Factura enviada a ') + para + f' desde {u}' + (f' (copia oculta a {len(bcc)})' if bcc else '') + '.')\n        return 0\n\n    resumen = ' | '.join(fallas)\n    print(f'::error::No se pudo enviar el correo. {resumen}')\n    print(f'ERROR al enviar el correo. {resumen}')\n    if any('rechazados' in f for f in fallas):\n        print('Si dice «usuario o contraseña rechazados»: confirma la contraseña entrando al correo web y vuelve a pegarla en FACT_SMTP_PASS sin espacios.')\n    return 1\n\n\nif __name__ == '__main__':\n    sys.exit(main())\n"};
const GH_PATH = 'data/agenda.json';
const GH_CFG_KEY = 'ia-gh-config';
const COLS = ['students','bookings','waitlist','config','fiscal','invoices','cobros'];
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
function b64enc(str){ const by = new TextEncoder().encode(str); let bin = ''; for (let i=0;i<by.length;i+=0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i+0x8000)); return btoa(bin); }
function b64dec(b64){ const bin = atob(String(b64).replace(/\s/g,'')); const by = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) by[i] = bin.charCodeAt(i); return new TextDecoder().decode(by); }
function mergeDeep(t, s){ for (const k of Object.keys(s)){ const v = s[k]; if (v && typeof v==='object' && !Array.isArray(v) && t[k] && typeof t[k]==='object' && !Array.isArray(t[k])) mergeDeep(t[k], v); else t[k] = v; } return t; }
function applyOps(data, ops){
  for (const o of ops){
    data[o.col] = data[o.col] || {};
    if (o.op==='set') data[o.col][o.id] = clone(o.data);
    else if (o.op==='update'){ if (data[o.col][o.id]) mergeDeep(data[o.col][o.id], clone(o.data)); }
    else if (o.op==='delete') delete data[o.col][o.id];
  }
  return data;
}
async function ghFetch(gc, path, opts={}){
  const base = gc.apiBase || 'https://api.github.com';
  const headers = Object.assign({ 'Authorization': 'Bearer ' + gc.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {});
  if (opts.body) headers['Content-Type'] = 'application/json';
  return fetch(base + path, { method: opts.method || 'GET', headers, body: opts.body, cache: 'no-store' });
}
function ghErrText(status, j){
  if (status===401) return 'GitHub rechazó el token (vencido o revocado). Crea uno nuevo y vuelve a conectar en Ajustes.';
  if (status===403) return (j && /rate limit/i.test(j.message||'')) ? 'GitHub limitó las solicitudes por un rato. Se reintentará solo.' : 'El token no tiene permiso para escribir en el repositorio de datos.';
  if (status===404) return 'No se encontró el repositorio de datos o el token no tiene acceso a él.';
  return `GitHub respondió con un error (${status}). Se reintentará.`;
}
function githubDB(gc){
  const tag = gc.owner + '/' + gc.repo;
  const CACHE = 'ia-gh-cache:' + tag, QUEUE = 'ia-gh-queue:' + tag;
  const branch = gc.branch || 'main';
  const cpath = `/repos/${gc.owner}/${gc.repo}/contents/${GH_PATH}`;
  let remote = lsGet(CACHE) || { data:{}, sha:null, etag:null, syncedAt:null, loaded:false };
  let queue = lsGet(QUEUE) || [];
  let view = applyOps(clone(remote.data), queue);
  const listeners = {};
  let pushTimer = null, pushing = false, retryMs = 15000;
  const status = { state: queue.length ? 'pending' : 'ok', pending: queue.length, syncedAt: remote.syncedAt, msg: '', fatal: false };
  const onStatus = new Set();
  const setStatus = (state, msg='', fatal=false) => { Object.assign(status, { state, msg, fatal, pending: queue.length, syncedAt: remote.syncedAt }); onStatus.forEach(f => f(status)); };
  const saveCache = () => { try { localStorage.setItem(CACHE, JSON.stringify(remote)); } catch(e){} };
  const saveQueue = () => { try { localStorage.setItem(QUEUE, JSON.stringify(queue)); } catch(e){ setStatus('error', 'El navegador no pudo guardar la copia local. No cierres la página hasta que diga “Guardado”.'); } };
  const snap = col => { const docs = Object.entries(view[col]||{}).map(([id,d]) => ({ id, exists:true, data:() => d })); return { docs, size:docs.length, empty:!docs.length, docChanges:() => [] }; };
  const emit = col => (listeners[col]||[]).forEach(fn => fn(snap(col)));
  const emitAll = () => COLS.forEach(emit);

  async function pull(){
    const headers = {};
    if (remote.loaded && remote.etag) headers['If-None-Match'] = remote.etag;
    const r = await ghFetch(gc, `${cpath}?ref=${encodeURIComponent(branch)}`, { headers });
    if (r.status===304){ return false; }
    if (r.status===404){
      const rr = await ghFetch(gc, `/repos/${gc.owner}/${gc.repo}`);
      if (!rr.ok){ const e = new Error(ghErrText(rr.status)); e.status = rr.status; throw e; }
      remote = { data:{}, sha:null, etag:null, syncedAt:new Date().toISOString(), loaded:true };
    } else if (r.ok){
      const j = await r.json();
      let text;
      if (j.content && j.encoding==='base64') text = b64dec(j.content);
      else { const rr = await ghFetch(gc, `${cpath}?ref=${encodeURIComponent(branch)}`, { headers:{ Accept:'application/vnd.github.raw+json' } }); text = await rr.text(); }
      const parsed = JSON.parse(text);
      const data = {}; COLS.forEach(c => data[c] = parsed[c] || {});
      const changed = JSON.stringify(data) !== JSON.stringify(remote.data);
      remote = { data, sha:j.sha, etag:r.headers.get('ETag'), syncedAt:new Date().toISOString(), loaded:true };
      if (!changed){ saveCache(); return false; }
    } else {
      let j = null; try { j = await r.json(); } catch(e){}
      const e = new Error(ghErrText(r.status, j)); e.status = r.status; throw e;
    }
    view = applyOps(clone(remote.data), queue);
    saveCache(); emitAll();
    return true;
  }
  function commitMsg(ops){
    const n = ops.length, cols = [...new Set(ops.map(o => ({students:'alumnos',bookings:'reservas',waitlist:'lista de espera',config:'ajustes',fiscal:'datos fiscales',invoices:'facturas',cobros:'cobros'}[o.col] || o.col)))];
    return `Agenda: ${n} cambio${n>1?'s':''} (${cols.join(', ')})`;
  }
  async function push(){
    if (pushing || !queue.length) return;
    pushing = true; setStatus('saving');
    try {
      for (let attempt = 0; attempt < 5; attempt++){
        await pull();
        const n = queue.length, ops = queue.slice(0, n);
        const next = applyOps(clone(remote.data), ops);
        const file = Object.assign({ version:1, updatedAt:new Date().toISOString() }, next);
        const body = { message: commitMsg(ops), content: b64enc(JSON.stringify(file, null, 1)), branch };
        if (remote.sha) body.sha = remote.sha;
        const r = await ghFetch(gc, cpath, { method:'PUT', body: JSON.stringify(body) });
        if (r.ok){
          const j = await r.json();
          remote = { data: next, sha: j.content && j.content.sha, etag: null, syncedAt: new Date().toISOString(), loaded: true };
          queue = queue.slice(n); saveQueue(); saveCache();
          view = applyOps(clone(remote.data), queue);
          retryMs = 15000;
          setStatus(queue.length ? 'pending' : 'ok');
          if (queue.length) schedule();
          return;
        }
        if (r.status===409 || r.status===422){ remote.etag = null; await new Promise(res => setTimeout(res, 300 + Math.random()*700)); continue; }
        let j = null; try { j = await r.json(); } catch(e){}
        const e = new Error(ghErrText(r.status, j)); e.status = r.status; throw e;
      }
      throw new Error('Otro dispositivo está guardando al mismo tiempo. Se reintentará.');
    } catch(e){
      const offline = !(e && e.status);
      const fatal = e && (e.status===401 || e.status===404 || (e.status===403 && !/limitó/.test(e.message)));
      setStatus(offline ? 'offline' : 'error', offline ? 'Sin conexión con GitHub. Los cambios están a salvo en este navegador y se subirán solos.' : e.message, fatal);
      clearTimeout(pushTimer); pushTimer = setTimeout(push, retryMs); retryMs = Math.min(retryMs*2, 5*60e3);
    } finally { pushing = false; }
  }
  function schedule(){ clearTimeout(pushTimer); pushTimer = setTimeout(push, 1200); }
  function enqueue(op){
    queue.push(op); saveQueue();
    applyOps(view, [op]);
    setStatus('pending'); emit(op.col); schedule();
  }
  async function refresh(){
    if (pushing) return;
    try { const ch = await pull(); if (queue.length) await push(); else setStatus('ok'); return ch; }
    catch(e){ const offline = !(e && e.status); setStatus(offline ? 'offline' : 'error', offline ? 'Sin conexión con GitHub. Mostrando la última copia guardada en este navegador.' : e.message, e && (e.status===401 || e.status===404)); }
  }
  setInterval(() => { if (document.visibilityState==='visible') refresh(); }, 60e3);
  window.addEventListener('focus', () => refresh());
  window.addEventListener('online', () => refresh());
  window.addEventListener('beforeunload', e => { if (queue.length){ e.preventDefault(); e.returnValue = ''; } });
  const rid = () => Date.now().toString(36) + [...crypto.getRandomValues(new Uint8Array(8))].map(b => (b%36).toString(36)).join('');

  return {
    gh: true, gc, status, onStatus,
    hasCache: () => remote.loaded,
    pending: () => queue.length,
    ready: refresh,
    syncNow: async () => { await refresh(); return status; },
    raw: () => clone(view),
    collection(col){
      return {
        doc(id){
          id = id || rid();
          return { id,
            async set(d){ enqueue({ col, id, op:'set', data: clone(d), at: Date.now() }); },
            async update(d){ if (!view[col] || !view[col][id]){ const e = new Error('missing'); e.code = 'invalid_argument'; throw e; } enqueue({ col, id, op:'update', data: clone(d), at: Date.now() }); },
            async delete(){ enqueue({ col, id, op:'delete', at: Date.now() }); }
          };
        },
        onSnapshot(fn){ (listeners[col] = listeners[col] || []).push(fn); setTimeout(() => fn(snap(col)), 0); return () => { listeners[col] = listeners[col].filter(f => f!==fn); }; }
      };
    }
  };
}
/* Instala o actualiza en el repositorio de datos el respaldo automático por correo */
async function ghInstallBackup(gc){
  const out = [];
  for (const [path, content] of Object.entries(GH_FILES)){
    const url = `/repos/${gc.owner}/${gc.repo}/contents/${path}`;
    const g = await ghFetch(gc, `${url}?ref=${encodeURIComponent(gc.branch||'main')}`);
    let sha = null;
    if (g.ok){ const j = await g.json(); sha = j.sha; if (j.content && b64dec(j.content) === content){ out.push([path, 'ok']); continue; } }
    else if (g.status!==404){ out.push([path, 'error ' + g.status]); continue; }
    const body = { message: `Respaldo por correo: ${sha ? 'actualiza' : 'instala'} ${path}`, content: b64enc(content), branch: gc.branch||'main' };
    if (sha) body.sha = sha;
    const p = await ghFetch(gc, url, { method:'PUT', body: JSON.stringify(body) });
    out.push([path, p.ok ? (sha ? 'actualizado' : 'instalado') : 'error ' + p.status]);
  }
  return out;
}
async function ghDispatchBackup(gc){
  const r = await ghFetch(gc, `/repos/${gc.owner}/${gc.repo}/actions/workflows/respaldo-correo.yml/dispatches`, { method:'POST', body: JSON.stringify({ ref: gc.branch||'main', inputs:{ motivo:'enviado desde la agenda' } }) });
  if (r.status===204) return { ok:true };
  if (r.status===404) return { ok:false, msg:'No encontré el respaldo automático en el repositorio. Pulsa “Instalar respaldo por correo”.' };
  if (r.status===403) return { ok:false, msg:'El token no tiene el permiso “Actions: Read and write”.' };
  return { ok:false, msg:`GitHub respondió ${r.status}.` };
}

    try {
      const r = await ghFetch(gc, `/repos/${gc.owner}/${gc.repo}`);
      if (!r.ok) throw ghErrText(r.status);
      const j = await r.json();
      if (!j.private) throw `El repositorio ${gc.owner}/${gc.repo} es público: los datos de los alumnos quedarían a la vista de cualquiera. Hazlo privado (Settings → General → Danger Zone → Change visibility) o crea uno privado.`;
      if (j.permissions && j.permissions.push === false) throw 'El token puede leer pero no escribir. Dale el permiso “Contents: Read and write”.';

        if (!p.ok) throw ghErrText(p.status);

      err.textContent = 'Instalando el respaldo por correo…';
      let inst = []; try { inst = await ghInstallBackup(gc); } catch(x){}
      lsSet(GH_CFG_KEY, gc); lsSet('ia-storage', 'github');
      const bad = inst.filter(x => /^error/.test(x[1]));
      if (bad.length) lsSet('ia-gh-install-warning', 'No se pudo instalar el respaldo por correo (falta el permiso “Workflows: Read and write” en el token). Puedes instalarlo después desde Ajustes.');
      location.reload();
    } catch(x){ err.textContent = typeof x==='string' ? x : 'No hay conexión con GitHub. Revisa el internet e inténtalo de nuevo.'; btn.disabled = false; }
  };
}

/* ---------- Indicador de guardado ---------- */
function syncLabel(st){
  const when = st.syncedAt ? hm(new Date(st.syncedAt)) : '';
  if (st.state==='ok') return ['ok', `Guardado en GitHub${when?' · '+when:''}`];
  if (st.state==='saving') return ['saving', 'Guardando…'];
  if (st.state==='pending') return ['saving', `${st.pending} cambio${st.pending>1?'s':''} por subir…`];
  if (st.state==='offline') return ['warn', `Sin conexión · ${st.pending} pendiente${st.pending===1?'':'s'} a salvo`];
  return ['bad', 'Error al guardar: ver Ajustes'];
}
function renderSync(){

}

function cellHtml(d, h){
  const w = dowOf(d), t = slotType(w, h), T = todayS();
  if (!t) return `<div class="cell none">—</div>`;
  const list = occ(d, h), cap = capOf(t), n = list.length, free = cap - n;
  const pre = list.filter(b => b.status==='pre').length;
  const lvl = free <= 0 ? 'lvl-full' : free <= S.cfg.lowThreshold ? 'lvl-low' : '';
  const name = t==='imp' ? 'Impulso' : t==='tut' ? 'Tutoría' : 'Tutoría o reposición';
  const sub = free <= 0 ? (n>cap?`Sobrecupo +${n-cap}`:'Lleno') : `${free} libre${free>1?'s':''}`;
  return `<button class="cell ${t} ${lvl} ${d<T?'past':''}" data-act="slot" data-d="${d}" data-h="${h}" aria-label="${name} ${fmtD(d)} ${hourLbl(h)}: ${n} de ${cap}">
    <span class="sub">${name}</span><span class="cnt">${n}/${cap}</span><span class="sub">${sub}${pre?` · ${pre} pre`:''}</span>
    <span class="bar" style="width:${Math.min(100, n/cap*100)}%"></span></button>`;
}
function calWeek(){
  const m = mondayOf(S.cal.date), days = [0,1,2,3,4,5].map(i => addDays(m,i)), T = todayS();
  let rows = '';
  for (const h of HOURS){
    if (h===15){ rows += `<tr><th class="hr">${rangeLbl(15)}</th><td colspan="6"><div class="receso">RECESO</div></td></tr>`; continue; }
    rows += `<tr><th class="hr">${rangeLbl(h)}</th>${days.map(d => `<td>${cellHtml(d,h)}</td>`).join('')}</tr>`;
  }
  return `<div class="calcard"><div class="scroll-x"><table class="wk"><thead><tr><th class="hr"></th>${days.map(d => `<th class="${d===T?'today':''}">${DOWS[dowOf(d)]}<b>${pd(d).getDate()}</b></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function daySummary(d){
  const w = dowOf(d); let impT=0, impF=0, impMin=Infinity, tutT=0, tutF=0, tutMin=Infinity;
  for (const h of HOURS){
    const t = slotType(w,h); if (!t) continue;
    const f = capOf(t) - occ(d,h).length;
    if (t==='imp'){ impT += capOf(t); impF += Math.max(0,f); impMin = Math.min(impMin,f); }
    else { tutT += capOf(t); tutF += Math.max(0,f); tutMin = Math.min(tutMin,f); }
  }
  return { impT, impF, impMin, tutT, tutF, tutMin };
}
function calMonth(){
  const d0 = pd(S.cal.date), first = ds(new Date(d0.getFullYear(), d0.getMonth(), 1)), last = ds(new Date(d0.getFullYear(), d0.getMonth()+1, 0));
  let d = mondayOf(first); const T = todayS(); let cells = '';
  while (d <= last || dowOf(d)!==1){
    if (d > last && dowOf(d)===1) break;
    if (dowOf(d)!==0){
      const s = daySummary(d), out = d.slice(0,7)!==first.slice(0,7);
      const cls = v => v<=0 ? 'full' : v<=S.cfg.lowThreshold ? 'low' : '';
      cells += `<button class="mday ${out?'out':''} ${d===T?'today':''}" data-act="gotoday" data-d="${d}" aria-label="${fmtD(d)}">

        ${s.impT?`<span class="mline imp ${cls(s.impMin)}" title="Lugares libres de Impulso"><span>Impulso</span><span>${s.impF} libres</span></span>`:''}
        ${s.tutT?`<span class="mline tut ${cls(s.tutMin)}" title="Lugares libres de tutoría"><span>${dowOf(d)===5?'Tut/Rep':'Tutoría'}</span><span>${s.tutF}/${s.tutT}</span></span>`:''}
      </button>`;
    }
    d = addDays(d,1);
  }
  return `<div class="calcard"><div class="mgrid">${['lun','mar','mié','jue','vie','sáb'].map(x=>`<div class="mhead">${x}</div>`).join('')}${cells}</div>
    <p class="small muted" style="margin:10px 0 0">Cada día muestra los lugares libres sumando todos sus horarios. Borde naranja: algún horario con ≤ ${S.cfg.lowThreshold} lugares. Rojo: algún horario lleno.</p></div>`;
}
function calDay(){

function studentOptions(sel, filterPlan){
  const list = Object.values(S.students).filter(s => s.active!==false).sort((a,b) => a.name.localeCompare(b.name,'es'));
  return `<option value="">Elegir alumno…</option><option value="__new">+ Registrar alumno nuevo</option>` +
    list.map(s => `<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(labelOf(s))} · ${esc(planName(s.plan))}</option>`).join('');
}
function newStudentFields(prefix){
  return `<div class="grid2" id="${prefix}-new" hidden>
    <div class="field"><label for="${prefix}-nname">Nombre del alumno</label><input id="${prefix}-nname" type="text" autocomplete="off"></div>
    <div class="field"><label for="${prefix}-ntutor">Padre, madre o tutor</label><input id="${prefix}-ntutor" type="text" autocomplete="off"></div>
    <div class="field"><label for="${prefix}-nphone">WhatsApp (10 dígitos)</label><input id="${prefix}-nphone" type="tel" inputmode="numeric" autocomplete="off"></div>
    <div class="field"><label for="${prefix}-nplan">Plan</label><select id="${prefix}-nplan">${Object.keys(S.cfg.plans).map(p=>`<option value="${p}">${esc(planName(p))} (${S.cfg.plans[p].hours} h/sem)</option>`).join('')}<option value="ninguno">Sin plan (solo tutorías)</option></select></div>
  </div>`;
}
async function resolveStudent(prefix, selId){
  if (selId !== '__new') return selId;
  const name = $(`#${prefix}-nname`).value.trim(), tutor = $(`#${prefix}-ntutor`).value.trim();
  const phone = $(`#${prefix}-nphone`).value.replace(/\D/g,''), plan = $(`#${prefix}-nplan`).value;
  if (!name) throw 'Escribe el nombre del alumno.';
  if (phone.length < 10) throw 'El WhatsApp debe tener 10 dígitos.';
  const id = newId('students');
  const ok = await dbSet('students', id, { name, tutor, phone, plan, since: todayS(), prefs: [], notes:'', active:true, createdAt:new Date().toISOString() });
  if (!ok) throw 'No se pudo registrar al alumno.';
  S.students[id] = { id, name, tutor, phone, plan, since: todayS(), prefs: [] };
  return id;
}
function openImpForm(pre={}){
  const F = {
    studentId: pre.studentId || '', plan: pre.plan || '', from: pre.start && pre.start > todayS() ? pre.start : addDays(todayS(), 2),
    slots: new Set(pre.slots || (pre.key ? [pre.key] : [])), status:'pre', exc:false, renewalOf: pre.renewalOf || null
  };
  /* El mes empieza en la primera clase de sus horarios a partir de 'from' (con pago ya verificado: la siguiente clase después de ahora) */
  const startOf = () => (F.slots.size && firstClassDate([...F.slots], F.from, F.status==='conf' ? Date.now() : 0)) || F.from;
  if (F.studentId && !F.plan){ const s = stu(F.studentId); F.plan = S.cfg.plans[s.plan] ? s.plan : 'basico'; }
  if (!F.plan) F.plan = 'basico';
  const plans = Object.keys(S.cfg.plans);
  openModal(F.renewalOf ? 'Renovación de plan Impulso' : 'Nueva reserva · Impulso Académico', `
    <div class="grid2">
      <div class="field"><label for="if-stu">Alumno</label><select id="if-stu">${studentOptions(F.studentId)}</select></div>
      <div class="field"><label for="if-plan">Plan</label><select id="if-plan">${plans.map(p=>`<option value="${p}" ${p===F.plan?'selected':''}>${esc(planName(p))} · ${S.cfg.plans[p].hours} h a la semana</option>`).join('')}</select></div>
      <div class="field"><label for="if-start" id="if-start-l">Puede empezar a partir de</label><input id="if-start" type="date" value="${F.from}"></div>
    </div>
    ${newStudentFields('if')}
    <div id="if-dyn"></div>
    <fieldset class="panel stack" style="gap:8px"><legend class="lbl">Estado</legend>
      <label class="row"><input type="radio" name="if-st" value="pre" checked> Prereserva (aparta el lugar hasta el límite de pago)</label>
      <label class="row"><input type="radio" name="if-st" value="conf"> Pago ya verificado</label>
      <div class="field" id="if-amt-w" hidden><label for="if-amt">Monto recibido (opcional)</label><input id="if-amt" type="number" min="0" step="1" value="${S.cfg.plans[F.plan].price||''}"></div>
    </fieldset>
    <label class="row small"><input type="checkbox" id="if-exc"> Registrar como excepción (permite sobrecupo o pago con menos de 48 h; queda anotado)</label>
    <div class="err" id="if-err" role="alert"></div>`,
    `<button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="if-save">Guardar</button>`, { wide:true, sub:'El mes empieza en la primera clase después del pago: si esa clase es el 15, termina el 14 del mes siguiente.' });
  const dyn = () => {
    const start = startOf(), end = periodEnd(start), hours = S.cfg.plans[F.plan].hours;
    const keys = [...F.slots].sort(keySort), pat = checkPattern(keys, hours);
    const hrs = [9,10,13,14,16,17];
    let rows = hrs.map(h => `<tr><td class="h">${rangeLbl(h)}</td>${IMP_DOWS.map(w => {
      const k = w+'-'+h;
      if (SLOT[k]!=='imp') return `<td><span class="pk na">—</span></td>`;
      const { free } = minFreeIn(k, start, end);
      const on = F.slots.has(k);
      const cls = free<=0 ? 'full' : free<=S.cfg.lowThreshold ? 'low' : '';
      return `<td><label class="pk ${on?'on':''} ${cls}"><input type="checkbox" data-slot="${k}" ${on?'checked':''}><span>${free<=0?'Lleno':free+' libres'}</span></label></td>`;
    }).join('')}</tr>`).join('');
    const fc = keys.length ? firstClass({ type:'impulso', slots:keys, start }) : null;
    const dl = fc ? new Date(fc.getTime()-H48) : null;
    const late = F.status==='pre' && dl && dl.getTime() < Date.now();
    const fulls = keys.filter(k => minFreeIn(k, start, end).free <= 0);
    $('#if-dyn').innerHTML = `
      <div class="note">${fc ? `Primera clase e inicio del mes: <b>${fmtDT(fc)}</b> · Termina: <b>${fmtD(end)}</b>${F.status==='pre'?` · Pago límite: <b>${fmtDT(dl)}</b>`:''}` : 'Elige los horarios para calcular la primera clase y el fin del mes.'}
      ${F.status==='pre' && fc ? '<div class="small muted" style="margin-top:4px">Fecha prevista. Al confirmar el pago, el mes se recalcula desde la siguiente clase después del pago.</div>' : ''}</div>
      <div><div class="lbl" style="margin-bottom:6px">Horarios (los números son los lugares libres en todo el periodo)</div>
      <div class="scroll-x"><table class="pick"><thead><tr><th></th>${IMP_DOWS.map(w=>`<th>${DOWS[w]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>
      <div class="note ${pat.ok?'ok':'warn'}">${pat.ok?'Combinación válida: ':''}${esc(pat.msg)}</div>
      ${fulls.length?`<div class="note bad">Sin lugar en ${esc(fmtSlots(fulls))} durante el periodo. ${fulls.map(k=>{const nf=nextFree(k,start);return nf?`${fmtSlots([k])}: libre desde ${fmtD(nf.date)}.`:'';}).join(' ')}</div>`:''}
      ${late?`<div class="note bad">La primera clase es en menos de 48 h, así que el pago ya no llegaría a tiempo para apartar. Cambia la fecha, regístralo con pago verificado o márcalo como excepción.</div>`:''}`;
  };
  dyn();
  const syncStu = () => {
    const v = $('#if-stu').value; F.studentId = v;
    $('#if-new').hidden = v !== '__new';
    if (v && v!=='__new'){ const s = stu(v); if (S.cfg.plans[s.plan]){ F.plan = s.plan; $('#if-plan').value = s.plan; }
      if (!F.slots.size && (s.prefs||[]).length) (s.prefs||[]).filter(k=>SLOT[k]==='imp').forEach(k=>F.slots.add(k)); }
    dyn();
  };
  $('#if-stu').onchange = syncStu;
  if (F.studentId === '__new') syncStu();
  $('#if-plan').onchange = e => { F.plan = e.target.value; $('#if-amt').value = S.cfg.plans[F.plan].price || ''; dyn(); };
  $('#if-start').onchange = e => { if (e.target.value){ F.from = e.target.value; dyn(); } };
  $('#if-dyn').addEventListener('change', e => { const k = e.target.dataset.slot; if (!k) return; if (e.target.checked) F.slots.add(k); else F.slots.delete(k); dyn(); });
  $$('input[name=if-st]').forEach(r => r.onchange = () => {
    F.status = $('input[name=if-st]:checked').value; $('#if-amt-w').hidden = F.status!=='conf';
    if (F.status==='conf' && !F.renewalOf){ F.from = todayS(); $('#if-start').value = F.from; }
    $('#if-start-l').textContent = F.status==='conf' ? 'Fecha del pago' : 'Puede empezar a partir de';
    dyn();
  });
  $('#if-exc').onchange = e => F.exc = e.target.checked;
  $('#if-save').onclick = async () => {
    const err = $('#if-err'); err.textContent = '';
    try {
      if (!F.studentId) throw 'Elige un alumno o registra uno nuevo.';
      if (!F.slots.size) throw 'Elige los horarios.';
      const keys = [...F.slots].sort(keySort), hours = S.cfg.plans[F.plan].hours, start = startOf(), end = periodEnd(start);
      const pat = checkPattern(keys, hours);
      if (!pat.ok && !F.exc) throw pat.msg;
      const full = keys.filter(k => minFreeIn(k, start, end).free <= 0);
      if (full.length && !F.exc) throw `Sin lugar en ${fmtSlots(full)}. Elige otro horario, agrega al alumno a la lista de espera o márcalo como excepción.`;
      const dl = deadline({ type:'impulso', slots:keys, start });
      if (F.status==='pre' && dl.getTime() < Date.now() && !F.exc) throw 'La primera clase es en menos de 48 h: el pago ya no llegaría a tiempo. Cambia la fecha, regístralo con pago verificado o márcalo como excepción.';
      if (F.studentId !== '__new'){
        const overlap = S.bk.find(b => b.type==='impulso' && isActive(b) && b.studentId===F.studentId && b.start<=end && start<=b.end && b.id!==F.renewalOf);
        if (overlap && !F.exc) throw `Este alumno ya tiene un plan del ${fmtD(overlap.start)} al ${fmtD(overlap.end)} que se cruza con este periodo.`;
      }
      $('#if-save').disabled = true;
      const sid = await resolveStudent('if', F.studentId);
      const id = newId('bookings'), now = new Date().toISOString();
      const doc = { type:'impulso', studentId:sid, plan:F.plan, hours, slots:keys, start, end, status:F.status, createdAt:now, exception:F.exc, notes:'' };
      if (F.renewalOf) doc.renewalOf = F.renewalOf;
      if (F.status==='conf'){ doc.paidAt = now; doc.amount = Number($('#if-amt').value)||0; }
      if (await dbSet('bookings', id, doc)){
        toast(F.status==='pre' ? 'Prereserva guardada' : 'Reserva pagada guardada');
        S.waitlist && Object.values(S.waitlist).filter(w => w.studentId===sid && w.status==='activa').forEach(w => dbUpdate('waitlist', w.id, { status:'atendida', closedAt:now }));
        openBooking(id, { ...doc, id });
      } else $('#if-save').disabled = false;
    } catch(e){ err.textContent = typeof e==='string' ? e : 'No se pudo guardar.'; $('#if-save').disabled = false; }
  };
}

      <div class="field"><label for="tf-type">Tipo</label><select id="tf-type"><option value="tutoria">Tutoría (pagada, 1 hora)</option><option value="repo">Reposición de clase (incluida en el plan)</option></select></div>
      <div class="field"><label for="tf-date">Fecha</label><input id="tf-date" type="date" value="${F.date}"></div>
      <div class="field"><label for="tf-hour">Hora</label><select id="tf-hour"></select></div>
    </div>
    ${newStudentFields('tf')}
    <div id="tf-dyn"></div>
    <fieldset class="panel stack" style="gap:8px" id="tf-stbox"><legend class="lbl">Estado</legend>
      <label class="row"><input type="radio" name="tf-st" value="pre" checked> Prereserva (pendiente de pago)</label>
      <label class="row"><input type="radio" name="tf-st" value="conf"> Pago ya verificado</label>
      <div class="field" id="tf-amt-w" hidden><label for="tf-amt">Monto recibido (opcional)</label><input id="tf-amt" type="number" min="0" value="${S.cfg.tutoriaPrice||''}"></div>
    </fieldset>
    <label class="row small"><input type="checkbox" id="tf-exc"> Registrar como excepción (permite sobrecupo o menos de 48 h)</label>
    <div class="err" id="tf-err" role="alert"></div>`,
    `<button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="tf-save">Guardar</button>`, { sub:'Máximo 2 alumnos por hora, cada uno con su maestra.' });
  $('#tf-type').value = F.type;
  const hoursFor = () => HOURS.filter(h => { const t = slotType(dowOf(F.date), h); return F.type==='repo' ? t==='mix' : (t==='tut'||t==='mix'); });
  const dyn = () => {
    const hs = hoursFor();
    if (!hs.includes(F.hour)) F.hour = hs[0] ?? null;
    $('#tf-hour').innerHTML = hs.length ? hs.map(h => { const n = occ(F.date,h).length, cap = S.cfg.capTutoria; return `<option value="${h}" ${h===F.hour?'selected':''}>${rangeLbl(h)} · ${n>=cap?'lleno':(cap-n)+' libre'+(cap-n>1?'s':'')}</option>`; }).join('') : `<option value="">Sin horarios ese día</option>`;
    $('#tf-stbox').hidden = F.type==='repo';
    let html = '';
    if (F.hour==null){ html = `<div class="note warn">${F.type==='repo'?'Las reposiciones son solo los viernes (1–3 pm y 4–6 pm).':'Ese día no hay horario de tutoría.'}</div>`; }
    else {
      const list = occ(F.date, F.hour), cap = S.cfg.capTutoria, dt = pd(F.date); dt.setHours(F.hour);
      const dl = new Date(dt.getTime()-H48);
      html += `<div class="note">Ocupados: <b>${list.length} de ${cap}</b>${list.length?` (${list.map(b=>esc(labelOf(stu(b.studentId)))+(b.type==='repo'?' · reposición':'')).join(', ')})`:''}. ${F.type==='tutoria'?`Pago límite: <b>${fmtDT(dl)}</b>.`:`Queda firme el <b>${fmtDT(dl)}</b>.`}</div>`;
      if (F.type==='tutoria' && dl.getTime() < Date.now()) html += `<div class="note bad">Faltan menos de 48 h: por regla ya no se puede agendar en este horario.</div>`;
      if (list.length >= cap){
        const repos = list.filter(b => b.type==='repo');
        if (F.type==='tutoria' && repos.length) html += `<div class="note warn">Horario lleno, pero hay reposición(es). La tutoría tiene prioridad: al confirmar su pago, la reposición más reciente quedará desplazada y te avisaré para reprogramarla.</div>`;
        else html += `<div class="note bad">Horario lleno.</div>`;
      }
      if (F.type==='repo' && F.studentId && F.studentId!=='__new'){
        const pb = activePlan(F.studentId, F.date);
        if (!pb) html += `<div class="note bad">El alumno no tiene un plan pagado vigente en esa fecha.</div>`;
        else { const used = reposUsed(pb), lim = S.cfg.plans[pb.plan]?.repos ?? 0;
          html += `<div class="note ${used>=lim?'bad':'ok'}">Reposiciones usadas en su periodo (${fmtD(pb.start)}–${fmtD(pb.end)}): <b>${used} de ${lim}</b> (${esc(planName(pb.plan))}).</div>`; }
      }
    }
    $('#tf-dyn').innerHTML = html;
  };
  dyn();
  $('#tf-stu').onchange = e => { F.studentId = e.target.value; $('#tf-new').hidden = F.studentId!=='__new'; dyn(); };
  $('#tf-type').onchange = e => { F.type = e.target.value; dyn(); };
  $('#tf-date').onchange = e => { if (e.target.value){ F.date = e.target.value; dyn(); } };
  $('#tf-hour').onchange = e => { F.hour = +e.target.value; dyn(); };
  $$('input[name=tf-st]').forEach(r => r.onchange = () => { F.status = $('input[name=tf-st]:checked').value; $('#tf-amt-w').hidden = F.status!=='conf'; });
  $('#tf-exc').onchange = e => F.exc = e.target.checked;
  $('#tf-save').onclick = async () => {
    const err = $('#tf-err'); err.textContent = '';
    try {
      if (!F.studentId) throw 'Elige un alumno o registra uno nuevo.';
      if (F.hour==null) throw 'Elige una fecha y hora válidas.';
      const list = occ(F.date, F.hour), cap = S.cfg.capTutoria;
      const dt = pd(F.date); dt.setHours(F.hour);
      if (dt.getTime() - H48 < Date.now() && F.type==='tutoria' && !F.exc) throw 'Faltan menos de 48 h para esa tutoría. Elige otro horario o márcala como excepción.';
      if (dt.getTime() < Date.now() && !F.exc) throw 'Esa fecha ya pasó.';
      if (list.length >= cap && !F.exc){
        if (!(F.type==='tutoria' && list.some(b => b.type==='repo'))) throw 'Horario lleno. Elige otra hora o márcalo como excepción.';
      }
      if (list.some(b => b.studentId===F.studentId)) throw 'Este alumno ya está en ese horario.';
      if (F.type==='repo' && F.studentId!=='__new' && !F.exc){
        const pb = activePlan(F.studentId, F.date);
        if (!pb) throw 'El alumno no tiene un plan pagado vigente en esa fecha.';
        if (reposUsed(pb) >= (S.cfg.plans[pb.plan]?.repos ?? 0)) throw 'Ya usó todas las reposiciones de su periodo.';
      }
      if (F.type==='repo' && F.studentId==='__new') throw 'Las reposiciones son para alumnos con plan. Registra primero su plan de Impulso.';
      $('#tf-save').disabled = true;
      const sid = await resolveStudent('tf', F.studentId);
      const id = newId('bookings'), now = new Date().toISOString();
      const status = F.type==='repo' ? 'conf' : F.status;
      const doc = { type:F.type, studentId:sid, date:F.date, hour:F.hour, status, createdAt:now, exception:F.exc, notes:'' };
      if (F.type==='repo'){ const pb = activePlan(sid, F.date); if (pb) doc.planBookingId = pb.id; }
      if (status==='conf' && F.type==='tutoria'){ doc.paidAt = now; doc.amount = Number($('#tf-amt').value)||0; }
      if (await dbSet('bookings', id, doc)){
        if (status==='conf' && F.type==='tutoria') await displaceRepoIfNeeded(F.date, F.hour, id);
        toast('Guardado'); openBooking(id, { ...doc, id });
      } else $('#tf-save').disabled = false;
    } catch(e){ err.textContent = typeof e==='string' ? e : 'No se pudo guardar.'; $('#tf-save').disabled = false; }
  };
}
async function displaceRepoIfNeeded(date, hour, newId_){
  const list = occ(date, hour).filter(b => b.id!==newId_);
  const cap = S.cfg.capTutoria;
  const total = list.length + 1;
  if (total <= cap) return;
  const repos = list.filter(b => b.type==='repo').sort((a,b) => (a.createdAt||'') < (b.createdAt||'') ? 1 : -1);
  for (const r of repos.slice(0, total-cap)){
    await dbUpdate('bookings', r.id, { status:'desplazada', displacedAt:new Date().toISOString(), displacedBy:newId_ });
    toast(`La reposición de ${stu(r.studentId).name} quedó desplazada. Revisa Alertas para reprogramarla.`);
  }
}

function openBooking(id, fallback){
  const render = () => {
    const b = S.bookings[id] || fallback; if (!b) return closeModal();
    const s = stu(b.studentId), ctx = ctxFor(b);
    const dl = deadline(b), now = Date.now();
    const rows = [];
    rows.push(['Alumno', `${esc(labelOf(s))} ${planChip(s.plan)}`]);
    rows.push(['Tutor', esc(s.tutor||'—') + (s.phone?` · ${esc(s.phone)}`:'')]);
    rows.push(['Tipo', typeChip(b)]);
    if (b.type==='impulso'){
      rows.push(['Horario', esc(fmtSlots(b.slots))]);
      rows.push(['Periodo', `${fmtD(b.start)} al ${fmtD(b.end)} · ${esc(planName(b.plan))} (${b.hours} h/sem)`]);
      const pb = b.status==='conf' ? `${reposUsed(b)} de ${S.cfg.plans[b.plan]?.repos ?? 0}` : '—';
      rows.push(['Reposiciones usadas', pb]);
    } else rows.push(['Fecha', `${fmtD(b.date)} · ${rangeLbl(b.hour)}`]);

        <div class="field"><label for="bk-amt">Monto (opcional)</label><input id="bk-amt" type="number" min="0" value="${price}"></div></div>
        ${ps && ps!==b.start ? `<div class="note">La prereserva preveía empezar el ${fmtD(b.start)}. Con el pago de hoy, la siguiente clase con lugar es el ${fmtD(ps)}; puedes cambiar la fecha si la familia prefiere otra.</div>` : ''}
        ${dl.getTime() < now ? `<div class="note warn">El pago llega después del límite de 48 h. Si lo confirmas quedará marcado como excepción.</div>` : ''}
        <button class="btn primary" id="bk-confirm" disabled>Confirmar pago</button></div>`;
    }
    const wa = [];
    if (b.status==='pre' && !isOverdue(b)) wa.push(waBtn(s.phone, fill(S.cfg.tpl[b.type==='tutoria'?'tutoria':'pago'], ctx), 'Recordar pago'));
    if (isOverdue(b)) wa.push(waBtn(s.phone, fill(S.cfg.tpl.vencida, ctx), 'Avisar vencimiento'));
    if (b.status==='conf' && b.type!=='repo') wa.push(waBtn(s.phone, fill(S.cfg.tpl.confirmacion, b.type==='impulso'?ctx:{...ctx, fin:fmtD(b.date)}), 'Enviar confirmación'));
    if (b.type==='impulso' && b.status==='conf' && !ren) wa.push(waBtn(s.phone, fill(S.cfg.tpl.renovacion, { ...ctx, limite: fmtDT(renewalDeadline(b)) }), 'Recordar renovación'));
    if (b.status==='desplazada') wa.push(waBtn(s.phone, fill(S.cfg.tpl.desplazada, ctx), 'Avisar reprogramación'));

    $('#m-body').innerHTML = `<dl class="kv">${rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      ${pay}
      ${wa.length?`<div><div class="lbl" style="margin-bottom:6px">Mensajes de WhatsApp</div><div class="row">${wa.join('')}</div><p class="small muted" style="margin:6px 0 0">Se abre WhatsApp con el mensaje escrito; tú decides si lo envías.</p></div>`:''}
      <div class="field"><label for="bk-notes">Notas</label><textarea id="bk-notes">${esc(b.notes||'')}</textarea></div>`;
    $('#m-foot').innerHTML = `
      ${b.status!=='cancel' ? `<button class="btn danger" id="bk-cancel">${b.status==='pre'?'Liberar prereserva':'Cancelar reserva'}</button>` : ''}
      ${b.type==='impulso' && b.status==='conf' && !ren ? `<button class="btn sun" data-act="renew" data-id="${b.id}">Renovar</button>` : ''}
      ${b.type==='repo' && b.status==='desplazada' ? `<button class="btn rose" data-act="newtut" data-stu="${b.studentId}" data-type="repo">Reprogramar</button>` : ''}

      <button class="btn ghost xdel" data-act="xdelbk" data-id="${b.id}">Eliminar</button>
      <button class="btn primary" id="bk-save-notes">Guardar notas</button>`;
    const pc = $('#bk-paid');
    if (pc){
      pc.onchange = () => $('#bk-confirm').disabled = !pc.checked;
      const bs = $('#bk-start');
      if (bs) bs.onchange = () => { const s2 = bs.value && firstClassDate(b.slots, bs.value, 0); $('#bk-period').textContent = s2 ? `Primera clase ${fmtD(s2)} · del ${fmtD(s2)} al ${fmtD(periodEnd(s2))}` : 'Elige una fecha válida'; };
      $('#bk-confirm').onclick = async () => {
        const late = deadline(b).getTime() < Date.now();
        const upd = { status:'conf', paidAt:new Date().toISOString(), amount:Number($('#bk-amt').value)||0 };
        if (late) upd.exception = true;
        if (b.type==='impulso'){
          const s2 = bs && bs.value ? firstClassDate(b.slots, bs.value, 0) : b.start;
          if (!s2){ toast('Elige una fecha de inicio válida.', true); return; }
          const e2 = periodEnd(s2);
          const full = b.slots.filter(k => minFreeIn(k, s2, e2, b.id).free <= 0);
          if (full.length && !b.exception){ toast(`No hay lugar en ${fmtSlots(full)} para el periodo del ${fmtD(s2)} al ${fmtD(e2)}. Elige otra fecha de inicio.`, true); return; }
          upd.start = s2; upd.end = e2;
        }
        if (await dbUpdate('bookings', b.id, upd)){
          if (b.type==='tutoria') await displaceRepoIfNeeded(b.date, b.hour, b.id);
          toast('Pago confirmado. Envía la confirmación por WhatsApp.');
        }
      };
    }
    const bc = $('#bk-cancel');
    if (bc) bc.onclick = () => askConfirm(`¿${b.status==='pre'?'Liberar la prereserva':'Cancelar la reserva'} de ${esc(labelOf(s))}? El lugar quedará disponible.`, b.status==='pre'?'Liberar':'Cancelar reserva', async () => {

        toast('Lugar liberado');
        if (b.type==='impulso'){ const c = b.slots.flatMap(k => candidatesFor(k)); if (c.length) toast(`Hay ${new Set(c.map(x=>x.id)).size} alumno(s) en espera para esos horarios. Revisa Alertas o Lista de espera.`); }
      }
    });
    $('#bk-save-notes').onclick = async () => { if (await dbUpdate('bookings', b.id, { notes: $('#bk-notes').value })) toast('Notas guardadas'); };
  };
  const b0 = S.bookings[id] || fallback;
  openModal(`${esc(labelOf(stu(b0.studentId)))}`, '', '<span></span>', { sub: b0.type==='impulso'?'Reserva Impulso':b0.type==='tutoria'?'Tutoría':'Reposición', refresh: render });
  render();
}

function viewAlerts(){
  const all = computeAlerts();
  const open = all.filter(a => !S.alertsDone[a.key]), done = all.filter(a => S.alertsDone[a.key] && a.sev!=='info');
  const sec = (title, list, hint) => `<div class="sec-h"><h2>${title}</h2><span class="count">${list.length}</span></div>${hint?`<p class="small muted" style="margin:-4px 0 10px">${hint}</p>`:''}
    ${list.length ? `<div class="stack">${list.map(alertCard).join('')}</div>` : `<div class="empty">Nada pendiente.</div>`}`;
  const crit = open.filter(a => a.sev==='crit');
  const pagos = open.filter(a => a.sev==='warn' && ['pagos','renov','repo'].includes(a.cat));
  const esp = open.filter(a => a.cat==='espera');
  const info = open.filter(a => a.sev==='info' && a.cat==='pagos');
  const cupo = open.filter(a => a.cat==='cupo');
  return `<div class="row" style="justify-content:space-between"><h2>Alertas</h2><button class="btn sm" data-act="view" data-v="reportes">Enviar resumen por correo</button></div>
    ${sec('Urgente', crit, 'Pagos que no llegaron a tiempo y lugares que deben liberarse u ofrecerse.')}
    ${sec('Pagos, renovaciones y reposiciones', pagos)}
    ${sec('Lugares para la lista de espera', esp, `Ordenados por prioridad: ${S.cfg.priority==='plan'?'plan Plus antes que Básico y luego antigüedad':'antigüedad primero y luego plan'}.`)}
    ${sec('Cupo de Impulso (próximas ' + S.cfg.lookWeeks + ' semanas)', cupo)}
    ${sec('Prereservas en tiempo', info)}
    ${done.length ? `<details style="margin-top:22px"><summary class="btn sm">Atendidas (${done.length})</summary><div class="stack" style="margin-top:10px">${done.map(alertCard).join('')}</div></details>` : ''}`;
}
function alertCard(a){
  const isDone = !!S.alertsDone[a.key];
  const b = a.bid ? S.bookings[a.bid] : null;
  const acts = [];
  if (b){
    const s = stu(b.studentId);
    if (a.wa) acts.push(waBtn(s.phone, fill(S.cfg.tpl[a.wa.tpl], ctxFor(b, a.wa.ctx)), 'WhatsApp'));
    if (a.acts.includes('abrir')) acts.push(`<button class="btn sm" data-act="booking" data-id="${b.id}">Abrir</button>`);
    if (a.acts.includes('pagar')) acts.push(`<button class="btn sm primary" data-act="booking" data-id="${b.id}">Registrar pago</button>`);
    if (a.acts.includes('liberar') && b.status!=='cancel') acts.push(`<button class="btn sm danger" data-act="release" data-id="${b.id}">Liberar lugar</button>`);
    if (a.acts.includes('renovar')) acts.push(`<button class="btn sm sun" data-act="renew" data-id="${b.id}">Crear renovación</button>`);
  }
  if (a.waRaw) acts.push(waBtn(a.phone, a.waRaw, 'Ofrecer por WhatsApp'));
  if (a.wid) acts.push(`<button class="btn sm" data-act="wait2pre" data-id="${a.wid}">Crear prereserva</button>`);
  if (a.slotD) acts.push(`<button class="btn sm" data-act="slot" data-d="${a.slotD}" data-h="${a.slotH}">Ver horario</button>`);
  if (a.sev!=='info') acts.push(`<button class="btn sm ghost" data-act="${isDone?'undone':'done'}" data-k="${esc(a.key)}">${isDone?'Reabrir':'Marcar atendida'}</button>`);
  let cands = '';
  if (a.keys && a.keys.length){
    const set = new Map(); a.keys.forEach(k => candidatesFor(k).forEach(c => set.set(c.id, c)));
    const list = [...set.values()].sort(prioCmp);
    cands = list.length ? `<div class="cands"><span class="lbl">Interesados en esos horarios</span>${list.slice(0,5).map((c,i) => candRow(c,i)).join('')}</div>` : `<span class="small muted">Nadie en lista de espera para esos horarios.</span>`;
  }
  return `<div class="alert ${a.sev} ${isDone?'done':''}"><span class="stripe"></span><div class="body"><b>${esc(a.title)}</b><span class="small">${esc(a.body)}</span>${cands}<div class="row">${acts.join('')}</div></div></div>`;
}
async function markAlert(key, done){
  const m = Object.assign({}, S.alertsDone);
  if (done) m[key] = new Date().toISOString(); else delete m[key];
  /* depurar marcas de más de 90 días */
  const cut = Date.now() - 90*864e5;
  for (const k of Object.keys(m)) if (new Date(m[k]).getTime() < cut) delete m[k];
  S.alertsDone = m; S.memo = {}; renderMain();
  await dbSet('config', 'alerts', { done: m });
}

const REPORTS = [
  ['resumen','Resumen general'], ['alertas','Alertas pendientes'], ['ocupacion','Ocupación de Impulso por horario'],
  ['pagos','Pagos verificados en el rango'], ['prereservas','Prereservas esperando pago'], ['vencimientos','Planes que terminan (próximos 14 días)'],

];
let repSel = new Set(['resumen','alertas','prereservas','vencimientos']);
let repFrom = null, repTo = null, repText = '';

function reportOutHtml(){

function bindReports(){
  $$('[data-rep]').forEach(c => c.onchange = () => { if (c.checked) repSel.add(c.dataset.rep); else repSel.delete(c.dataset.rep); });
  $('#rp-from').onchange = e => repFrom = e.target.value;
  $('#rp-to').onchange = e => repTo = e.target.value;
  $('#rp-gen').onclick = () => { repText = buildReport([...repSel], repFrom, repTo); $('#rp-out').innerHTML = reportOutHtml(); };
