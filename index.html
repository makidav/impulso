  </form></div>`;
  $('#gh-local').onclick = () => askConfirm('Sin GitHub los datos quedan solo en este navegador y se pierden si se borran los datos de navegación. ¿Continuar así?', 'Usar solo este navegador', () => { lsSet('ia-storage', 'local'); location.reload(); });
  $('#setup-form').onsubmit = async e => {
    e.preventDefault();
    const err = $('#gh-err'), btn = $('#gh-btn');
    const gc = { owner: $('#gh-owner').value.trim(), repo: $('#gh-repo').value.trim(), token: $('#gh-token').value.trim(), apiBase: pf.apiBase };
    if (!gc.owner || !gc.repo || !gc.token){ err.textContent = 'Llena usuario, repositorio y token.'; return; }
    btn.disabled = true; err.textContent = 'Revisando el repositorio…';
    try {
      const r = await ghFetch(gc, `/repos/${gc.owner}/${gc.repo}`);
      if (!r.ok) throw ghErrText(r.status);
      const j = await r.json();
      if (!j.private) throw `El repositorio ${gc.owner}/${gc.repo} es público: los datos de los alumnos quedarían a la vista de cualquiera. Hazlo privado (Settings → General → Danger Zone → Change visibility) o crea uno privado.`;
      if (j.permissions && j.permissions.push === false) throw 'El token puede leer pero no escribir. Dale el permiso “Contents: Read and write”.';
      gc.branch = j.default_branch || 'main';
      err.textContent = 'Revisando los datos…';
      const c = await ghFetch(gc, `/repos/${gc.owner}/${gc.repo}/contents/${GH_PATH}?ref=${encodeURIComponent(gc.branch)}`);
      if (c.status===404){
        let seed = {}; try { seed = JSON.parse(localStorage.getItem('ia-agenda-db-v1')) || {}; } catch(x){}
        const file = { version:1, updatedAt:new Date().toISOString() }; COLS.forEach(k => file[k] = seed[k] || {});
        const p = await ghFetch(gc, `/repos/${gc.owner}/${gc.repo}/contents/${GH_PATH}`, { method:'PUT', body: JSON.stringify({ message: hasLocal ? 'Agenda: datos iniciales (copiados de este navegador)' : 'Agenda: archivo de datos inicial', content: b64enc(JSON.stringify(file, null, 1)), branch: gc.branch }) });
        if (!p.ok) throw ghErrText(p.status);
      } else if (!c.ok) throw ghErrText(c.status);
      err.textContent = 'Instalando el respaldo por correo…';
      let inst = []; try { inst = await ghInstallBackup(gc); } catch(x){}
      lsSet(GH_CFG_KEY, gc); lsSet('ia-storage', 'github');
      const bad = inst.filter(x => /^error/.test(x[1]));
      if (bad.length) lsSet('ia-gh-install-warning', 'No se pudo instalar el respaldo por correo (falta el permiso “Workflows: Read and write” en el token). Puedes instalarlo después desde Ajustes.');
      location.reload();
    } catch(x){ err.textContent = typeof x==='string' ? x : 'No hay conexión con GitHub. Revisa el internet e inténtalo de nuevo.'; btn.disabled = false; }
  };
}

/* ---------- Indicador de guardado ---------- */
function syncLabel(st){
  const when = st.syncedAt ? hm(new Date(st.syncedAt)) : '';
  if (st.state==='ok') return ['ok', `Guardado en GitHub${when?' · '+when:''}`];
  if (st.state==='saving') return ['saving', 'Guardando…'];
  if (st.state==='pending') return ['saving', `${st.pending} cambio${st.pending>1?'s':''} por subir…`];
  if (st.state==='offline') return ['warn', `Sin conexión · ${st.pending} pendiente${st.pending===1?'':'s'} a salvo`];
  return ['bad', 'Error al guardar: ver Ajustes'];
}
function renderSync(){
  const el = $('#sync'); if (!el || !S.db || !S.db.gh) return;
  const [cls, txt] = syncLabel(S.db.status);
  el.className = 'sync ' + cls; el.textContent = txt; el.title = S.db.status.msg || 'Pulsa para sincronizar ahora';
}

function cellHtml(d, h){
  const w = dowOf(d), t = slotType(w, h), T = todayS();
  if (!t) return `<div class="cell none">—</div>`;
  const list = occ(d, h), cap = capOf(t), n = list.length, free = cap - n;
  const pre = list.filter(b => b.status==='pre').length;
  const lvl = free <= 0 ? 'lvl-full' : free <= S.cfg.lowThreshold ? 'lvl-low' : '';
  const name = t==='imp' ? 'Impulso' : t==='tut' ? 'Tutoría' : 'Tutoría o reposición';
  const sub = free <= 0 ? (n>cap?`Sobrecupo +${n-cap}`:'Lleno') : `${free} libre${free>1?'s':''}`;
  return `<button class="cell ${t} ${lvl} ${d<T?'past':''}" data-act="slot" data-d="${d}" data-h="${h}" aria-label="${name} ${fmtD(d)} ${hourLbl(h)}: ${n} de ${cap}">
    <span class="sub">${name}</span><span class="cnt">${n}/${cap}</span><span class="sub">${sub}${pre?` · ${pre} pre`:''}</span>
    <span class="bar" style="width:${Math.min(100, n/cap*100)}%"></span></button>`;
}
function calWeek(){
  const m = mondayOf(S.cal.date), days = [0,1,2,3,4,5].map(i => addDays(m,i)), T = todayS();
  let rows = '';
  for (const h of HOURS){
    if (h===15){ rows += `<tr><th class="hr">${rangeLbl(15)}</th><td colspan="6"><div class="receso">RECESO</div></td></tr>`; continue; }
    rows += `<tr><th class="hr">${rangeLbl(h)}</th>${days.map(d => `<td>${cellHtml(d,h)}</td>`).join('')}</tr>`;
  }
  return `<div class="calcard"><div class="scroll-x"><table class="wk"><thead><tr><th class="hr"></th>${days.map(d => `<th class="${d===T?'today':''}">${DOWS[dowOf(d)]}<b>${pd(d).getDate()}</b></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function daySummary(d){
  const w = dowOf(d); let impT=0, impF=0, impMin=Infinity, tutT=0, tutF=0, tutMin=Infinity;
  for (const h of HOURS){
    const t = slotType(w,h); if (!t) continue;
    const f = capOf(t) - occ(d,h).length;
    if (t==='imp'){ impT += capOf(t); impF += Math.max(0,f); impMin = Math.min(impMin,f); }
    else { tutT += capOf(t); tutF += Math.max(0,f); tutMin = Math.min(tutMin,f); }
  }
  return { impT, impF, impMin, tutT, tutF, tutMin };
}
function calMonth(){
  const d0 = pd(S.cal.date), first = ds(new Date(d0.getFullYear(), d0.getMonth(), 1)), last = ds(new Date(d0.getFullYear(), d0.getMonth()+1, 0));
  let d = mondayOf(first); const T = todayS(); let cells = '';
  while (d <= last || dowOf(d)!==1){
    if (d > last && dowOf(d)===1) break;
    if (dowOf(d)!==0){
      const s = daySummary(d), out = d.slice(0,7)!==first.slice(0,7);
      const cls = v => v<=0 ? 'full' : v<=S.cfg.lowThreshold ? 'low' : '';
      cells += `<button class="mday ${out?'out':''} ${d===T?'today':''}" data-act="gotoday" data-d="${d}" aria-label="${fmtD(d)}">
        <span class="n">${pd(d).getDate()}</span>
        ${s.impT?`<span class="mline imp ${cls(s.impMin)}" title="Lugares libres de Impulso"><span>Impulso</span><span>${s.impF} libres</span></span>`:''}
        ${s.tutT?`<span class="mline tut ${cls(s.tutMin)}" title="Lugares libres de tutoría"><span>${dowOf(d)===5?'Tut/Rep':'Tutoría'}</span><span>${s.tutF}/${s.tutT}</span></span>`:''}
      </button>`;
    }
    d = addDays(d,1);
  }
  return `<div class="calcard"><div class="mgrid">${['lun','mar','mié','jue','vie','sáb'].map(x=>`<div class="mhead">${x}</div>`).join('')}${cells}</div>
    <p class="small muted" style="margin:10px 0 0">Cada día muestra los lugares libres sumando todos sus horarios. Borde naranja: algún horario con ≤ ${S.cfg.lowThreshold} lugares. Rojo: algún horario lleno.</p></div>`;
}
function calDay(){
  const d = S.cal.date, w = dowOf(d);
  const hours = HOURS.filter(h => slotType(w,h));
  if (!hours.length) return `<div class="empty">${DOWL[w]}: no hay clases ese día.</div>`;

    const t = slotType(w,h), list = occ(d,h), cap = capOf(t);

}
function personChip(b){
  const s = stu(b.studentId);

function studentOptions(sel, filterPlan){
  const list = Object.values(S.students).filter(s => s.active!==false).sort((a,b) => a.name.localeCompare(b.name,'es'));
  return `<option value="">Elegir alumno…</option><option value="__new">+ Registrar alumno nuevo</option>` +
    list.map(s => `<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(labelOf(s))} · ${esc(planName(s.plan))}</option>`).join('');
}
function newStudentFields(prefix){
  return `<div class="grid2" id="${prefix}-new" hidden>
    <div class="field"><label for="${prefix}-nname">Nombre del alumno</label><input id="${prefix}-nname" type="text" autocomplete="off"></div>
    <div class="field"><label for="${prefix}-ntutor">Padre, madre o tutor</label><input id="${prefix}-ntutor" type="text" autocomplete="off"></div>
    <div class="field"><label for="${prefix}-nphone">WhatsApp (10 dígitos)</label><input id="${prefix}-nphone" type="tel" inputmode="numeric" autocomplete="off"></div>
    <div class="field"><label for="${prefix}-nplan">Plan</label><select id="${prefix}-nplan">${Object.keys(S.cfg.plans).map(p=>`<option value="${p}">${esc(planName(p))} (${S.cfg.plans[p].hours} h/sem)</option>`).join('')}<option value="ninguno">Sin plan (solo tutorías)</option></select></div>
  </div>`;
}
async function resolveStudent(prefix, selId){
  if (selId !== '__new') return selId;
  const name = $(`#${prefix}-nname`).value.trim(), tutor = $(`#${prefix}-ntutor`).value.trim();
  const phone = $(`#${prefix}-nphone`).value.replace(/\D/g,''), plan = $(`#${prefix}-nplan`).value;
  if (!name) throw 'Escribe el nombre del alumno.';
  if (phone.length < 10) throw 'El WhatsApp debe tener 10 dígitos.';
  const id = newId('students');
  const ok = await dbSet('students', id, { name, tutor, phone, plan, since: todayS(), prefs: [], notes:'', active:true, createdAt:new Date().toISOString() });
  if (!ok) throw 'No se pudo registrar al alumno.';
  S.students[id] = { id, name, tutor, phone, plan, since: todayS(), prefs: [] };
  return id;
}
function openImpForm(pre={}){
  const F = {
    studentId: pre.studentId || '', plan: pre.plan || '', from: pre.start && pre.start > todayS() ? pre.start : addDays(todayS(), 2),
    slots: new Set(pre.slots || (pre.key ? [pre.key] : [])), status:'pre', exc:false, renewalOf: pre.renewalOf || null
  };
  /* El mes empieza en la primera clase de sus horarios a partir de 'from' (con pago ya verificado: la siguiente clase después de ahora) */
  const startOf = () => (F.slots.size && firstClassDate([...F.slots], F.from, F.status==='conf' ? Date.now() : 0)) || F.from;
  if (F.studentId && !F.plan){ const s = stu(F.studentId); F.plan = S.cfg.plans[s.plan] ? s.plan : 'basico'; }
  if (!F.plan) F.plan = 'basico';
  const plans = Object.keys(S.cfg.plans);
  openModal(F.renewalOf ? 'Renovación de plan Impulso' : 'Nueva reserva · Impulso Académico', `
    <div class="grid2">
      <div class="field"><label for="if-stu">Alumno</label><select id="if-stu">${studentOptions(F.studentId)}</select></div>
      <div class="field"><label for="if-plan">Plan</label><select id="if-plan">${plans.map(p=>`<option value="${p}" ${p===F.plan?'selected':''}>${esc(planName(p))} · ${S.cfg.plans[p].hours} h a la semana</option>`).join('')}</select></div>
      <div class="field"><label for="if-start" id="if-start-l">Puede empezar a partir de</label><input id="if-start" type="date" value="${F.from}"></div>
    </div>
    ${newStudentFields('if')}
    <div id="if-dyn"></div>
    <fieldset class="panel stack" style="gap:8px"><legend class="lbl">Estado</legend>
      <label class="row"><input type="radio" name="if-st" value="pre" checked> Prereserva (aparta el lugar hasta el límite de pago)</label>
      <label class="row"><input type="radio" name="if-st" value="conf"> Pago ya verificado</label>
      <div class="field" id="if-amt-w" hidden><label for="if-amt">Monto recibido (opcional)</label><input id="if-amt" type="number" min="0" step="1" value="${S.cfg.plans[F.plan].price||''}"></div>
    </fieldset>
    <label class="row small"><input type="checkbox" id="if-exc"> Registrar como excepción (permite sobrecupo o pago con menos de 48 h; queda anotado)</label>
    <div class="err" id="if-err" role="alert"></div>`,
    `<button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="if-save">Guardar</button>`, { wide:true, sub:'El mes empieza en la primera clase después del pago: si esa clase es el 15, termina el 14 del mes siguiente.' });
  const dyn = () => {
    const start = startOf(), end = periodEnd(start), hours = S.cfg.plans[F.plan].hours;
    const keys = [...F.slots].sort(keySort), pat = checkPattern(keys, hours);
    const hrs = [9,10,13,14,16,17];
    let rows = hrs.map(h => `<tr><td class="h">${rangeLbl(h)}</td>${IMP_DOWS.map(w => {
      const k = w+'-'+h;
      if (SLOT[k]!=='imp') return `<td><span class="pk na">—</span></td>`;
      const { free } = minFreeIn(k, start, end);
      const on = F.slots.has(k);
      const cls = free<=0 ? 'full' : free<=S.cfg.lowThreshold ? 'low' : '';
      return `<td><label class="pk ${on?'on':''} ${cls}"><input type="checkbox" data-slot="${k}" ${on?'checked':''}><span>${free<=0?'Lleno':free+' libres'}</span></label></td>`;
    }).join('')}</tr>`).join('');
    const fc = keys.length ? firstClass({ type:'impulso', slots:keys, start }) : null;
    const dl = fc ? new Date(fc.getTime()-H48) : null;
    const late = F.status==='pre' && dl && dl.getTime() < Date.now();
    const fulls = keys.filter(k => minFreeIn(k, start, end).free <= 0);
    $('#if-dyn').innerHTML = `
      <div class="note">${fc ? `Primera clase e inicio del mes: <b>${fmtDT(fc)}</b> · Termina: <b>${fmtD(end)}</b>${F.status==='pre'?` · Pago límite: <b>${fmtDT(dl)}</b>`:''}` : 'Elige los horarios para calcular la primera clase y el fin del mes.'}
      ${F.status==='pre' && fc ? '<div class="small muted" style="margin-top:4px">Fecha prevista. Al confirmar el pago, el mes se recalcula desde la siguiente clase después del pago.</div>' : ''}</div>
      <div><div class="lbl" style="margin-bottom:6px">Horarios (los números son los lugares libres en todo el periodo)</div>
      <div class="scroll-x"><table class="pick"><thead><tr><th></th>${IMP_DOWS.map(w=>`<th>${DOWS[w]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>
      <div class="note ${pat.ok?'ok':'warn'}">${pat.ok?'Combinación válida: ':''}${esc(pat.msg)}</div>
      ${fulls.length?`<div class="note bad">Sin lugar en ${esc(fmtSlots(fulls))} durante el periodo. ${fulls.map(k=>{const nf=nextFree(k,start);return nf?`${fmtSlots([k])}: libre desde ${fmtD(nf.date)}.`:'';}).join(' ')}</div>`:''}
      ${late?`<div class="note bad">La primera clase es en menos de 48 h, así que el pago ya no llegaría a tiempo para apartar. Cambia la fecha, regístralo con pago verificado o márcalo como excepción.</div>`:''}`;
  };
  dyn();
  const syncStu = () => {
    const v = $('#if-stu').value; F.studentId = v;
    $('#if-new').hidden = v !== '__new';
    if (v && v!=='__new'){ const s = stu(v); if (S.cfg.plans[s.plan]){ F.plan = s.plan; $('#if-plan').value = s.plan; }
      if (!F.slots.size && (s.prefs||[]).length) (s.prefs||[]).filter(k=>SLOT[k]==='imp').forEach(k=>F.slots.add(k)); }
    dyn();
  };
  $('#if-stu').onchange = syncStu;
  if (F.studentId === '__new') syncStu();
  $('#if-plan').onchange = e => { F.plan = e.target.value; $('#if-amt').value = S.cfg.plans[F.plan].price || ''; dyn(); };
  $('#if-start').onchange = e => { if (e.target.value){ F.from = e.target.value; dyn(); } };
  $('#if-dyn').addEventListener('change', e => { const k = e.target.dataset.slot; if (!k) return; if (e.target.checked) F.slots.add(k); else F.slots.delete(k); dyn(); });
  $$('input[name=if-st]').forEach(r => r.onchange = () => {
    F.status = $('input[name=if-st]:checked').value; $('#if-amt-w').hidden = F.status!=='conf';
    if (F.status==='conf' && !F.renewalOf){ F.from = todayS(); $('#if-start').value = F.from; }
    $('#if-start-l').textContent = F.status==='conf' ? 'Fecha del pago' : 'Puede empezar a partir de';
    dyn();
  });
  $('#if-exc').onchange = e => F.exc = e.target.checked;
  $('#if-save').onclick = async () => {
    const err = $('#if-err'); err.textContent = '';
    try {
      if (!F.studentId) throw 'Elige un alumno o registra uno nuevo.';
      if (!F.slots.size) throw 'Elige los horarios.';
      const keys = [...F.slots].sort(keySort), hours = S.cfg.plans[F.plan].hours, start = startOf(), end = periodEnd(start);
      const pat = checkPattern(keys, hours);
      if (!pat.ok && !F.exc) throw pat.msg;
      const full = keys.filter(k => minFreeIn(k, start, end).free <= 0);
      if (full.length && !F.exc) throw `Sin lugar en ${fmtSlots(full)}. Elige otro horario, agrega al alumno a la lista de espera o márcalo como excepción.`;
      const dl = deadline({ type:'impulso', slots:keys, start });
      if (F.status==='pre' && dl.getTime() < Date.now() && !F.exc) throw 'La primera clase es en menos de 48 h: el pago ya no llegaría a tiempo. Cambia la fecha, regístralo con pago verificado o márcalo como excepción.';
      if (F.studentId !== '__new'){
        const overlap = S.bk.find(b => b.type==='impulso' && isActive(b) && b.studentId===F.studentId && b.start<=end && start<=b.end && b.id!==F.renewalOf);
        if (overlap && !F.exc) throw `Este alumno ya tiene un plan del ${fmtD(overlap.start)} al ${fmtD(overlap.end)} que se cruza con este periodo.`;
      }
      $('#if-save').disabled = true;
      const sid = await resolveStudent('if', F.studentId);
      const id = newId('bookings'), now = new Date().toISOString();
      const doc = { type:'impulso', studentId:sid, plan:F.plan, hours, slots:keys, start, end, status:F.status, createdAt:now, exception:F.exc, notes:'' };
      if (F.renewalOf) doc.renewalOf = F.renewalOf;
      if (F.status==='conf'){ doc.paidAt = now; doc.amount = Number($('#if-amt').value)||0; }
      if (await dbSet('bookings', id, doc)){
        toast(F.status==='pre' ? 'Prereserva guardada' : 'Reserva pagada guardada');
        S.waitlist && Object.values(S.waitlist).filter(w => w.studentId===sid && w.status==='activa').forEach(w => dbUpdate('waitlist', w.id, { status:'atendida', closedAt:now }));
        openBooking(id, { ...doc, id });
      } else $('#if-save').disabled = false;
    } catch(e){ err.textContent = typeof e==='string' ? e : 'No se pudo guardar.'; $('#if-save').disabled = false; }
  };
}

      <div class="field"><label for="tf-type">Tipo</label><select id="tf-type"><option value="tutoria">Tutoría (pagada, 1 hora)</option><option value="repo">Reposición de clase (incluida en el plan)</option></select></div>
      <div class="field"><label for="tf-date">Fecha</label><input id="tf-date" type="date" value="${F.date}"></div>
      <div class="field"><label for="tf-hour">Hora</label><select id="tf-hour"></select></div>
    </div>
    ${newStudentFields('tf')}
    <div id="tf-dyn"></div>
    <fieldset class="panel stack" style="gap:8px" id="tf-stbox"><legend class="lbl">Estado</legend>
      <label class="row"><input type="radio" name="tf-st" value="pre" checked> Prereserva (pendiente de pago)</label>
      <label class="row"><input type="radio" name="tf-st" value="conf"> Pago ya verificado</label>
      <div class="field" id="tf-amt-w" hidden><label for="tf-amt">Monto recibido (opcional)</label><input id="tf-amt" type="number" min="0" value="${S.cfg.tutoriaPrice||''}"></div>
    </fieldset>
    <label class="row small"><input type="checkbox" id="tf-exc"> Registrar como excepción (permite sobrecupo o menos de 48 h)</label>
    <div class="err" id="tf-err" role="alert"></div>`,
    `<button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="tf-save">Guardar</button>`, { sub:'Máximo 2 alumnos por hora, cada uno con su maestra.' });
  $('#tf-type').value = F.type;
  const hoursFor = () => HOURS.filter(h => { const t = slotType(dowOf(F.date), h); return F.type==='repo' ? t==='mix' : (t==='tut'||t==='mix'); });
  const dyn = () => {
    const hs = hoursFor();
    if (!hs.includes(F.hour)) F.hour = hs[0] ?? null;
    $('#tf-hour').innerHTML = hs.length ? hs.map(h => { const n = occ(F.date,h).length, cap = S.cfg.capTutoria; return `<option value="${h}" ${h===F.hour?'selected':''}>${rangeLbl(h)} · ${n>=cap?'lleno':(cap-n)+' libre'+(cap-n>1?'s':'')}</option>`; }).join('') : `<option value="">Sin horarios ese día</option>`;
    $('#tf-stbox').hidden = F.type==='repo';
    let html = '';
    if (F.hour==null){ html = `<div class="note warn">${F.type==='repo'?'Las reposiciones son solo los viernes (1–3 pm y 4–6 pm).':'Ese día no hay horario de tutoría.'}</div>`; }
    else {
      const list = occ(F.date, F.hour), cap = S.cfg.capTutoria, dt = pd(F.date); dt.setHours(F.hour);
      const dl = new Date(dt.getTime()-H48);
      html += `<div class="note">Ocupados: <b>${list.length} de ${cap}</b>${list.length?` (${list.map(b=>esc(labelOf(stu(b.studentId)))+(b.type==='repo'?' · reposición':'')).join(', ')})`:''}. ${F.type==='tutoria'?`Pago límite: <b>${fmtDT(dl)}</b>.`:`Queda firme el <b>${fmtDT(dl)}</b>.`}</div>`;
      if (F.type==='tutoria' && dl.getTime() < Date.now()) html += `<div class="note bad">Faltan menos de 48 h: por regla ya no se puede agendar en este horario.</div>`;
      if (list.length >= cap){
        const repos = list.filter(b => b.type==='repo');
        if (F.type==='tutoria' && repos.length) html += `<div class="note warn">Horario lleno, pero hay reposición(es). La tutoría tiene prioridad: al confirmar su pago, la reposición más reciente quedará desplazada y te avisaré para reprogramarla.</div>`;
        else html += `<div class="note bad">Horario lleno.</div>`;
      }
      if (F.type==='repo' && F.studentId && F.studentId!=='__new'){
        const pb = activePlan(F.studentId, F.date);
        if (!pb) html += `<div class="note bad">El alumno no tiene un plan pagado vigente en esa fecha.</div>`;
        else { const used = reposUsed(pb), lim = S.cfg.plans[pb.plan]?.repos ?? 0;
          html += `<div class="note ${used>=lim?'bad':'ok'}">Reposiciones usadas en su periodo (${fmtD(pb.start)}–${fmtD(pb.end)}): <b>${used} de ${lim}</b> (${esc(planName(pb.plan))}).</div>`; }
      }
    }
    $('#tf-dyn').innerHTML = html;
  };
  dyn();
  $('#tf-stu').onchange = e => { F.studentId = e.target.value; $('#tf-new').hidden = F.studentId!=='__new'; dyn(); };
  $('#tf-type').onchange = e => { F.type = e.target.value; dyn(); };
  $('#tf-date').onchange = e => { if (e.target.value){ F.date = e.target.value; dyn(); } };
  $('#tf-hour').onchange = e => { F.hour = +e.target.value; dyn(); };
  $$('input[name=tf-st]').forEach(r => r.onchange = () => { F.status = $('input[name=tf-st]:checked').value; $('#tf-amt-w').hidden = F.status!=='conf'; });
  $('#tf-exc').onchange = e => F.exc = e.target.checked;
  $('#tf-save').onclick = async () => {
    const err = $('#tf-err'); err.textContent = '';
    try {
      if (!F.studentId) throw 'Elige un alumno o registra uno nuevo.';
      if (F.hour==null) throw 'Elige una fecha y hora válidas.';
      const list = occ(F.date, F.hour), cap = S.cfg.capTutoria;
      const dt = pd(F.date); dt.setHours(F.hour);
      if (dt.getTime() - H48 < Date.now() && F.type==='tutoria' && !F.exc) throw 'Faltan menos de 48 h para esa tutoría. Elige otro horario o márcala como excepción.';
      if (dt.getTime() < Date.now() && !F.exc) throw 'Esa fecha ya pasó.';
      if (list.length >= cap && !F.exc){
        if (!(F.type==='tutoria' && list.some(b => b.type==='repo'))) throw 'Horario lleno. Elige otra hora o márcalo como excepción.';
      }
      if (list.some(b => b.studentId===F.studentId)) throw 'Este alumno ya está en ese horario.';
      if (F.type==='repo' && F.studentId!=='__new' && !F.exc){
        const pb = activePlan(F.studentId, F.date);
        if (!pb) throw 'El alumno no tiene un plan pagado vigente en esa fecha.';
        if (reposUsed(pb) >= (S.cfg.plans[pb.plan]?.repos ?? 0)) throw 'Ya usó todas las reposiciones de su periodo.';
      }
      if (F.type==='repo' && F.studentId==='__new') throw 'Las reposiciones son para alumnos con plan. Registra primero su plan de Impulso.';
      $('#tf-save').disabled = true;
      const sid = await resolveStudent('tf', F.studentId);
      const id = newId('bookings'), now = new Date().toISOString();
      const status = F.type==='repo' ? 'conf' : F.status;
      const doc = { type:F.type, studentId:sid, date:F.date, hour:F.hour, status, createdAt:now, exception:F.exc, notes:'' };
      if (F.type==='repo'){ const pb = activePlan(sid, F.date); if (pb) doc.planBookingId = pb.id; }
      if (status==='conf' && F.type==='tutoria'){ doc.paidAt = now; doc.amount = Number($('#tf-amt').value)||0; }
      if (await dbSet('bookings', id, doc)){
        if (status==='conf' && F.type==='tutoria') await displaceRepoIfNeeded(F.date, F.hour, id);
        toast('Guardado'); openBooking(id, { ...doc, id });
      } else $('#tf-save').disabled = false;
    } catch(e){ err.textContent = typeof e==='string' ? e : 'No se pudo guardar.'; $('#tf-save').disabled = false; }
  };
}
async function displaceRepoIfNeeded(date, hour, newId_){
  const list = occ(date, hour).filter(b => b.id!==newId_);
  const cap = S.cfg.capTutoria;
  const total = list.length + 1;
  if (total <= cap) return;
  const repos = list.filter(b => b.type==='repo').sort((a,b) => (a.createdAt||'') < (b.createdAt||'') ? 1 : -1);
  for (const r of repos.slice(0, total-cap)){
    await dbUpdate('bookings', r.id, { status:'desplazada', displacedAt:new Date().toISOString(), displacedBy:newId_ });
    toast(`La reposición de ${stu(r.studentId).name} quedó desplazada. Revisa Alertas para reprogramarla.`);
  }
}

function openBooking(id, fallback){
  const render = () => {
    const b = S.bookings[id] || fallback; if (!b) return closeModal();
    const s = stu(b.studentId), ctx = ctxFor(b);
    const dl = deadline(b), now = Date.now();
    const rows = [];
    rows.push(['Alumno', `${esc(labelOf(s))} ${planChip(s.plan)}`]);
    rows.push(['Tutor', esc(s.tutor||'—') + (s.phone?` · ${esc(s.phone)}`:'')]);
    rows.push(['Tipo', typeChip(b)]);
    if (b.type==='impulso'){
      rows.push(['Horario', esc(fmtSlots(b.slots))]);
      rows.push(['Periodo', `${fmtD(b.start)} al ${fmtD(b.end)} · ${esc(planName(b.plan))} (${b.hours} h/sem)`]);
      const pb = b.status==='conf' ? `${reposUsed(b)} de ${S.cfg.plans[b.plan]?.repos ?? 0}` : '—';
      rows.push(['Reposiciones usadas', pb]);
    } else rows.push(['Fecha', `${fmtD(b.date)} · ${rangeLbl(b.hour)}`]);
    rows.push(['Estado', statusChip(b) + (b.exception?' <span class="chip tent">Excepción</span>':'')]);

      const ps = b.type==='impulso' ? startAfterPayment(b) : null;
      pay = `<div class="panel stack" style="gap:10px"><label class="row" style="font-weight:800"><input type="checkbox" id="bk-paid"> Pago verificado (ya está en la cuenta)</label>
        <div class="grid2">

        <div class="field"><label for="bk-amt">Monto (opcional)</label><input id="bk-amt" type="number" min="0" value="${price}"></div></div>
        ${ps && ps!==b.start ? `<div class="note">La prereserva preveía empezar el ${fmtD(b.start)}. Con el pago de hoy, la siguiente clase con lugar es el ${fmtD(ps)}; puedes cambiar la fecha si la familia prefiere otra.</div>` : ''}
        ${dl.getTime() < now ? `<div class="note warn">El pago llega después del límite de 48 h. Si lo confirmas quedará marcado como excepción.</div>` : ''}
        <button class="btn primary" id="bk-confirm" disabled>Confirmar pago</button></div>`;
    }
    const wa = [];
    if (b.status==='pre' && !isOverdue(b)) wa.push(waBtn(s.phone, fill(S.cfg.tpl[b.type==='tutoria'?'tutoria':'pago'], ctx), 'Recordar pago'));
    if (isOverdue(b)) wa.push(waBtn(s.phone, fill(S.cfg.tpl.vencida, ctx), 'Avisar vencimiento'));
    if (b.status==='conf' && b.type!=='repo') wa.push(waBtn(s.phone, fill(S.cfg.tpl.confirmacion, b.type==='impulso'?ctx:{...ctx, fin:fmtD(b.date)}), 'Enviar confirmación'));
    if (b.type==='impulso' && b.status==='conf' && !ren) wa.push(waBtn(s.phone, fill(S.cfg.tpl.renovacion, { ...ctx, limite: fmtDT(renewalDeadline(b)) }), 'Recordar renovación'));
    if (b.status==='desplazada') wa.push(waBtn(s.phone, fill(S.cfg.tpl.desplazada, ctx), 'Avisar reprogramación'));

    $('#m-body').innerHTML = `<dl class="kv">${rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      ${pay}
      ${wa.length?`<div><div class="lbl" style="margin-bottom:6px">Mensajes de WhatsApp</div><div class="row">${wa.join('')}</div><p class="small muted" style="margin:6px 0 0">Se abre WhatsApp con el mensaje escrito; tú decides si lo envías.</p></div>`:''}
      <div class="field"><label for="bk-notes">Notas</label><textarea id="bk-notes">${esc(b.notes||'')}</textarea></div>`;
    $('#m-foot').innerHTML = `
      ${b.status!=='cancel' ? `<button class="btn danger" id="bk-cancel">${b.status==='pre'?'Liberar prereserva':'Cancelar reserva'}</button>` : ''}
      ${b.type==='impulso' && b.status==='conf' && !ren ? `<button class="btn sun" data-act="renew" data-id="${b.id}">Renovar</button>` : ''}
      ${b.type==='repo' && b.status==='desplazada' ? `<button class="btn rose" data-act="newtut" data-stu="${b.studentId}" data-type="repo">Reprogramar</button>` : ''}

      <button class="btn primary" id="bk-save-notes">Guardar notas</button>`;
    const pc = $('#bk-paid');
    if (pc){
      pc.onchange = () => $('#bk-confirm').disabled = !pc.checked;
      const bs = $('#bk-start');
      if (bs) bs.onchange = () => { const s2 = bs.value && firstClassDate(b.slots, bs.value, 0); $('#bk-period').textContent = s2 ? `Primera clase ${fmtD(s2)} · del ${fmtD(s2)} al ${fmtD(periodEnd(s2))}` : 'Elige una fecha válida'; };
      $('#bk-confirm').onclick = async () => {
        const late = deadline(b).getTime() < Date.now();
        const upd = { status:'conf', paidAt:new Date().toISOString(), amount:Number($('#bk-amt').value)||0 };
        if (late) upd.exception = true;
        if (b.type==='impulso'){
          const s2 = bs && bs.value ? firstClassDate(b.slots, bs.value, 0) : b.start;
          if (!s2){ toast('Elige una fecha de inicio válida.', true); return; }
          const e2 = periodEnd(s2);
          const full = b.slots.filter(k => minFreeIn(k, s2, e2, b.id).free <= 0);
          if (full.length && !b.exception){ toast(`No hay lugar en ${fmtSlots(full)} para el periodo del ${fmtD(s2)} al ${fmtD(e2)}. Elige otra fecha de inicio.`, true); return; }
          upd.start = s2; upd.end = e2;
        }
        if (await dbUpdate('bookings', b.id, upd)){
          if (b.type==='tutoria') await displaceRepoIfNeeded(b.date, b.hour, b.id);
          toast('Pago confirmado. Envía la confirmación por WhatsApp.');
        }
      };
    }
    const bc = $('#bk-cancel');
    if (bc) bc.onclick = () => askConfirm(`¿${b.status==='pre'?'Liberar la prereserva':'Cancelar la reserva'} de ${esc(labelOf(s))}? El lugar quedará disponible.`, b.status==='pre'?'Liberar':'Cancelar reserva', async () => {

        toast('Lugar liberado');
        if (b.type==='impulso'){ const c = b.slots.flatMap(k => candidatesFor(k)); if (c.length) toast(`Hay ${new Set(c.map(x=>x.id)).size} alumno(s) en espera para esos horarios. Revisa Alertas o Lista de espera.`); }
      }
    });
    $('#bk-save-notes').onclick = async () => { if (await dbUpdate('bookings', b.id, { notes: $('#bk-notes').value })) toast('Notas guardadas'); };
  };
  const b0 = S.bookings[id] || fallback;
  openModal(`${esc(labelOf(stu(b0.studentId)))}`, '', '<span></span>', { sub: b0.type==='impulso'?'Reserva Impulso':b0.type==='tutoria'?'Tutoría':'Reposición', refresh: render });
  render();
}

function viewAlerts(){
  const all = computeAlerts();
  const open = all.filter(a => !S.alertsDone[a.key]), done = all.filter(a => S.alertsDone[a.key] && a.sev!=='info');
  const sec = (title, list, hint) => `<div class="sec-h"><h2>${title}</h2><span class="count">${list.length}</span></div>${hint?`<p class="small muted" style="margin:-4px 0 10px">${hint}</p>`:''}
    ${list.length ? `<div class="stack">${list.map(alertCard).join('')}</div>` : `<div class="empty">Nada pendiente.</div>`}`;
  const crit = open.filter(a => a.sev==='crit');
  const pagos = open.filter(a => a.sev==='warn' && ['pagos','renov','repo'].includes(a.cat));
  const esp = open.filter(a => a.cat==='espera');
  const info = open.filter(a => a.sev==='info' && a.cat==='pagos');
  const cupo = open.filter(a => a.cat==='cupo');
  return `<div class="row" style="justify-content:space-between"><h2>Alertas</h2><button class="btn sm" data-act="view" data-v="reportes">Enviar resumen por correo</button></div>
    ${sec('Urgente', crit, 'Pagos que no llegaron a tiempo y lugares que deben liberarse u ofrecerse.')}
    ${sec('Pagos, renovaciones y reposiciones', pagos)}
    ${sec('Lugares para la lista de espera', esp, `Ordenados por prioridad: ${S.cfg.priority==='plan'?'plan Plus antes que Básico y luego antigüedad':'antigüedad primero y luego plan'}.`)}
    ${sec('Cupo de Impulso (próximas ' + S.cfg.lookWeeks + ' semanas)', cupo)}
    ${sec('Prereservas en tiempo', info)}
    ${done.length ? `<details style="margin-top:22px"><summary class="btn sm">Atendidas (${done.length})</summary><div class="stack" style="margin-top:10px">${done.map(alertCard).join('')}</div></details>` : ''}`;
}
function alertCard(a){
  const isDone = !!S.alertsDone[a.key];
  const b = a.bid ? S.bookings[a.bid] : null;
  const acts = [];
  if (b){
    const s = stu(b.studentId);
    if (a.wa) acts.push(waBtn(s.phone, fill(S.cfg.tpl[a.wa.tpl], ctxFor(b, a.wa.ctx)), 'WhatsApp'));
    if (a.acts.includes('abrir')) acts.push(`<button class="btn sm" data-act="booking" data-id="${b.id}">Abrir</button>`);
    if (a.acts.includes('pagar')) acts.push(`<button class="btn sm primary" data-act="booking" data-id="${b.id}">Registrar pago</button>`);
    if (a.acts.includes('liberar') && b.status!=='cancel') acts.push(`<button class="btn sm danger" data-act="release" data-id="${b.id}">Liberar lugar</button>`);
    if (a.acts.includes('renovar')) acts.push(`<button class="btn sm sun" data-act="renew" data-id="${b.id}">Crear renovación</button>`);
  }
  if (a.waRaw) acts.push(waBtn(a.phone, a.waRaw, 'Ofrecer por WhatsApp'));
  if (a.wid) acts.push(`<button class="btn sm" data-act="wait2pre" data-id="${a.wid}">Crear prereserva</button>`);
  if (a.slotD) acts.push(`<button class="btn sm" data-act="slot" data-d="${a.slotD}" data-h="${a.slotH}">Ver horario</button>`);
  if (a.sev!=='info') acts.push(`<button class="btn sm ghost" data-act="${isDone?'undone':'done'}" data-k="${esc(a.key)}">${isDone?'Reabrir':'Marcar atendida'}</button>`);
  let cands = '';
  if (a.keys && a.keys.length){
    const set = new Map(); a.keys.forEach(k => candidatesFor(k).forEach(c => set.set(c.id, c)));
    const list = [...set.values()].sort(prioCmp);
    cands = list.length ? `<div class="cands"><span class="lbl">Interesados en esos horarios</span>${list.slice(0,5).map((c,i) => candRow(c,i)).join('')}</div>` : `<span class="small muted">Nadie en lista de espera para esos horarios.</span>`;
  }
  return `<div class="alert ${a.sev} ${isDone?'done':''}"><span class="stripe"></span><div class="body"><b>${esc(a.title)}</b><span class="small">${esc(a.body)}</span>${cands}<div class="row">${acts.join('')}</div></div></div>`;
}
async function markAlert(key, done){
  const m = Object.assign({}, S.alertsDone);
  if (done) m[key] = new Date().toISOString(); else delete m[key];
  /* depurar marcas de más de 90 días */
  const cut = Date.now() - 90*864e5;
  for (const k of Object.keys(m)) if (new Date(m[k]).getTime() < cut) delete m[k];
  S.alertsDone = m; S.memo = {}; renderMain();
  await dbSet('config', 'alerts', { done: m });
}

    `<button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="wf-save">Guardar</button>`, { wide:true });

function reportOutHtml(){

function bindReports(){

function buildReport(sel, from, to){
  const T = todayS(), L = [];
  const H = t => { L.push(''); L.push(t.toUpperCase()); L.push('-'.repeat(Math.min(60, t.length))); };
  L.push(`IMPULSO ACADÉMICO · Reporte del ${fmtDY(T)} (${hm(new Date())})`);
  const order = REPORTS.map(r=>r[0]).filter(k => sel.includes(k));
  for (const k of order){
    if (k==='resumen'){
      H('Resumen general');
      const m = mondayOf(T); let used=0, total=0;
      for (const key of IMP_KEYS){ const d = addDays(m, kDow(key)-1); total += S.cfg.capImpulso; used += Math.min(S.cfg.capImpulso, occ(d, kHour(key)).length); }
      const act = new Set(S.bk.filter(b => b.type==='impulso' && b.status==='conf' && b.start<=T && T<=b.end).map(b=>b.studentId));
      L.push(`Alumnos con plan pagado vigente: ${act.size}`);
      L.push(`Ocupación de Impulso esta semana: ${used} de ${total} lugares (${total?Math.round(used/total*100):0}%)`);
      L.push(`Prereservas esperando pago: ${S.bk.filter(b=>b.status==='pre').length} (vencidas: ${S.bk.filter(isOverdue).length})`);
      L.push(`En lista de espera: ${activeWait().length}`);
      L.push(`Alertas pendientes: ${pendingCount()}`);
    }
    if (k==='alertas'){
      H('Alertas pendientes');
      const al = computeAlerts().filter(a => !S.alertsDone[a.key] && a.sev!=='info');
      if (!al.length) L.push('Sin alertas pendientes.');
      al.forEach(a => L.push(`${a.sev==='crit'?'[URGENTE] ':'• '}${a.title}\n   ${a.body}`));
    }
    if (k==='ocupacion'){
      H(`Ocupación de Impulso (próximas ${S.cfg.lookWeeks} semanas)`);
      for (const key of IMP_KEYS){
        const vals = [...occurrences(key, T, addDays(T, 7*S.cfg.lookWeeks-1))].map(d => `${pd(d).getDate()}/${pd(d).getMonth()+1}: ${occ(d,kHour(key)).length}/${S.cfg.capImpulso}`);
        L.push(`${DOWL[kDow(key)].padEnd(10)} ${rangeLbl(kHour(key)).padEnd(20)} ${vals.join('  ')}`);
      }
    }
    if (k==='pagos'){
      H(`Pagos verificados del ${fmtDY(from)} al ${fmtDY(to)}`);
      const ps = S.bk.filter(b => b.paidAt && b.paidAt.slice(0,10) >= from && b.paidAt.slice(0,10) <= to).sort((a,b)=>a.paidAt<b.paidAt?-1:1);
      let sum = 0;
      ps.forEach(b => { sum += Number(b.amount)||0; const d = new Date(b.paidAt); L.push(`${fmtDY(ds(d))}  ${labelOf(stu(b.studentId)).padEnd(26)} ${b.type==='impulso'?`Impulso ${planName(b.plan)} (${fmtD(b.start)}–${fmtD(b.end)})`:`Tutoría ${fmtD(b.date)}`}  ${b.amount?'$'+Number(b.amount).toLocaleString('es-MX'):'(sin monto)'}${b.status==='cancel'?' · CANCELADA':''}`); });
      L.push(ps.length ? `Total registrado: $${sum.toLocaleString('es-MX')} en ${ps.length} pago(s)` : 'Sin pagos en el rango.');
    }
    if (k==='prereservas'){
      H('Prereservas esperando pago');
      const ps = S.bk.filter(b => b.status==='pre').sort((a,b) => deadline(a)-deadline(b));
      if (!ps.length) L.push('Ninguna.');
      ps.forEach(b => L.push(`${isOverdue(b)?'[VENCIDA] ':''}${labelOf(stu(b.studentId))} · ${b.type==='impulso'?'Impulso '+fmtSlots(b.slots)+' desde '+fmtD(b.start):'Tutoría '+fmtD(b.date)+' '+hourLbl(b.hour)} · límite ${fmtDT(deadline(b))}`));
    }
    if (k==='vencimientos'){
      H('Planes que terminan en los próximos 14 días');
      const vs = S.bk.filter(b => b.type==='impulso' && b.status==='conf' && b.end>=T && b.end<=addDays(T,14)).sort((a,b)=>a.end<b.end?-1:1);
      if (!vs.length) L.push('Ninguno.');
      vs.forEach(b => { const r = renewalOf(b); L.push(`${labelOf(stu(b.studentId))} · termina ${fmtD(b.end)} · ${fmtSlots(b.slots)} · ${r ? (r.status==='conf'?'renovación pagada':'renovación en prereserva') : 'sin renovar (límite '+fmtDT(renewalDeadline(b))+')'}`); });
    }
    if (k==='espera'){
      H('Lista de espera (en orden de prioridad)');
      const ws = activeWait(); if (!ws.length) L.push('Vacía.');
      ws.forEach((w,i) => { const s = stu(w.studentId), av = availableFrom(w); L.push(`${i+1}. ${labelOf(s)} (${planName(s.plan)}, desde ${fmtDY(s.since)}) · busca ${fmtSlots(w.slots)} · ${av?'lugar desde '+fmtD(av):'sin lugar aún'}`); });
    }
    if (k==='tutorias'){
      H(`Tutorías y reposiciones del ${fmtDY(from)} al ${fmtDY(to)}`);
      const ts = S.bk.filter(b => (b.type==='tutoria'||b.type==='repo') && b.date>=from && b.date<=to && b.status!=='cancel').sort((a,b)=>(a.date+pad(a.hour))<(b.date+pad(b.hour))?-1:1);
      if (!ts.length) L.push('Ninguna.');
      ts.forEach(b => L.push(`${fmtD(b.date)} ${hourLbl(b.hour)} · ${b.type==='repo'?'Reposición':'Tutoría'} · ${labelOf(stu(b.studentId))} · ${b.status==='pre'?'prereserva':b.status==='desplazada'?'desplazada':'confirmada'}`));
    }
    if (k==='alumnos'){
      H('Alumnos con plan vigente');
      const as = S.bk.filter(b => b.type==='impulso' && b.status==='conf' && b.start<=T && T<=b.end).sort((a,b)=>stu(a.studentId).name.localeCompare(stu(b.studentId).name,'es'));
      if (!as.length) L.push('Ninguno.');
      as.forEach(b => { const s = stu(b.studentId); L.push(`${labelOf(s)} · ${planName(b.plan)} · ${fmtSlots(b.slots)} · hasta ${fmtD(b.end)} · tutor ${s.tutor||'—'} ${s.phone||''}`); });
    }
  }
  return L.join('\n');
}

function bindSettings(){
  const nw = $('#pw-new');
  nw.oninput = () => { $('#pw-rules').innerHTML = pwChecks(nw.value).map(([l,ok])=>`<li class="${ok?'ok':''}">${l}</li>`).join(''); };
  $('#pw-form').onsubmit = async e => {
    e.preventDefault(); const err = $('#pw-err'); err.textContent = '';
    const cur = $('#pw-cur').value, np = nw.value, rp = $('#pw-rep').value;
    const a = S.auth;
    const curOk = a ? (await pbkdf2(cur, a.salt, a.iter)) === a.hash : cur === INITIAL_PASS;
    if (!curOk) return err.textContent = 'La contraseña actual no es correcta.';
    if (!pwChecks(np).every(x=>x[1])) return err.textContent = 'La nueva contraseña no cumple todos los requisitos.';
    if (np !== rp) return err.textContent = 'Las contraseñas nuevas no coinciden.';
    if (np === cur) return err.textContent = 'La nueva contraseña debe ser distinta a la actual.';
    if (await dbSet('config', 'auth', await makeAuth(a?.email || INITIAL_EMAIL, np, false))){ toast('Contraseña actualizada'); $('#pw-form').reset(); }
  };
  $('#cfg-form').onsubmit = async e => {
    e.preventDefault();
    const n = (id, min) => { const v = Number($(id).value); return Number.isFinite(v) && v >= min ? Math.floor(v) : null; };
    const capI = n('#cf-capi',1), capT = n('#cf-capt',1), low = n('#cf-low',0), ren = n('#cf-ren',1), look = n('#cf-look',1);
    if ([capI,capT,low,ren,look].some(x => x===null)) return $('#cf-err').textContent = 'Revisa los números: deben ser enteros positivos.';
    const plans = {};
    for (const p of Object.keys(S.cfg.plans)) plans[p] = { name:$(`#cp-${p}-n`).value.trim()||S.cfg.plans[p].name, hours:Number($(`#cp-${p}-h`).value), repos:Math.max(0,Number($(`#cp-${p}-r`).value)||0), price:Number($(`#cp-${p}-p`).value)||0 };
    const tpl = {}; for (const k of Object.keys(TPL_NAMES)) tpl[k] = $(`#tp-${k}`).value;
    const doc = { capImpulso:capI, capTutoria:capT, lowThreshold:low, renewDays:ren, lookWeeks:Math.min(12,look), priority:$('#cf-prio').value,
      reportEmail:$('#cf-mail').value.trim()||INITIAL_EMAIL, tutoriaPrice:Number($('#cf-tp').value)||0, plans, tpl };
    if (await dbSet('config', 'main', doc)) toast('Ajustes guardados');
  };
}

  stufilter: el => { stuFilter = el.dataset.f; renderMain(); },
  newimp: el => openImpForm({ key: el.dataset.key, start: el.dataset.start, studentId: el.dataset.stu }),
  newtut: el => openTutForm({ date: el.dataset.d, hour: el.dataset.h, studentId: el.dataset.stu, type: el.dataset.type }),
  renew: el => { const b = S.bookings[el.dataset.id]; if (!b) return;
    openImpForm({ studentId:b.studentId, plan:b.plan, slots:b.slots, start:addDays(b.end,1), renewalOf:b.id }); },
  release: el => { const b = S.bookings[el.dataset.id]; if (!b) return;
    askConfirm(`¿Liberar el lugar de ${esc(labelOf(stu(b.studentId)))}?`, 'Liberar', async () => { if (await dbUpdate('bookings', b.id, { status:'cancel', cancelledAt:new Date().toISOString(), cancelReason:'sin pago a tiempo' })) toast('Lugar liberado'); }); },
  done: el => markAlert(el.dataset.k, true),
  undone: el => markAlert(el.dataset.k, false),
  addwait: el => openWaitForm(el.dataset.id),
  waitedit: el => openWaitForm(null, el.dataset.id),
  waitclose: el => askConfirm('¿Quitar de la lista de espera?', 'Quitar', async () => { if (await dbUpdate('waitlist', el.dataset.id, { status:'descartada', closedAt:new Date().toISOString() })) toast('Quitado de la lista'); }),
  wait2pre: el => { const w = S.waitlist[el.dataset.id]; if (!w) return; const av = availableFrom(w);
    const s = stu(w.studentId); const plan = S.cfg.plans[s.plan] ? s.plan : (w.slots.length>=4?'plus':'basico');
    openImpForm({ studentId:w.studentId, plan, slots:w.slots, start: av || addDays(todayS(),2) }); },
  repcopy: () => copyText(repText),
  repdl: () => saveFile(`reporte-impulso-${todayS()}.html`, `<!doctype html><meta charset="utf-8"><title>Reporte Impulso Académico ${todayS()}</title><pre style="font:14px/1.5 monospace;white-space:pre-wrap">${esc(repText)}</pre>`),
  syncnow: async () => { if (!S.db || !S.db.gh) return; toast('Sincronizando…'); const st = await S.db.syncNow(); toast(st.state==='ok' ? 'Todo guardado en GitHub' : (st.msg || 'Hay cambios pendientes'), st.state!=='ok'); if (S.view==='ajustes') renderMain(); },
  ghsend: async () => { if (!S.db || !S.db.gh) return;
    if (S.db.pending()) await S.db.syncNow();
    const r = await ghDispatchBackup(S.db.gc).catch(() => ({ ok:false, msg:'Sin conexión con GitHub.' }));
    toast(r.ok ? 'Respaldo solicitado. Llega al correo en 1 a 3 minutos.' : r.msg, !r.ok); },
  ghinstall: async () => { if (!S.db || !S.db.gh) return; toast('Instalando…');
    try { const res = await ghInstallBackup(S.db.gc); const bad = res.filter(x => /^error/.test(x[1]));
      if (bad.length){ toast(`No se pudo instalar (${bad.map(x=>x[1]).join(', ')}). El token necesita “Workflows: Read and write”.`, true); }
      else { lsSet('ia-gh-install-warning', null); toast('Respaldo por correo instalado. Falta agregar los datos del correo en GitHub (secretos).'); renderTabs(); } }
    catch(e){ toast('Sin conexión con GitHub.', true); } },
  ghtoken: () => { closeModal(); S.logged = false; renderSetup(null, S.db && S.db.gc); },
  ghdisconnect: () => { const n = S.db && S.db.pending ? S.db.pending() : 0;
    askConfirm(n ? `Hay ${n} cambio(s) que aún no se suben a GitHub y se perderían. Sincroniza primero. ¿Desconectar de todos modos?` : 'Este dispositivo dejará de tener acceso a la agenda hasta que vuelvas a conectar el token. Los datos siguen a salvo en GitHub.', 'Desconectar', () => {
      const gc = S.db.gc, tag = gc.owner + '/' + gc.repo;
      try { localStorage.removeItem(GH_CFG_KEY); localStorage.removeItem('ia-storage'); localStorage.removeItem('ia-gh-cache:'+tag); localStorage.removeItem('ia-gh-queue:'+tag); } catch(e){}
      ssSet('ia-sess', null); location.reload(); }); },
  backup: async () => { if (await saveFile(`respaldo-impulso-${todayS()}.json`, JSON.stringify({ exportedAt:new Date().toISOString(), config:S.cfg, students:S.students, bookings:S.bookings, waitlist:S.waitlist }, null, 2))){ lsSet('ia-last-backup', Date.now()); renderTabs(); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName==='A') return;
  if (el.dataset.act==='overlay'){ fn(el, e); return; }
  e.preventDefault(); fn(el, e);
});
document.addEventListener('change', e => {
  if (e.target.id==='imp-file' && e.target.files && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value = ''; return; }
  if (e.target.id==='cal-date' && e.target.value){ S.cal.date = e.target.value; renderMain(); }
  if (e.target.id==='cal-jump' && e.target.value){
    const v = e.target.value, n = +v.slice(1), T = todayS();
    if (v[0]==='w'){ S.cal.date = addDays(T, 7*n); S.cal.mode = 'semana'; }
    else { const d = pd(T); S.cal.date = ds(new Date(d.getFullYear(), d.getMonth()+n, 1)); S.cal.mode = 'mes'; }
    renderMain();
  }
});
document.addEventListener('input', e => {
  if (e.target.id==='stu-q'){ stuQuery = e.target.value; const pos = e.target.selectionStart; renderMain(); const q = $('#stu-q'); if (q){ q.focus(); q.setSelectionRange(pos,pos); } }
});
document.addEventListener('keydown', e => { if (e.key==='Escape'){ if ($('#confirm-root').innerHTML) $('#confirm-root').innerHTML=''; else if (modalState) closeModal(); } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S.logged && VIEWS.some(v=>v[0]===h) && h!==S.view){ S.view = h; renderMain(); } });
/* refrescar alertas que dependen de la hora (vencimientos) cada 5 minutos */
setInterval(() => { if (S.logged){ S.memo = {}; renderTabs(); if (S.view==='alertas' || S.view==='calendario') renderMain(); } }, 5*60e3);

/* =====================================================================
   ARRANQUE
   ===================================================================== */
async function boot(){
  if (!window.crypto || !crypto.subtle){ renderLogin('Este navegador no permite el cifrado necesario para la contraseña. Ábrelo con Chrome, Edge, Safari o Firefox actualizados.'); return; }
  if (!window.claude || !window.claude.use){
    /* Fuera de claude.ai: GitHub (recomendado) o solo este navegador */
    try { localStorage.setItem('ia-test','1'); localStorage.removeItem('ia-test'); }
    catch(e){ renderLogin('Este navegador no permite guardar datos (modo privado o almacenamiento bloqueado). Ábrelo en una ventana normal.'); return; }
    const mode = lsGet('ia-storage'), gc = lsGet(GH_CFG_KEY);
    if (mode==='github' && gc){
      S.db = githubDB(gc);
      S.db.onStatus.add(() => { renderSync(); if (S.logged) renderTabs(); });
      $('#app').querySelector('p') && ($('#app').querySelector('p').textContent = 'Descargando la agenda desde GitHub…');
      await S.db.ready();
      if (!S.db.hasCache()){ renderSetup(S.db.status.msg || 'No se pudo leer el repositorio de datos. Revisa el internet o el token.', gc); return; }
    } else if (mode==='local'){
      S.db = localDB(); S.local = true;
    } else { renderSetup(); return; }
    subscribeConfig();
    const waitL = setInterval(() => { if (S.auth !== undefined){ clearInterval(waitL); if (sessionValid()) enterApp(); else if (!loginRendered) renderLogin(); } }, 50);
    return;
  }
  S.db = await claude.use('db');
  S.userCap = await claude.use('user');
  if (S.userCap){ try { S.isOwner = await S.userCap.isOwner(); } catch(e){} }
  if (!S.db){ renderLogin('No se pudo conectar con la base de datos. Inicia sesión en claude.ai y recarga la página. Si la abriste con un enlace compartido, pide acceso de edición.'); return; }
  subscribeConfig();
  const wait = setInterval(() => {
    if (S.auth !== undefined){ clearInterval(wait); if (sessionValid()) enterApp(); else if (!loginRendered) renderLogin(); }
  }, 100);
}
if (typeof window !== 'undefined' && !window.__TEST__) boot();
</script>
